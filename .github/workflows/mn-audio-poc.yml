name: mn-audio-poc

on:
  push:
    branches: [audio-poc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: OronTTS と その学習data を実物で読む
        run: |
          mkdir -p out
          python3 - <<'PY' 2>&1 | tee out/50-oron.txt
          import json, urllib.request

          def get(url, raw=False):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'mn90-poc'})
                  with urllib.request.urlopen(req, timeout=40) as r:
                      b = r.read()
                      return b.decode('utf-8', 'replace') if raw else json.loads(b)
              except Exception as e:
                  return ("(ERR %s)" % e) if raw else None

          for kind, i in [("models", "btsee/oron-tts"), ("models", "naba0106/oron-tts"),
                          ("datasets", "btsee/mbspeech_mn")]:
              print("\n" + "=" * 72)
              print(kind.upper()[:-1] + ":", i)
              info = get("https://huggingface.co/api/%s/%s" % (kind, i))
              if not isinstance(info, dict):
                  print("  (取得不可)"); continue
              cd = info.get("cardData") or {}
              print("  license :", cd.get("license"), "|", [t for t in info.get("tags", []) if t.startswith("license:")])
              print("  datasets:", cd.get("datasets"))
              print("  gated   :", info.get("gated"), " dl:", info.get("downloads"))
              print("  files   :", [s.get("rfilename") for s in (info.get("siblings") or [])][:40])
              base = "https://huggingface.co/" + ("datasets/" if kind == "datasets" else "") + i
              rd = get(base + "/raw/main/README.md", raw=True) or ""
              print("  --- README (3000) ---")
              print(rd[:3000])
              for f in ("LICENSE", "LICENSE.md", "LICENSE.txt", "NOTICE"):
                  lic = get(base + "/raw/main/" + f, raw=True) or ""
                  if lic and not lic.startswith("(ERR"):
                      print("  --- %s (1000) ---" % f)
                      print(lic[:1000]); break
          PY

      - name: OronTTS で実際に音を作る
        if: always()
        run: |
          pip install -q torch torchaudio soundfile numpy 2>&1 | tail -2 || true
          python3 - <<'PY' 2>&1 | tee out/51-oron-synth.txt
          import json, os, time, urllib.request
          def get(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'mn90-poc'})
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return json.loads(r.read())
              except Exception:
                  return None
          info = get("https://huggingface.co/api/models/btsee/oron-tts") or {}
          files = [s.get("rfilename") for s in (info.get("siblings") or [])]
          print("files:", files)
          cfgs = [f for f in files if f.endswith(".json") or f.endswith(".yaml") or f.endswith(".yml")]
          print("configs:", cfgs)
          try:
              from huggingface_hub import hf_hub_download
              for f in cfgs[:4]:
                  p = hf_hub_download("btsee/oron-tts", f)
                  txt = open(p, encoding="utf-8", errors="replace").read()
                  print("\n--- %s (1200) ---" % f)
                  print(txt[:1200])
          except Exception as e:
              print("NG config:", type(e).__name__, str(e)[:300])
          PY

      - name: 権利7層のまとめ（最後に出す）
        if: always()
        run: |
          python3 - <<'PY' 2>&1 | tee out/52-chain.txt
          import json, urllib.request
          def get(u):
              try:
                  req = urllib.request.Request(u, headers={'User-Agent': 'mn90-poc'})
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return json.loads(r.read())
              except Exception:
                  return None
          def raw(u):
              try:
                  req = urllib.request.Request(u, headers={'User-Agent': 'mn90-poc'})
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return r.read().decode('utf-8', 'replace')
              except Exception:
                  return ""
          print("%-34s %-12s %-24s %s" % ("REPO", "LICENSE", "DATASET", "声の出所がREADMEにあるか"))
          for kind, i in [("models", "btsee/oron-tts"), ("models", "naba0106/oron-tts"),
                          ("models", "Maax-Bits/oron-tts-bucket"),
                          ("datasets", "btsee/mbspeech_mn"),
                          ("datasets", "Blgn94/mongolian-stt-dataset"),
                          ("datasets", "google/fleurs")]:
              info = get("https://huggingface.co/api/%s/%s" % (kind, i))
              if not isinstance(info, dict):
                  print("%-34s %s" % (i[:34], "(取得不可)")); continue
              cd = info.get("cardData") or {}
              lic = cd.get("license")
              if isinstance(lic, list): lic = ",".join(lic)
              ds = ",".join(cd.get("datasets") or []) or "-"
              base = "https://huggingface.co/" + ("datasets/" if kind == "datasets" else "") + i
              rd = raw(base + "/raw/main/README.md").lower()
              words = [w for w in ("speaker", "voice", "recorded", "bible", "audiobook",
                                   "consent", "permission", "volunteer", "narrator", "hour")
                       if w in rd]
              print("%-34s %-12s %-24s %s" % (i[:34], str(lic or "(無)")[:12], ds[:24], ",".join(words) or "(なし)"))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mn-audio-poc
          path: out/
          retention-days: 7
