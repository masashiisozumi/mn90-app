name: mn-audio-poc

on:
  push:
    branches: [audio-poc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 候補一覧とlicenseを1行ずつ
        run: |
          mkdir -p out
          python3 - <<'PY' 2>&1 | tee out/10-table.txt
          import json, urllib.request, urllib.parse

          def get(url, raw=False):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'mn90-poc'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      b = r.read()
                      return b.decode('utf-8', 'replace') if raw else json.loads(b)
              except Exception as e:
                  return ("(ERR %s)" % e) if raw else None

          ids = set(["Bokhbat/mongolian-vits-tts", "btseee/oron-tts", "facebook/mms-tts-mon"])
          queries = [
              [("search", "mongolian"), ("filter", "text-to-speech"), ("limit", 100)],
              [("search", "khalkha"), ("limit", 50)],
              [("search", "mongol tts"), ("limit", 50)],
              [("filter", "mn"), ("filter", "text-to-speech"), ("limit", 100)],
              [("filter", "mn"), ("filter", "text-to-audio"), ("limit", 100)],
          ]
          for q in queries:
              d = get("https://huggingface.co/api/models?" + urllib.parse.urlencode(q))
              if isinstance(d, list):
                  for m in d:
                      if m.get("modelId"):
                          ids.add(m["modelId"])

          print("candidates:", len(ids))
          rows = []
          for i in sorted(ids):
              info = get("https://huggingface.co/api/models/" + i)
              if not isinstance(info, dict):
                  rows.append((i, "(api-fail)", "", "", 0, False, ""))
                  continue
              tags = info.get("tags", [])
              cd = info.get("cardData") or {}
              lic = ",".join([t[8:] for t in tags if t.startswith("license:")]) or "-"
              cdl = str(cd.get("license") or "-")
              ds = ",".join(cd.get("datasets") or []) or "-"
              gated = bool(info.get("gated"))
              mn = "mn" in tags or "mon" in tags or "mongolian" in " ".join(tags).lower() \
                   or "mongol" in i.lower() or "mms-tts-mon" in i
              rows.append((i, lic, cdl, ds, info.get("downloads") or 0, gated, "MN" if mn else ""))

          rows.sort(key=lambda r: (r[6] != "MN", -r[4]))
          print("%-52s %-16s %-14s %-8s %-5s %s" % ("MODEL", "LICENSE-TAG", "CARD-LICENSE", "DL", "GATED", "MN?"))
          for r in rows:
              print("%-52s %-16s %-14s %-8s %-5s %s" % (r[0][:52], r[1][:16], r[2][:14], r[4], r[5], r[6]))
          print()
          print("=== datasets (MN候補のみ) ===")
          for r in rows:
              if r[6] == "MN":
                  print(r[0], "->", r[3])
          PY

      - name: MN候補のREADME/LICENSEを実物で読む
        run: |
          python3 - <<'PY' 2>&1 | tee out/11-mn-license.txt
          import json, urllib.request, re

          def get(url, raw=False):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'mn90-poc'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      b = r.read()
                      return b.decode('utf-8', 'replace') if raw else json.loads(b)
              except Exception as e:
                  return ("(ERR %s)" % e) if raw else None

          for i in ["Bokhbat/mongolian-vits-tts", "btseee/oron-tts", "facebook/mms-tts-mon"]:
              print("\n" + "=" * 70)
              print("MODEL:", i)
              info = get("https://huggingface.co/api/models/" + i)
              if not isinstance(info, dict):
                  print("  (存在しない / 取得不可)")
                  continue
              cd = info.get("cardData") or {}
              print("  license-tag:", [t for t in info.get("tags", []) if t.startswith("license:")])
              print("  cardData.license:", cd.get("license"))
              print("  cardData.datasets:", cd.get("datasets"))
              print("  gated:", info.get("gated"), " downloads:", info.get("downloads"))
              print("  files:", [s.get("rfilename") for s in (info.get("siblings") or [])][:30])
              rd = get("https://huggingface.co/%s/raw/main/README.md" % i, raw=True) or ""
              print("  --- README (2000) ---")
              print(rd[:2000])
              for f in ("LICENSE", "LICENSE.md", "LICENSE.txt"):
                  lic = get("https://huggingface.co/%s/raw/main/%s" % (i, f), raw=True) or ""
                  if lic and not lic.startswith("(ERR"):
                      print("  --- %s (800) ---" % f)
                      print(lic[:800])
                      break
          PY

      - name: 実際に音を作る（MMS-TTS mon / 参考比較のみ）
        run: |
          pip install -q "transformers>=4.44" torch --index-url https://pypi.org/simple 2>&1 | tail -3
          python3 - <<'PY' 2>&1 | tee out/12-synth.txt
          import time, os
          TEXT = "Баярлалаа"   # 既存 production_ready の g_thanks。新しいモンゴル語は作らない
          t0 = time.time()
          try:
              from transformers import VitsModel, AutoTokenizer
              import torch, wave, numpy as np
              mid = "facebook/mms-tts-mon"
              tok = AutoTokenizer.from_pretrained(mid)
              model = VitsModel.from_pretrained(mid)
              t1 = time.time()
              inputs = tok(TEXT, return_tensors="pt")
              with torch.no_grad():
                  out = model(**inputs).waveform
              t2 = time.time()
              wav = out.squeeze().numpy()
              sr = model.config.sampling_rate
              os.makedirs("out", exist_ok=True)
              p = "out/mms_mon_thanks.wav"
              with wave.open(p, "w") as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
                  w.writeframes((np.clip(wav, -1, 1) * 32767).astype("<i2").tobytes())
              print("OK synthesized")
              print("  model      :", mid)
              print("  load_sec   : %.1f" % (t1 - t0))
              print("  synth_sec  : %.2f" % (t2 - t1))
              print("  sample_rate:", sr)
              print("  duration_s : %.2f" % (len(wav) / sr))
              print("  bytes      :", os.path.getsize(p))
          except Exception as e:
              print("NG:", type(e).__name__, e)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mn-audio-poc
          path: out/
          retention-days: 7
