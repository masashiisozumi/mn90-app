name: mn-audio-poc

on:
  push:
    branches: [audio-poc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: モンゴル語TTSを全数あたる（licenseとdatasetを実物で）
        run: |
          mkdir -p out
          python3 - <<'PY' 2>&1 | tail -200 | tee out/40-all-models.txt
          import json, urllib.request, urllib.parse, time

          def api(path, params=None):
              url = "https://huggingface.co/api/" + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              for _ in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'mn90-poc'})
                      with urllib.request.urlopen(req, timeout=40) as r:
                          return json.loads(r.read())
                  except Exception:
                      time.sleep(2)
              return None

          def raw(repo, f, kind="models"):
              base = "https://huggingface.co/" + ("datasets/" if kind == "datasets" else "") + repo
              try:
                  req = urllib.request.Request("%s/raw/main/%s" % (base, f),
                                               headers={'User-Agent': 'mn90-poc'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.read().decode('utf-8', 'replace')
              except Exception:
                  return ""

          # モンゴル語 + 音声合成 のモデルを、名前ではなく tag で全部取る
          ids = set()
          for pt in ["text-to-speech", "text-to-audio"]:
              page = 0
              while page < 6:
                  d = api("models", [("filter", "mn"), ("filter", pt),
                                     ("limit", 100), ("skip", page * 100), ("full", "true")])
                  if not isinstance(d, list) or not d:
                      break
                  for m in d:
                      if m.get("modelId"):
                          ids.add(m["modelId"])
                  if len(d) < 100:
                      break
                  page += 1
          for q in ["mongolian", "mongol", "khalkha", "монгол"]:
              d = api("models", [("search", q), ("limit", 100)])
              if isinstance(d, list):
                  for m in d:
                      mid = m.get("modelId") or ""
                      tags = " ".join(m.get("tags", [])).lower()
                      if "text-to-speech" in tags or "tts" in mid.lower() or "vits" in tags:
                          ids.add(mid)

          print("走査したモデル数:", len(ids))
          print()
          rows = []
          for i in sorted(ids):
              info = api("models/" + i)
              if not isinstance(info, dict):
                  continue
              cd = info.get("cardData") or {}
              tags = info.get("tags", [])
              lic = str(cd.get("license") or "")
              if not lic:
                  t = [x[8:] for x in tags if x.startswith("license:")]
                  lic = t[0] if t else ""
              ds = cd.get("datasets") or []
              # モンゴル語専用かどうか (多言語モデルは声の出所が更に辿れないので分ける)
              langs = cd.get("language") or []
              if isinstance(langs, str):
                  langs = [langs]
              mn_only = len(langs) <= 2 and any(str(l).lower() in ("mn", "mon", "mongolian") for l in langs)
              rows.append({
                  "id": i, "lic": lic or "(無)", "ds": ",".join(ds) or "(無)",
                  "dl": info.get("downloads") or 0, "mn_only": mn_only,
                  "gated": bool(info.get("gated")),
              })

          PERMISSIVE = ("apache-2.0", "mit", "cc0-1.0", "cc-by-4.0", "bsd", "bsd-3-clause", "cc-by-sa-4.0")
          print("=== モンゴル語専用 TTS ===")
          print("%-44s %-14s %-24s %-6s" % ("MODEL", "LICENSE", "DATASET(申告)", "DL"))
          for r in sorted(rows, key=lambda x: (not x["mn_only"], -x["dl"])):
              if r["mn_only"]:
                  print("%-44s %-14s %-24s %-6s" % (r["id"][:44], r["lic"][:14], r["ds"][:24], r["dl"]))
          print()
          print("=== 両方そろっている候補 (license が緩い かつ dataset を申告している) ===")
          hit = [r for r in rows if r["lic"] in PERMISSIVE and r["ds"] != "(無)"]
          if not hit:
              print("  無し")
          for r in hit:
              print("  %-44s %-14s %s" % (r["id"][:44], r["lic"], r["ds"]))
          print()
          print("=== 多言語だがモンゴル語を含む TTS (件数のみ) ===")
          print("  ", len([r for r in rows if not r["mn_only"]]), "件")
          PY

      - name: モンゴル語の音声データ側を全数あたる
        if: always()
        run: |
          python3 - <<'PY' 2>&1 | tail -80 | tee out/41-datasets.txt
          import json, urllib.request, urllib.parse, time

          def api(path, params=None):
              url = "https://huggingface.co/api/" + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              for _ in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'mn90-poc'})
                      with urllib.request.urlopen(req, timeout=40) as r:
                          return json.loads(r.read())
                  except Exception:
                      time.sleep(2)
              return None

          ids = set(["google/fleurs", "openslr/librispeech_asr", "mozilla-foundation/common_voice_17_0"])
          for f in [("filter", "mn"), ("search", "mongolian")]:
              for extra in [[("filter", "text-to-speech")], [("filter", "audio")], []]:
                  d = api("datasets", [f] + extra + [("limit", 100)])
                  if isinstance(d, list):
                      for m in d:
                          if m.get("id"):
                              ids.add(m["id"])

          print("走査したデータ数:", len(ids))
          print("%-52s %-16s %-6s" % ("DATASET", "LICENSE", "GATED"))
          clean = []
          for i in sorted(ids):
              info = api("datasets/" + i)
              if not isinstance(info, dict):
                  continue
              cd = info.get("cardData") or {}
              lic = cd.get("license")
              if isinstance(lic, list):
                  lic = ",".join(lic)
              lic = str(lic or "(無)")
              g = bool(info.get("gated"))
              tags = " ".join(info.get("tags", [])).lower()
              speechy = "audio" in tags or "speech" in tags or "text-to-speech" in tags
              if speechy:
                  print("%-52s %-16s %-6s" % (i[:52], lic[:16], g))
                  if lic not in ("(無)",) and not g:
                      clean.append((i, lic))
          print()
          print("=== license がはっきりしている音声データ ===")
          for i, l in clean:
              print("  %-52s %s" % (i, l))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mn-audio-poc
          path: out/
          retention-days: 7
