name: mn-audio-poc

on:
  push:
    branches: [audio-poc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio-poc

      - name: license を一次情報で再確認する
        run: |
          python3 - <<'PY' 2>&1 | tee license-check.txt
          import json, urllib.request
          def get(u, raw=False):
              req = urllib.request.Request(u, headers={'User-Agent': 'mn90'})
              with urllib.request.urlopen(req, timeout=40) as r:
                  b = r.read()
                  return b.decode('utf-8', 'replace') if raw else json.loads(b)
          info = get("https://huggingface.co/api/models/facebook/mms-tts-mon")
          cd = info.get("cardData") or {}
          print("model   :", info.get("id"))
          print("license :", cd.get("license"), "|",
                [t for t in info.get("tags", []) if t.startswith("license:")])
          print("pipeline:", cd.get("pipeline_tag") or [t for t in info.get("tags", []) if "text-to-speech" in t])
          rd = get("https://huggingface.co/facebook/mms-tts-mon/raw/main/README.md", raw=True)
          for ln in rd.split("\n")[:20]:
              if ln.strip(): print("  |", ln[:110])
          assert (cd.get("license") or "").lower() == "cc-by-nc-4.0", "license が想定と違う。止める"
          print()
          print("確認: CC BY-NC 4.0。非商用利用に限り、表示(attribution)を条件に利用できる")
          PY

      - name: 140件を合成する（浮いたものは作り直す）
        run: |
          sudo apt-get -qq update >/dev/null 2>&1 || true
          sudo apt-get -qq install -y ffmpeg >/dev/null 2>&1
          pip install -q "transformers>=4.44" torch numpy 2>&1 | tail -2
          mkdir -p audio-out
          python3 - <<'PY' 2>&1 | tail -45 | tee synth-log.txt
          import json, os, time, wave, subprocess, hashlib
          import numpy as np
          import torch
          from transformers import VitsModel, AutoTokenizer

          MODEL = "facebook/mms-tts-mon"
          # **ゆっくりめにする。**既定は学習者には速い。
          # 1.0 が既定で、小さいほど遅い
          RATE = 0.85
          texts = json.load(open("mn-texts.json", encoding="utf-8"))
          t0 = time.time()
          tok = AutoTokenizer.from_pretrained(MODEL)
          model = VitsModel.from_pretrained(MODEL); model.eval()
          model.speaking_rate = RATE
          sr = model.config.sampling_rate
          print("model 読み込み %.1f 秒 / %d Hz / %d 件 / 速さ %.2f"
                % (time.time() - t0, sr, len(texts), RATE))

          def synth(text, seed):
              # VITS は長さの決め方に乱数を使う。**たまに途中で切れた音が出る。**
              # 種を変えれば作り直せるので、種を指定できるようにしておく
              torch.manual_seed(seed)
              with torch.no_grad():
                  w = model(**tok(text, return_tensors="pt")).waveform.squeeze().numpy()
              peak = float(np.max(np.abs(w))) or 1.0
              w = w / peak * 0.85
              nz = np.where(np.abs(w) > 0.003)[0]     # 静かな末尾を切り落とさない
              if len(nz):
                  a = max(0, nz[0] - int(sr * 0.06)); b = min(len(w), nz[-1] + int(sr * 0.18))
                  w = w[a:b]
              return w

          chars = {cid: len(rec["mn"].replace(" ", "")) for cid, rec in texts.items()}
          waves = {}
          t1 = time.time()
          for i, (cid, rec) in enumerate(sorted(texts.items())):
              waves[cid] = synth(rec["mn"], 1234 + i)
              if (i + 1) % 50 == 0: print("  %d 件" % (i + 1))

          def rate_of(cid):
              return (len(waves[cid]) / sr) / max(1, chars[cid])

          # набор全体の「1文字あたり何秒か」を基準に、浮いたものを探して作り直す
          TOL = 2.0
          retried = {}
          for attempt in range(1, 7):
              rates = sorted(rate_of(c) for c in waves)
              med = rates[len(rates) // 2]
              bad = [c for c in waves if rate_of(c) > med * TOL or rate_of(c) < med / TOL]
              if not bad:
                  print("作り直しが要るものは無し (%d 回目で安定)" % attempt); break
              print("%d 回目: 浮いているもの %d 件 → 作り直す" % (attempt, len(bad)))
              for c in bad:
                  best = waves[c]; bestd = abs(rate_of(c) - med)
                  for k in range(4):
                      w2 = synth(texts[c]["mn"], 90000 + attempt * 1000 + k * 7 + len(c))
                      d = abs((len(w2) / sr) / max(1, chars[c]) - med)
                      if d < bestd: best, bestd = w2, d
                  waves[c] = best
                  retried[c] = retried.get(c, 0) + 1
          else:
              print("注意: 何度作り直しても浮いたままのものが残った")

          rows = []
          for cid in sorted(waves):
              w = waves[cid]
              raw = "audio-out/%s.wav" % cid
              with wave.open(raw, "w") as f:
                  f.setnchannels(1); f.setsampwidth(2); f.setframerate(sr)
                  f.writeframes((np.clip(w, -1, 1) * 32767).astype("<i2").tobytes())
              mp3 = "audio-out/%s.mp3" % cid
              subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", raw,
                              "-codec:a", "libmp3lame", "-b:a", "48k", "-ac", "1", "-ar", "24000", mp3],
                             check=True)
              os.remove(raw)
              rows.append({"id": cid, "bytes": os.path.getsize(mp3),
                           "sha256": hashlib.sha256(open(mp3, "rb").read()).hexdigest(),
                           "duration": round(len(w) / sr, 3),
                           "contentRevision": texts[cid]["rev"]})
          dt = time.time() - t1
          total = sum(r["bytes"] for r in rows)
          fin = sorted((len(waves[c]) / sr) / max(1, chars[c]) for c in waves)
          print("合成 %d 件 / %.1f 秒 / 合計 %.2f MB" % (len(rows), dt, total / 1e6))
          print("長さ 最短 %.2f 秒 / 最長 %.2f 秒"
                % (min(r["duration"] for r in rows), max(r["duration"] for r in rows)))
          print("1文字あたり 最短 %.3f 秒 / 中央 %.3f 秒 / 最長 %.3f 秒"
                % (fin[0], fin[len(fin) // 2], fin[-1]))
          print("作り直した件数: %d" % len(retried))
          json.dump({"model": MODEL, "license": "cc-by-nc-4.0", "sampleRate": sr,
                     "format": "mp3", "bitrateKbps": 48, "speakingRate": RATE,
                     "generatedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                     "synthSeconds": round(dt, 1), "totalBytes": total,
                     "retried": retried, "items": rows},
                    open("audio-out/index.json", "w"), ensure_ascii=False, indent=1)
          PY

      - name: 中身をあらためて検査する
        run: |
          python3 - <<'PY' 2>&1 | tail -25 | tee quality-log.txt
          import json, os, subprocess
          idx = json.load(open("audio-out/index.json"))
          bad = []
          for r in idx["items"]:
              p = "audio-out/%s.mp3" % r["id"]
              if not os.path.exists(p) or os.path.getsize(p) < 512:
                  bad.append((r["id"], "小さすぎる")); continue
              head = open(p, "rb").read(4)
              if not (head[:3] == b"ID3" or (head[0] == 0xFF and (head[1] & 0xE0) == 0xE0)):
                  bad.append((r["id"], "mp3として読めない"))
              if r["duration"] < 0.25: bad.append((r["id"], "短すぎる"))
              if r["duration"] > 20: bad.append((r["id"], "長すぎる"))
          texts = json.load(open("mn-texts.json", encoding="utf-8"))
          rates = []
          for r in idx["items"]:
              c = len(texts[r["id"]]["mn"].replace(" ", ""))
              if c: rates.append((r["duration"] / c, r["id"]))
          rates.sort()
          med = rates[len(rates) // 2][0]
          for v, cid in rates:
              if v > med * 2.0 or v < med / 2.0:
                  bad.append((cid, "набор全体から浮いている (1文字 %.3f 秒 / 目安 %.3f 秒)" % (v, med)))
          print("検査 %d 件 / 問題 %d 件" % (len(idx["items"]), len(bad)))
          for b in bad[:20]: print("  !", b)
          print("合計 %.2f MB / 平均 %.1f KB"
                % (idx["totalBytes"] / 1e6, idx["totalBytes"] / len(idx["items"]) / 1e3))
          PY

      - name: 生成した音声をブランチへ置く
        run: |
          git config user.name "mn90-audio-bot"
          git config user.email "noreply@github.com"
          git checkout -B audio-assets
          git add -f audio-out license-check.txt synth-log.txt quality-log.txt
          git commit -q -m "facebook/mms-tts-mon で 140件を合成 (CC BY-NC 4.0 / 非商用)" || echo "変更なし"
          git push -f origin audio-assets
          echo "pushed to audio-assets"
