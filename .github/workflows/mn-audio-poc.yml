name: mn-audio-poc

on:
  push:
    branches: [audio-poc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: モンゴル語音声データの出所を、要点だけ抜き出す
        run: |
          mkdir -p out
          python3 - <<'PY' 2>&1 | tail -120 | tee out/80-provenance.txt
          import json, re, urllib.request, urllib.parse

          def get(url, raw=False):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'mn90-poc'})
                  with urllib.request.urlopen(req, timeout=45) as r:
                      b = r.read()
                      return b.decode('utf-8', 'replace') if raw else json.loads(b)
              except Exception as e:
                  return ("(ERR %s)" % e) if raw else None

          ids = set(["google/fleurs", "Blgn94/mongolian-stt-dataset",
                     "Otgonbaatar/Mongolian_number_1-10", "btsee/mbspeech_mn",
                     "Sodkhuu/Mongolian_audios", "Tsedee/monsub-mongolian-asr",
                     "shunyalabs/mongolian-speech-dataset", "Bokhbat/mongolian-tts-dataset",
                     "Enkhmanlai/common-voice-mongolian-validated"])
          for f in [[("filter", "mn")], [("search", "mongolian")]]:
              for extra in [[("filter", "audio")], [("filter", "text-to-speech")], []]:
                  d = get("https://huggingface.co/api/datasets?" +
                          urllib.parse.urlencode(f + extra + [("limit", 100)]))
                  if isinstance(d, list):
                      for m in d:
                          if m.get("id"): ids.add(m["id"])

          # 出所を示す文だけを抜く。全文は長いので載せない
          KEY = ("record", "speaker", "volunteer", "consent", "collect", "commission",
                 "crowdsourc", "bible", "broadcast", "youtube", "scrap", "narrator",
                 "professional", "studio", "permission", "copyright", "hour", "source")
          print("%-44s %-14s %s" % ("DATASET", "LICENSE", "出所の記述"))
          print("-" * 100)
          rows = []
          for i in sorted(ids):
              info = get("https://huggingface.co/api/datasets/" + i)
              if not isinstance(info, dict): continue
              tags = " ".join(info.get("tags", [])).lower()
              if not ("audio" in tags or "speech" in tags): continue
              cd = info.get("cardData") or {}
              lic = cd.get("license")
              if isinstance(lic, list): lic = ",".join(lic)
              lic = str(lic or "(無)")
              rd = get("https://huggingface.co/datasets/%s/raw/main/README.md" % i, raw=True) or ""
              sents = []
              for ln in re.split(r"[\n。.]", rd):
                  l = ln.strip()
                  if 20 < len(l) < 200 and any(k in l.lower() for k in KEY):
                      sents.append(l)
              rows.append((i, lic, sents))
              print("%-44s %-14s %s" % (i[:44], lic[:14],
                    (sents[0][:60] if sents else "(出所の記述なし)")))

          print()
          print("=== license がある候補の、出所の記述を全部 ===")
          for i, lic, sents in rows:
              if lic == "(無)":
                  continue
              print("\n--- %s (%s) ---" % (i, lic))
              if not sents:
                  print("   出所の記述が1つも無い")
              for s in sents[:8]:
                  print("   " + s[:180])
          PY

      - name: FLEURS の大元 (論文と配布元) を確かめる
        if: always()
        run: |
          python3 - <<'PY' 2>&1 | tail -60 | tee out/81-fleurs.txt
          import re, urllib.request

          def raw(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'mn90-poc'})
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return r.read().decode('utf-8', 'replace')
              except Exception as e:
                  return "(ERR %s)" % e

          KEY = ("record", "speaker", "licen", "cc-by", "creative commons", "collect",
                 "commission", "native", "hour", "consent", "annotat", "crowd")
          for name, url in [
              ("FLEURS card", "https://huggingface.co/datasets/google/fleurs/raw/main/README.md"),
              ("FLEURS 論文 (arXiv abs)", "https://arxiv.org/abs/2205.12446"),
              ("XTREME-S 配布元", "https://raw.githubusercontent.com/google-research/xtreme/master/README.md"),
          ]:
              print("\n" + "=" * 72)
              print(name)
              t = raw(url)
              if t.startswith("(ERR"):
                  print("  ", t[:120]); continue
              t = re.sub(r"<[^>]+>", " ", t)
              lines = [re.sub(r"\s+", " ", l).strip() for l in re.split(r"[\n。.]", t)]
              hits = [l for l in lines if 25 < len(l) < 260 and any(k in l.lower() for k in KEY)]
              seen = set()
              for l in hits[:14]:
                  if l in seen: continue
                  seen.add(l)
                  print("  " + l[:230])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mn-audio-poc
          path: out/
          retention-days: 7
