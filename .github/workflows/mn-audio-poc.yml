name: mn-audio-poc

on:
  push:
    branches: [audio-poc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: mbspeech の出所を上流までたどる
        run: |
          mkdir -p out
          python3 - <<'PY' 2>&1 | tail -160 | tee out/60-provenance.txt
          import json, urllib.request

          def get(url, raw=False):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'mn90-poc'})
                  with urllib.request.urlopen(req, timeout=40) as r:
                      b = r.read()
                      return b.decode('utf-8', 'replace') if raw else json.loads(b)
              except Exception as e:
                  return ("(ERR %s)" % e) if raw else None

          print("=== 1. HF 側のファイル一覧 (READMEの外に出所が書かれていないか) ===")
          for kind, i in [("datasets", "btsee/mbspeech_mn"), ("models", "btsee/oron-tts")]:
              info = get("https://huggingface.co/api/%s/%s" % (kind, i))
              if isinstance(info, dict):
                  print(" ", i, "->", [s.get("rfilename") for s in (info.get("siblings") or [])])

          print()
          print("=== 2. データの付随情報 ===")
          for f in ("dataset_infos.json", "README.md", ".gitattributes"):
              txt = get("https://huggingface.co/datasets/btsee/mbspeech_mn/raw/main/" + f, raw=True) or ""
              if txt and not txt.startswith("(ERR"):
                  print("--- %s (600) ---" % f)
                  print(txt[:600])

          print()
          print("=== 3. 上流の MBSpeech (GitHub) を読む ===")
          for url in [
              "https://raw.githubusercontent.com/tugstugi/mongolian-nlp/master/README.md",
              "https://raw.githubusercontent.com/tugstugi/pytorch-dc-tts/master/README.md",
          ]:
              txt = get(url, raw=True) or ""
              print("\n--- %s ---" % url.split("/")[4])
              if txt.startswith("(ERR") or not txt:
                  print("  (取得不可)"); continue
              low = txt.lower()
              # 出所と条件に関わる行だけを抜き出す (全文は長い)
              keys = ("mbspeech", "bible", "license", "dataset", "speaker", "recorded",
                      "copyright", "permission", "non-commercial", "commercial")
              hits = [ln for ln in txt.split("\n") if any(k in ln.lower() for k in keys)]
              for ln in hits[:40]:
                  print("  " + ln.strip()[:200])

          print()
          print("=== 4. まとめ ===")
          print("  ここで『誰が録音し、どういう許諾か』が読み取れなければ、")
          print("  ④声の元の録音 は unknown のまま。unknown は採用しない。")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mn-audio-poc
          path: out/
          retention-days: 7
