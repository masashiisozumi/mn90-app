name: mn-audio-poc

on:
  push:
    branches: [audio-poc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio-poc

      - name: 道具を入れる
        run: |
          python3 -m pip install -q --upgrade pip
          python3 -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -q "transformers==4.49.0" scipy numpy
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null

      - name: モデルの中身を開いて見る（何を触れるのか）
        run: |
          python3 - <<'PY' 2>&1 | tee probe.txt
          from transformers import VitsModel, AutoTokenizer
          import torch, json, inspect
          M = "facebook/mms-tts-mon"
          tok = AutoTokenizer.from_pretrained(M)
          model = VitsModel.from_pretrained(M)
          c = model.config

          print("=== 1. 文字をどう受け取るか ===")
          print("tokenizer     :", type(tok).__name__)
          print("is_uroman     :", getattr(tok, "is_uroman", None))
          print("phonemize     :", getattr(tok, "phonemize", None))
          print("normalize     :", getattr(tok, "normalize", None))
          v = tok.get_vocab()
          print("語彙の数       :", len(v))
          print("語彙           :", "".join(sorted(k for k in v if len(k) == 1))[:200])
          print("キリル文字を持つか:", any("Ѐ" <= k <= "ӿ" for k in v))
          print("句読点を持つか   :", {p: (p in v) for p in [".", ",", "?", "!", "-", " ", "…"]})

          print()
          print("=== 2. 生成のときに触れるもの ===")
          for k in ["speaking_rate", "noise_scale", "noise_scale_duration",
                    "num_speakers", "speaker_embedding_size", "sampling_rate",
                    "use_stochastic_duration_prediction", "depth_separable_channels"]:
              print(f"  {k:34s}=", getattr(c, k, "(無し)"))
          sig = inspect.signature(model.forward)
          print("  forward の引数 :", list(sig.parameters))

          print()
          print("=== 3. 話者 ===")
          print("num_speakers  :", getattr(c, "num_speakers", None),
                "→", "1人だけ" if (getattr(c, "num_speakers", 1) or 1) <= 1 else "複数")

          print()
          print("=== 4. 実際に文字がどう分解されるか（既存の教材から） ===")
          texts = json.load(open("mn-texts.json", encoding="utf-8"))
          for cid in ["p_i", "n_today", "s_how_much", "s_i_sell_cars", "num_1000"]:
              t = texts[cid]["mn"]
              ids = tok(t, return_tensors="pt")["input_ids"][0].tolist()
              back = tok.decode(ids)
              print(f"  {cid:14s} {t!r}")
              print(f"      → {len(ids)}個 / 戻すと {back!r} / 同じか: {back.replace(' ','')==t.replace(' ','')}")

          print()
          print("=== 5. 句読点を足すと分解が変わるか（前処理で効くか） ===")
          base = texts["s_how_much"]["mn"]
          for probe in [base, base + ".", base + "?", base + " ,", base.replace(" ", ",  ")]:
              ids = tok(probe, return_tensors="pt")["input_ids"][0].tolist()
              print(f"  {probe!r:46s} → {len(ids)}個")
          print()
          print("**注意: ここで分かるのは仕組みだけ。発音が正しいかは分からない。**")
          PY

      - name: 同じ本文で、設定だけ変えた音を作る（比べるため）
        run: |
          mkdir -p ab-out
          python3 - <<'PY' 2>&1 | tee variants.txt
          from transformers import VitsModel, AutoTokenizer
          import torch, json, numpy as np, wave, subprocess, os, hashlib
          M = "facebook/mms-tts-mon"
          tok = AutoTokenizer.from_pretrained(M)
          model = VitsModel.from_pretrained(M); model.eval()
          sr = model.config.sampling_rate
          texts = json.load(open("mn-texts.json", encoding="utf-8"))

          # **既存の教材から選ぶ。新しいモンゴル語は1文字も作らない。**
          # 短い / 長い / 数字 / 商談 / 聞き返し を混ぜる
          PICK = ["p_i", "n_today", "n_usedcar", "num_1000", "s_how_much",
                  "s_i_sell_cars", "s_say_again", "s_no_accident",
                  "s_ill_send_quote", "s_nice_to_meet"]

          # 変える設定。**どれが正しいかは決めない。比べる材料を作るだけ**
          VAR = {
            "v1_now":      dict(rate=0.85, ns=0.667, nsd=0.8,  punct=""),
            "v2_rate100":  dict(rate=1.00, ns=0.667, nsd=0.8,  punct=""),
            "v3_steady":   dict(rate=0.90, ns=0.400, nsd=0.4,  punct=""),
            "v4_period":   dict(rate=0.90, ns=0.667, nsd=0.8,  punct="."),
            "v5_calm":     dict(rate=0.95, ns=0.300, nsd=0.3,  punct="."),
          }

          def synth(text, rate, ns, nsd, seed):
              model.config.speaking_rate = rate
              model.config.noise_scale = ns
              model.config.noise_scale_duration = nsd
              torch.manual_seed(seed)
              x = tok(text, return_tensors="pt")
              with torch.no_grad():
                  w = model(**x).waveform[0].cpu().numpy()
              return w

          def trim(w, th=0.003, pad=0.06):
              idx = np.where(np.abs(w) > th)[0]
              if len(idx) == 0: return w
              a = max(0, idx[0] - int(pad*sr)); b = min(len(w), idx[-1] + int(0.18*sr))
              return w[a:b]

          rows = []
          for name, cfg in VAR.items():
              for i, cid in enumerate(PICK):
                  t = texts[cid]["mn"] + cfg["punct"]
                  w = trim(synth(t, cfg["rate"], cfg["ns"], cfg["nsd"], 1234 + i))
                  raw = f"ab-out/{cid}__{name}.wav"
                  with wave.open(raw, "w") as f:
                      f.setnchannels(1); f.setsampwidth(2); f.setframerate(sr)
                      f.writeframes((np.clip(w, -1, 1) * 32767).astype("<i2").tobytes())
                  mp3 = f"ab-out/{cid}__{name}.mp3"
                  subprocess.run(["ffmpeg","-y","-loglevel","error","-i",raw,
                                  "-codec:a","libmp3lame","-b:a","48k","-ac","1","-ar","24000",mp3],
                                 check=True)
                  os.remove(raw)
                  rms = float(np.sqrt(np.mean(w**2))); peak = float(np.max(np.abs(w)))
                  rows.append(dict(id=cid, variant=name, seconds=round(len(w)/sr,3),
                                   bytes=os.path.getsize(mp3), rms=round(rms,4), peak=round(peak,4),
                                   chars=len(texts[cid]["mn"].replace(" ","")),
                                   sha=hashlib.sha256(open(mp3,"rb").read()).hexdigest()[:16]))
              print(f"{name}: {len(PICK)}件")

          # 会話をまとめて読ませたらどうなるか (既存19会話のうち1本)
          import itertools
          conv = ["g_hello", "g_hello"]     # 実際の会話の参照は下で差し替える
          try:
              pack = json.load(open("daily-conversation-v1.json", encoding="utf-8"))
              d = pack["dialogues"][0]
              conv = [t["ref"] for t in d["turns"]]
          except Exception as e:
              print("会話ファイルが無いので、既存の2件で代用:", e)
          joined = " ".join(texts[c]["mn"] for c in conv if c in texts)
          if joined:
              for name, cfg in [("c1_joined", VAR["v1_now"]), ("c2_joined_period", VAR["v4_period"])]:
                  w = trim(synth(joined + cfg["punct"], cfg["rate"], cfg["ns"], cfg["nsd"], 777))
                  raw = f"ab-out/conv__{name}.wav"
                  with wave.open(raw,"w") as f:
                      f.setnchannels(1); f.setsampwidth(2); f.setframerate(sr)
                      f.writeframes((np.clip(w,-1,1)*32767).astype("<i2").tobytes())
                  subprocess.run(["ffmpeg","-y","-loglevel","error","-i",raw,
                                  "-codec:a","libmp3lame","-b:a","48k","-ac","1","-ar","24000",
                                  f"ab-out/conv__{name}.mp3"], check=True)
                  os.remove(raw)
                  print(f"{name}: 会話まとめ {len(joined)}文字 / {len(w)/sr:.2f}秒")
              rows.append(dict(id="conv", variant="joined", note=joined[:60]))

          json.dump({"model": M, "sampleRate": sr, "variants": VAR, "picks": PICK, "rows": rows},
                    open("ab-out/index.json","w"), ensure_ascii=False, indent=1)

          print()
          print("=== 設定ごとの長さ（同じ本文で比べる） ===")
          import collections
          by = collections.defaultdict(dict)
          for r in rows:
              if "seconds" in r: by[r["id"]][r["variant"]] = r["seconds"]
          print("id".ljust(18) + "".join(v.ljust(13) for v in VAR))
          for cid in PICK:
              print(cid.ljust(18) + "".join(str(by[cid].get(v,"-")).ljust(13) for v in VAR))
          print()
          print("**どれが良いかは、ここでは決めない。モンゴル語話者に聞いてもらう材料。**")
          PY

      - name: 結果を置く
        run: |
          git config user.name "mn90-audio-bot"
          git config user.email "noreply@github.com"
          git checkout -B audio-ab
          git add -f ab-out probe.txt variants.txt
          git commit -q -m "設定違いの比較音源と、モデルの中身の記録" || echo "変更なし"
          git push -f origin audio-ab
          echo "pushed to audio-ab"
