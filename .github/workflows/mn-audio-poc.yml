name: mn-audio-poc

on:
  push:
    branches: [audio-poc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio-poc

      - name: 道具を入れる
        run: |
          python3 -m pip install -q --upgrade pip
          python3 -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -q "transformers==4.49.0" scipy numpy
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null

      - name: ほかのモデルの権利を一次情報で読み、同じ本文で音を作る
        run: |
          mkdir -p ab-out
          python3 - <<'PY' 2>&1 | tee models.txt
          import json, urllib.request, traceback
          def get(u, raw=False):
              r = urllib.request.Request(u, headers={"User-Agent":"mn90"})
              with urllib.request.urlopen(r, timeout=40) as x:
                  b = x.read(); return b.decode("utf-8","replace") if raw else json.loads(b)

          CAND = [
            "mendeeb/mms-tts-mon_finetuned_common-voice_mn",
            "Bokhbat/mongolian-vits-tts",
            "developerabu/vits-tts-mnn",
            "Dorjzodovsuren/MongolianTTS_elevenlabs_v6",
            "antoniow12/speecht5_tts_mongolian",
          ]
          print("=== それぞれの権利を、モデルカードの実物で読む ===")
          ok = []
          for mid in CAND:
              try:
                  info = get(f"https://huggingface.co/api/models/{mid}")
                  cd = info.get("cardData") or {}
                  lic = cd.get("license") or next((t.split(":",1)[1] for t in info.get("tags",[])
                                                   if t.startswith("license:")), None)
                  files = [f["rfilename"] for f in info.get("siblings",[])]
                  print(f"\n--- {mid}")
                  print(f"  license : {lic}")
                  print(f"  files   : {[f for f in files if f.endswith(('.json','.bin','.safetensors','.pth'))][:6]}")
                  try:
                      rd = get(f"https://huggingface.co/{mid}/raw/main/README.md", raw=True)
                      keep = [ln for ln in rd.split("\n")
                              if any(k in ln.lower() for k in
                                     ["dataset","train","common voice","bible","elevenlabs",
                                      "license","voice","speaker","derived","distil"])]
                      for ln in keep[:8]: print("   |", ln.strip()[:120])
                      if not keep: print("   | (出所の記述が見当たらない)")
                  except Exception as e:
                      print("   | READMEが読めない:", e)
                  ok.append((mid, lic, files))
              except Exception as e:
                  print(f"\n--- {mid}\n  読めない: {e}")

          json.dump([{"id":m,"license":l} for m,l,_ in ok],
                    open("model-rights.json","w"), ensure_ascii=False, indent=1)

          print()
          print("=== 実際に音を作れるか、同じ本文で試す ===")
          import torch, numpy as np, wave, subprocess, os
          from transformers import VitsModel, AutoTokenizer
          texts = json.load(open("mn-texts.json", encoding="utf-8"))
          PICK = ["n_today","n_car","s_how_much","s_i_sell_cars","g_hello",
                  "n_money","s_say_again","n_usedcar"]
          def trim(w, sr, th=0.003):
              i = np.where(np.abs(w) > th)[0]
              if len(i)==0: return w
              return w[max(0,i[0]-int(0.06*sr)):min(len(w), i[-1]+int(0.18*sr))]
          def save(w, sr, n):
              raw=f"ab-out/{n}.wav"
              with wave.open(raw,"w") as f:
                  f.setnchannels(1); f.setsampwidth(2); f.setframerate(sr)
                  f.writeframes((np.clip(w,-1,1)*32767).astype("<i2").tobytes())
              subprocess.run(["ffmpeg","-y","-loglevel","error","-i",raw,"-codec:a","libmp3lame",
                              "-b:a","48k","-ac","1","-ar","24000",f"ab-out/{n}.mp3"],check=True)
              os.remove(raw)

          made = {}
          for mid, lic, files in ok:
              if not any(f.endswith((".bin",".safetensors")) for f in files):
                  print(f"  {mid}: 重みが見当たらない。とばす"); continue
              short = mid.split("/")[-1].replace(".","_")[:22]
              try:
                  tok = AutoTokenizer.from_pretrained(mid)
                  model = VitsModel.from_pretrained(mid); model.eval()
                  sr = model.config.sampling_rate
                  cov = []
                  for i, cid in enumerate(PICK):
                      t = texts[cid]["mn"]
                      torch.manual_seed(9000+i)
                      x = tok(t, return_tensors="pt")
                      with torch.no_grad(): w = model(**x).waveform[0].cpu().numpy()
                      w = trim(w, sr)
                      save(w, sr, f"{cid}__m_{short}")
                      got = tok.decode(x["input_ids"][0].tolist()).replace("|","")
                      cov.append((cid, len(w)/sr, got))
                  made[mid] = short
                  print(f"\n  {mid}  ({lic}) / {sr}Hz  → 音を作れた")
                  for cid, sec, got in cov:
                      print(f"      {cid:16s} {sec:5.2f}s  受け取った文字 {got!r}")
              except Exception as e:
                  print(f"\n  {mid}: 作れない — {type(e).__name__}: {str(e)[:140]}")
          json.dump(made, open("ab-out/models.json","w"), ensure_ascii=False, indent=1)
          print()
          print("**どのモデルが良いかは決めない。権利と、音を作れるかだけ確かめた。**")
          PY

      - name: 結果を置く
        run: |
          git config user.name "mn90-audio-bot"
          git config user.email "noreply@github.com"
          git checkout -B audio-ab
          git add -f ab-out models.txt model-rights.json
          git commit -q -m "設定違いの比較音源と、モデルの中身の記録" || echo "変更なし"
          git push -f origin audio-ab
          echo "pushed to audio-ab"
