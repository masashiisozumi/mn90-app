name: mn-audio-poc

on:
  push:
    branches: [audio-poc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: FLEURS モンゴル語の中身を実測する
        run: |
          mkdir -p out
          pip install -q "datasets<4" soundfile numpy 2>&1 | tail -2 || true
          python3 - <<'PY' 2>&1 | tail -50 | tee out/90-fleurs-mn.txt
          import json, urllib.request
          def get(u):
              try:
                  req = urllib.request.Request(u, headers={'User-Agent': 'mn90-poc'})
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return json.loads(r.read())
              except Exception as e:
                  return {"_err": str(e)[:120]}

          # まず「モンゴル語ぶんが本当に入っているか」を、ファイル一覧から確かめる
          info = get("https://huggingface.co/api/datasets/google/fleurs")
          sib = [s.get("rfilename", "") for s in (info.get("siblings") or [])]
          mn = [f for f in sib if "mn_mn" in f or "/mn" in f]
          print("FLEURS のファイル総数:", len(sib))
          print("モンゴル語 (mn_mn) のファイル:", len(mn))
          for f in mn[:12]:
              print("   ", f)

          print()
          print("=== 実際に読み込んで、時間・話者・標本化周波数を数える ===")
          try:
              from datasets import load_dataset
              import numpy as np
              ds = load_dataset("google/fleurs", "mn_mn", split="train", streaming=True)
              total = 0.0; n = 0; srs = set(); genders = {}; ids = set()
              for ex in ds:
                  a = ex.get("audio") or {}
                  arr = a.get("array"); sr = a.get("sampling_rate")
                  if arr is None or not sr: continue
                  total += len(arr) / sr; n += 1; srs.add(sr)
                  g = ex.get("gender"); genders[g] = genders.get(g, 0) + 1
                  if ex.get("id") is not None: ids.add(ex["id"])
                  if n >= 300: break
              print("読んだ件数:", n)
              print("標本化周波数:", srs)
              print("平均の長さ: %.2f 秒" % (total / max(1, n)))
              print("300件で %.1f 分" % (total / 60))
              print("gender の内訳:", genders)
              print()
              print("※ FLEURS は話者IDを公開していない。gender しか無い。")
              print("  → 1人の声で揃えて学習することが、そもそもできるか分からない")
          except Exception as e:
              print("NG:", type(e).__name__, str(e)[:400])
          PY

      - name: FLEURS の利用条件が書かれた一次情報を探す
        if: always()
        run: |
          python3 - <<'PY' 2>&1 | tail -40 | tee out/91-terms.txt
          import re, urllib.request
          def raw(u):
              try:
                  req = urllib.request.Request(u, headers={'User-Agent': 'mn90-poc'})
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return r.read().decode('utf-8', 'replace')
              except Exception as e:
                  return "(ERR %s)" % e

          KEY = ("consent", "voice", "likeness", "synthes", "clone", "tts",
                 "text-to-speech", "permission", "personal data", "privacy", "attribut")
          for name, url in [
              ("FLEURS card", "https://huggingface.co/datasets/google/fleurs/raw/main/README.md"),
              ("FLoRes README", "https://raw.githubusercontent.com/facebookresearch/flores/main/README.md"),
          ]:
              print("\n" + "=" * 70)
              print(name)
              t = raw(url)
              if t.startswith("(ERR"):
                  print("  ", t[:120]); continue
              lines = [re.sub(r"\s+", " ", l).strip() for l in re.split(r"[\n。.]", re.sub(r"<[^>]+>", " ", t))]
              hits = [l for l in lines if 20 < len(l) < 240 and any(k in l.lower() for k in KEY)]
              if not hits:
                  print("   声の利用条件に触れた記述は1つも無い")
              for l in hits[:10]:
                  print("  " + l[:220])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mn-audio-poc
          path: out/
          retention-days: 7
