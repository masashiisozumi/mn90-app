name: mn-audio-poc

on:
  push:
    branches: [audio-poc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio-poc

      - name: 道具を入れる
        run: |
          python3 -m pip install -q --upgrade pip
          python3 -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -q "transformers==4.49.0" scipy numpy sentencepiece datasets soundfile
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null

      - name: 権利のきれいなモデルで、本当に音になるかを確かめる
        run: |
          mkdir -p ab-out
          python3 - <<'PY' 2>&1 | tee models.txt
          import json, numpy as np, torch, wave, subprocess, os, traceback
          texts = json.load(open("mn-texts.json", encoding="utf-8"))
          PICK = ["n_today","n_car","s_how_much","s_i_sell_cars","g_hello",
                  "n_money","s_say_again","n_usedcar"]

          def valid(w, sr):
              """**本当に音になっているか。**ファイルができた=成功ではない。
              2026-09-02、decoder が乱数で初期化されたモデルが NaN を吐き、
              それでも「音を作れた」と書いてしまった。"""
              if w is None or len(w) == 0: return False, "空"
              if not np.all(np.isfinite(w)): return False, "NaN が混ざっている"
              sec = len(w)/sr
              if sec < 0.15: return False, f"短すぎる ({sec:.2f}秒)"
              rms = float(np.sqrt(np.mean(w**2)))
              if rms < 0.005: return False, f"ほぼ無音 (rms {rms:.4f})"
              if float(np.max(np.abs(w))) > 1.5: return False, "振り切れている"
              return True, f"{sec:.2f}秒 rms {rms:.3f}"

          def trim(w, sr, th=0.003):
              i = np.where(np.abs(w) > th)[0]
              if len(i)==0: return w
              return w[max(0,i[0]-int(0.06*sr)):min(len(w), i[-1]+int(0.18*sr))]
          def save(w, sr, n):
              raw=f"ab-out/{n}.wav"
              with wave.open(raw,"w") as f:
                  f.setnchannels(1); f.setsampwidth(2); f.setframerate(sr)
                  f.writeframes((np.clip(np.nan_to_num(w),-1,1)*32767).astype("<i2").tobytes())
              subprocess.run(["ffmpeg","-y","-loglevel","error","-i",raw,"-codec:a","libmp3lame",
                              "-b:a","48k","-ac","1","-ar","24000",f"ab-out/{n}.mp3"],check=True)
              os.remove(raw)

          made = {}

          # --- 0. **その model は、モンゴル語の文字をそもそも受け取れるのか。**
          # 2026-09-02、本番で使っている mms-tts-mon が ө と ш を語彙に持たず、
          # 黙って捨てていた。音は出るので、音を聞くまで気づけなかった。
          # だから合成する前に、まず「文字が入るか」を見る。
          def reception(tok, name):
              lost, seen = {}, 0
              for cid, e in texts.items():
                  t = e["mn"]
                  try:
                      back = tok.decode(tok(t, add_special_tokens=False)["input_ids"])
                  except Exception as ex:
                      print(f"  {name}: 文字を入れられない ({type(ex).__name__})"); return None
                  # **大文字が小文字になるのは「落ちた」ではない。**
                  # 2026-09-02、これを数え違えて Б Э Т Н Х も落ちていると出た。
                  # mms-tts の入口は小文字にそろえるだけで、字は捨てていない
                  b = back.lower()
                  for ch in set(t):
                      if ch.isspace(): continue
                      seen += t.count(ch)
                      if ch.lower() not in b: lost[ch] = lost.get(ch, 0) + t.count(ch)
              n = sum(lost.values())
              print(f"  {name}: 受け取り率 {100*(seen-n)/max(seen,1):.1f}%  "
                    + ("落ちた字なし" if not lost else
                       "落ちた字 " + " ".join(f"{c}(U+{ord(c):04X})x{k}" for c, k in
                                              sorted(lost.items(), key=lambda x: -x[1])[:8])))
              return lost

          # --- 1. SpeechT5 (MIT) + Common Voice 17 (CC0)。**権利の鎖がきれい**
          print("=== antoniow12/speecht5_tts_mongolian (MIT / Common Voice 17) ===")
          try:
              from transformers import (SpeechT5Processor, SpeechT5ForTextToSpeech,
                                        SpeechT5HifiGan, SpeechT5Tokenizer,
                                        SpeechT5FeatureExtractor)
              from datasets import load_dataset
              from huggingface_hub import list_repo_files
              MID = "antoniow12/speecht5_tts_mongolian"
              files = list_repo_files(MID)
              print("  中に入っているもの:", ", ".join(sorted(files))[:300])
              try:
                  proc = SpeechT5Processor.from_pretrained(MID)
                  print("  processor: この repo のものを使う")
              except Exception as e1:
                  # preprocessor_config.json が無いだけなら、土台(MIT)のものを借りる。
                  # ただし **借りた tokenizer がモンゴル語を受け取れるかは別問題** なので下で見る。
                  print("  processor: この repo に無い ->", type(e1).__name__)
                  tk = (SpeechT5Tokenizer.from_pretrained(MID)
                        if any(f.startswith("spm_char") or f == "tokenizer_config.json" for f in files)
                        else SpeechT5Tokenizer.from_pretrained("microsoft/speecht5_tts"))
                  # この repo は added_tokens.json だけ持っている。
                  # **土台の入口はキリル文字をほぼ受け取れない (受け取り率 1.1%)** ので、
                  # 足された字を入れてから測り直す。入れても駄目なら、そこで終わり。
                  if "added_tokens.json" in files:
                      from huggingface_hub import hf_hub_download
                      ext = json.load(open(hf_hub_download(MID, "added_tokens.json"), encoding="utf-8"))
                      add = [k for k in ext if k not in tk.get_vocab()]
                      print(f"  足されている字: {len(add)}個  {''.join(sorted(add))[:80]}")
                      if add: tk.add_tokens(add)
                  proc = SpeechT5Processor(feature_extractor=SpeechT5FeatureExtractor(),
                                           tokenizer=tk)
                  print("  processor: 土台 microsoft/speecht5_tts の入口を借りた")
              lost = reception(proc.tokenizer, "speecht5 の入口")
              if lost is None or sum(lost.values()) > 0:
                  print("  **文字を落とすので、音を作っても意味が変わる。ここで止める。**")
                  raise RuntimeError("文字を受け取れない")
              m = SpeechT5ForTextToSpeech.from_pretrained(MID)
              # **入口の数が合っていなければ、音は出ても別の字を読んでいる。**
              nvoc = m.get_input_embeddings().weight.shape[0]
              print(f"  model が持っている入口の数 {nvoc} / 入れようとしている字 {len(proc.tokenizer)}")
              if nvoc != len(proc.tokenizer):
                  print("  **数が合わない。別の字として読まれるので、ここで止める。**")
                  raise RuntimeError("入口の数が合わない")
              voc = SpeechT5HifiGan.from_pretrained("microsoft/speecht5_hifigan")
              emb = load_dataset("Matthijs/cmu-arctic-xvectors", split="validation")
              sp = torch.tensor(emb[7306]["xvector"]).unsqueeze(0)
              sr = 16000
              okn = 0
              for i, cid in enumerate(PICK):
                  t = texts[cid]["mn"]
                  x = proc(text=t, return_tensors="pt")
                  torch.manual_seed(1000+i)
                  with torch.no_grad():
                      w = m.generate_speech(x["input_ids"], sp, vocoder=voc).cpu().numpy()
                  good, why = valid(w, sr)
                  print(f"  {cid:16s} {'○' if good else '×'} {why}")
                  if good:
                      save(trim(w, sr), sr, f"{cid}__m_speecht5"); okn += 1
              if okn >= len(PICK)//2:
                  made["antoniow12/speecht5_tts_mongolian"] = {"tag":"speecht5","license":"mit",
                     "chain":"microsoft/speecht5_tts (MIT) + Common Voice 17 (CC0)"}
                  print(f"  → {okn}/{len(PICK)} 本当に音になった")
              else:
                  print(f"  → {okn}/{len(PICK)} しか音にならない。候補から外す")
          except Exception as e:
              print("  作れない:", type(e).__name__, str(e)[:200])

          # --- 2. さきほど「作れた」と書いてしまったものを、検査し直す
          print()
          print("=== Dorjzodovsuren/MongolianTTS_elevenlabs_v6 を検査し直す ===")
          print("  カードに ElevenLabs 由来の合成データで学習したと書いてある。")
          print("  **権利の鎖が上流で切れているので、音の良し悪しに関係なく使わない。**")
          try:
              from transformers import VitsModel, AutoTokenizer
              MID = "Dorjzodovsuren/MongolianTTS_elevenlabs_v6"
              tok = AutoTokenizer.from_pretrained(MID)
              mm = VitsModel.from_pretrained(MID); mm.eval()
              sr = mm.config.sampling_rate
              t = texts["n_car"]["mn"]
              torch.manual_seed(1)
              with torch.no_grad():
                  w = mm(**tok(t, return_tensors="pt")).waveform[0].cpu().numpy()
              good, why = valid(w, sr)
              print(f"  音として成り立っているか: {'○' if good else '×'} {why}")
          except Exception as e:
              print("  ", type(e).__name__, str(e)[:160])

          # --- 3. 今つかっているものを、同じ物差しで測る
          print()
          print("=== facebook/mms-tts-mon (いま本番で使っているもの) ===")
          try:
              from transformers import VitsModel, AutoTokenizer
              tok = AutoTokenizer.from_pretrained("facebook/mms-tts-mon")
              reception(tok, "mms-tts-mon そのまま")
              # 大文字も寄せる。文頭は必ず大文字なので、抜けると語の頭が落ちる
              CMAP = {"\u04e9": "\u0473", "\u0448": "\u0449",
                      "\u04e8": "\u0473", "\u0428": "\u0449"}
              class Mapped:
                  def __init__(self, t): self.t = t
                  def __call__(self, s, **kw):
                      for a, b in CMAP.items(): s = s.replace(a, b)
                      return self.t(s, **kw)
                  def decode(self, *a, **k): return self.t.decode(*a, **k)
              # 置き換えたあとに何が残るかを見る。**これは「正しい読み」の証明ではない。**
              # 語彙にある字へ寄せたら受け取り率が上がる、というだけ。
              # 音が良くなったかは話者に聞くまで分からない。
              lost2, seen2 = {}, 0
              for cid, e in texts.items():
                  t0 = e["mn"]
                  t1 = t0
                  for a, b in CMAP.items(): t1 = t1.replace(a, b)
                  back = tok.decode(tok(t1, add_special_tokens=False)["input_ids"])
                  b = back.lower()
                  for ch in set(t1):
                      if ch.isspace(): continue
                      seen2 += t1.count(ch)
                      if ch.lower() not in b: lost2[ch] = lost2.get(ch, 0) + t1.count(ch)
              n2 = sum(lost2.values())
              print(f"  字を寄せたあと: 受け取り率 {100*(seen2-n2)/max(seen2,1):.1f}%  "
                    + ("落ちた字なし" if not lost2 else
                       "落ちた字 " + " ".join(f"{c}(U+{ord(c):04X})x{k}" for c, k in
                                              sorted(lost2.items(), key=lambda x: -x[1])[:8])))
          except Exception as e:
              print("  ", type(e).__name__, str(e)[:160])

          json.dump(made, open("ab-out/models.json","w"), ensure_ascii=False, indent=1)
          print()
          print("**どのモデルが良いかは決めない。権利と、本当に音になるかだけ確かめた。**")
          PY

      - name: 字を落としている21件を、いまの音と寄せた音の両方で作る
        run: |
          mkdir -p ab-out
          python3 - <<'PY' 2>&1 | tee -a models.txt
          import json, numpy as np, torch, wave, subprocess, os
          from transformers import VitsModel, AutoTokenizer

          # **本番と同じ作り方に揃える。**違う作り方で比べたら、
          # 何を比べているのか分からなくなる。
          # (mongolian-90/audio/synth-workflow.yml と同じ: 速さ0.85 / 山を0.85に揃える /
          #  静かな末尾を切り落とさない)
          RATE = 0.85
          # 大文字も寄せる。文頭は必ず大文字なので、抜けると語の頭が落ちる
          CMAP = {"\u04e9": "\u0473", "\u0448": "\u0449",
                  "\u04e8": "\u0473", "\u0428": "\u0449"}
          texts = json.load(open("mn-texts.json", encoding="utf-8"))
          target = sorted(c for c, e in texts.items()
                          if any(ch in e["mn"] for ch in CMAP))
          print(f"字が落ちている教材: {len(target)}件")

          tok = AutoTokenizer.from_pretrained("facebook/mms-tts-mon")
          m = VitsModel.from_pretrained("facebook/mms-tts-mon"); m.eval()
          m.speaking_rate = RATE
          sr = m.config.sampling_rate

          def synth(text, seed):
              torch.manual_seed(seed)
              with torch.no_grad():
                  w = m(**tok(text, return_tensors="pt")).waveform.squeeze().numpy()
              peak = float(np.max(np.abs(w))) or 1.0
              w = w / peak * 0.85
              nz = np.where(np.abs(w) > 0.003)[0]
              if len(nz):
                  w = w[max(0, nz[0]-int(sr*0.06)):min(len(w), nz[-1]+int(sr*0.18))]
              return w

          def valid(w):
              if w is None or len(w) == 0: return False, "空"
              if not np.all(np.isfinite(w)): return False, "NaN が混ざっている"
              sec = len(w)/sr
              if sec < 0.15: return False, f"短すぎる ({sec:.2f}秒)"
              rms = float(np.sqrt(np.mean(w**2)))
              if rms < 0.005: return False, f"ほぼ無音 (rms {rms:.4f})"
              if float(np.max(np.abs(w))) > 1.5: return False, "振り切れている"
              return True, f"{sec:.2f}秒"

          def save(w, n):
              raw = f"ab-out/{n}.wav"
              with wave.open(raw, "w") as f:
                  f.setnchannels(1); f.setsampwidth(2); f.setframerate(sr)
                  f.writeframes((np.clip(w, -1, 1)*32767).astype("<i2").tobytes())
              subprocess.run(["ffmpeg","-y","-loglevel","error","-i",raw,"-codec:a",
                              "libmp3lame","-b:a","48k","-ac","1","-ar","24000",
                              f"ab-out/{n}.mp3"], check=True)
              os.remove(raw)

          made = 0
          for i, cid in enumerate(target):
              t0 = texts[cid]["mn"]
              t1 = t0
              for a, b in CMAP.items(): t1 = t1.replace(a, b)
              # **種を揃える。**乱数の当たり外れではなく、字の違いだけを比べたいので
              seed = 4200 + i
              w0, w1 = synth(t0, seed), synth(t1, seed)
              g0, why0 = valid(w0); g1, why1 = valid(w1)
              print(f"  {cid:18s} いま {'○' if g0 else '×'} {why0:14s} "
                    f"寄せた {'○' if g1 else '×'} {why1}")
              # **片方でも音として成り立っていなければ、組にしない。**
              # 壊れた音と比べたら、寄せたほうが良く聞こえるに決まっている
              if g0 and g1:
                  save(w0, f"{cid}__v1_now"); save(w1, f"{cid}__v6_charmap"); made += 1
          print(f"聞き比べに出せる組: {made}/{len(target)}")
          print("**どちらが正しい読みかは、ここでは決めない。話者に聞く。**")
          PY

      - name: カフェ・空港・レストランの16件を合成する（話者確認用）
        run: |
          mkdir -p ab-out
          python3 - <<'PY' 2>&1 | tee -a models.txt
          import json, numpy as np, torch, wave, subprocess, os
          from transformers import VitsModel, AutoTokenizer
          # 本番140件と同じ作り方に揃える (速さ0.85 / 山を0.85 / 末尾を切らない)
          RATE = 0.85
          # 大文字も寄せる。文頭は必ず大文字なので、抜けると語の頭が落ちる
          CMAP = {"\u04e9": "\u0473", "\u0448": "\u0449",
                  "\u04e8": "\u0473", "\u0428": "\u0449"}
          texts = json.load(open("mn-texts-extra.json", encoding="utf-8"))
          print(f"追加の教材: {len(texts)}件")

          tok = AutoTokenizer.from_pretrained("facebook/mms-tts-mon")
          m = VitsModel.from_pretrained("facebook/mms-tts-mon"); m.eval()
          m.speaking_rate = RATE
          sr = m.config.sampling_rate

          def synth(text, seed):
              torch.manual_seed(seed)
              with torch.no_grad():
                  w = m(**tok(text, return_tensors="pt")).waveform.squeeze().numpy()
              peak = float(np.max(np.abs(w))) or 1.0
              w = w / peak * 0.85
              nz = np.where(np.abs(w) > 0.003)[0]
              if len(nz):
                  w = w[max(0, nz[0]-int(sr*0.06)):min(len(w), nz[-1]+int(sr*0.18))]
              return w

          def valid(w):
              if w is None or len(w) == 0: return False, "空"
              if not np.all(np.isfinite(w)): return False, "NaN が混ざっている"
              sec = len(w)/sr
              if sec < 0.15: return False, f"短すぎる ({sec:.2f}秒)"
              rms = float(np.sqrt(np.mean(w**2)))
              if rms < 0.005: return False, f"ほぼ無音 (rms {rms:.4f})"
              if float(np.max(np.abs(w))) > 1.5: return False, "振り切れている"
              return True, f"{sec:.2f}秒"

          def save(w, n):
              raw = f"ab-out/{n}.wav"
              with wave.open(raw, "w") as f:
                  f.setnchannels(1); f.setsampwidth(2); f.setframerate(sr)
                  f.writeframes((np.clip(w, -1, 1)*32767).astype("<i2").tobytes())
              subprocess.run(["ffmpeg","-y","-loglevel","error","-i",raw,"-codec:a",
                              "libmp3lame","-b:a","48k","-ac","1","-ar","24000",
                              f"ab-out/{n}.mp3"], check=True)
              os.remove(raw)

          # набор全体の「1文字あたり何秒か」で浮いたものを見つけ、種を変えて作り直す
          def nchars(t): return len([c for c in t if c.isalpha()])
          waves, used = {}, {}
          for i, (cid, rec) in enumerate(sorted(texts.items())):
              t = rec["mn"]
              for a, b in CMAP.items(): t = t.replace(a, b)
              used[cid] = t
              waves[cid] = synth(t, 7100 + i)
          rate = lambda c: (len(waves[c])/sr) / max(1, nchars(used[c]))
          for attempt in range(1, 5):
              rs = sorted(rate(c) for c in waves)
              med = rs[len(rs)//2]
              bad = [c for c in waves if rate(c) > med*2.0 or rate(c) < med/2.0]
              if not bad:
                  print(f"浮いたものなし ({attempt}回目で安定 / 1文字 {med:.3f}秒)"); break
              print(f"{attempt}回目: 浮いたもの {len(bad)}件 → 作り直す")
              for c in bad:
                  best, bd = waves[c], abs(rate(c)-med)
                  for k in range(4):
                      w2 = synth(used[c], 91000 + attempt*100 + k*7 + len(c))
                      d = abs((len(w2)/sr)/max(1, nchars(used[c])) - med)
                      if d < bd: best, bd = w2, d
                  waves[c] = best

          ok = 0
          idx = {}
          for cid in sorted(waves):
              g, why = valid(waves[cid])
              print(f"  {cid:20s} {'○' if g else '×'} {why}")
              if g:
                  save(waves[cid], f"{cid}__talk"); ok += 1
                  idx[cid] = {"file": f"{cid}__talk.mp3", "mn": texts[cid]["mn"],
                              "ttsText": used[cid], "rev": texts[cid]["rev"]}
          json.dump(idx, open("ab-out/extra-index.json", "w"), ensure_ascii=False, indent=1)
          print(f"音になった: {ok}/{len(texts)}")
          print("**このモンゴル語はまだ話者の確認を受けていない。本番へは出さない。**")
          PY

      - name: 結果を置く
        run: |
          git config user.name "mn90-audio-bot"
          git config user.email "noreply@github.com"
          git fetch -q origin audio-ab || true
          # **前の run で置いた音を消さない。**force push で毎回消えていた。
          # 今あるものを優先し (cp -n)、無いものだけ前回のを足す
          tmp=$(mktemp -d)
          git archive origin/audio-ab ab-out 2>/dev/null | tar -x -C "$tmp" 2>/dev/null || true
          [ -d "$tmp/ab-out" ] && cp -n "$tmp"/ab-out/* ab-out/ 2>/dev/null || true
          git checkout -B audio-ab
          for f in ab-out models.txt mn-texts-extra.json; do [ -e "$f" ] && git add -f "$f"; done
          git commit -q -m "設定違いの比較音源と、モデルの中身の記録" || echo "変更なし"
          git push -f origin audio-ab
          echo "pushed to audio-ab"
