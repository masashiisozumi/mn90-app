name: mn-audio-poc

on:
  push:
    branches: [audio-poc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 技術的に音を作れるか（apache-2.0 の VITS で実測）
        run: |
          mkdir -p out
          pip install -q torch torchaudio coqui-tts "transformers==4.49.0" 2>&1 | tail -3 || echo "(install failed)"
          python3 -c "import transformers,sys;print('transformers',transformers.__version__)"
          python3 - <<'PY' 2>&1 | tee out/30-synth.txt
          import os, time, wave
          import numpy as np
          # 既存 production_ready の本文だけを使う。新しいモンゴル語は1文字も作らない
          TEXTS = [
              ("g_thanks", "Баярлалаа"),
              ("g_hello", "Сайн байна уу?"),
              ("s_how_much", "Энэ ямар үнэтэй вэ?"),
          ]
          try:
              from huggingface_hub import hf_hub_download
              from TTS.utils.synthesizer import Synthesizer
              repo = "Bokhbat/mongolian-vits-tts"
              t0 = time.time()
              mp = hf_hub_download(repo, "best_model.pth")
              cp = hf_hub_download(repo, "config.json")
              sp = hf_hub_download(repo, "speakers.pth")
              print("download_sec: %.1f  checkpoint_MB: %.1f" % (time.time() - t0, os.path.getsize(mp) / 1e6))
              t1 = time.time()
              syn = Synthesizer(mp, cp, sp, use_cuda=False)
              print("init_sec: %.1f" % (time.time() - t1))
              names = list(syn.tts_model.speaker_manager.speaker_names)
              print("speakers:", len(names))
              sr = syn.output_sample_rate
              print("sample_rate:", sr)
              os.makedirs("out", exist_ok=True)
              total = 0.0
              for cid, text in TEXTS:
                  for si in (0, 1):
                      t2 = time.time()
                      w = np.array(syn.tts(text, speaker_name=names[si]))
                      dt = time.time() - t2
                      total += dt
                      p = "out/%s_spk%d.wav" % (cid, si)
                      with wave.open(p, "w") as f:
                          f.setnchannels(1); f.setsampwidth(2); f.setframerate(sr)
                          f.writeframes((np.clip(w, -1, 1) * 32767).astype("<i2").tobytes())
                      print("  %-12s spk=%-2d synth=%.2fs dur=%.2fs bytes=%d"
                            % (cid, si, dt, len(w) / sr, os.path.getsize(p)))
              print("avg_synth_sec: %.2f" % (total / (len(TEXTS) * 2)))
              print("est_140_items_sec: %.0f" % (total / (len(TEXTS) * 2) * 140))
          except Exception as e:
              print("NG:", type(e).__name__, str(e)[:600])
          PY

      - name: 権利の7層を1画面にまとめる（最後に出す）
        if: always()
        run: |
          python3 - <<'PY' 2>&1 | tee out/31-chain.txt
          import json, urllib.request

          def api(path):
              try:
                  req = urllib.request.Request("https://huggingface.co/api/" + path,
                                               headers={'User-Agent': 'mn90-poc'})
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return json.loads(r.read())
              except Exception:
                  return None

          def raw(repo, f, kind="models"):
              base = "https://huggingface.co/" + ("datasets/" if kind == "datasets" else "") + repo
              try:
                  req = urllib.request.Request("%s/raw/main/%s" % (base, f),
                                               headers={'User-Agent': 'mn90-poc'})
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return r.read().decode('utf-8', 'replace')
              except Exception:
                  return ""

          MODELS = [
              "Bokhbat/mongolian-vits-tts",
              "Bokhbat/mongolian-vits-myvoice",
              "mazalaai/TTS_Mongolian",
              "mendeeb/F5-TTS-mongolian",
              "antoniow12/speecht5_tts_mongolian",
              "antoniow12/speecht5_tts_mongolian2",
              "antoniow12/mongolian-tts2",
              "bayartsogt/tts_transformer-mn-mbspeech",
              "k2-fsa/OmniVoice",
              "facebook/mms-tts-mon",
          ]
          print("%-40s %-13s %-26s %-7s %s" % ("MODEL", "WEIGHT-LIC", "DECLARED-DATASET", "GATED", "DATA-WORDS-IN-README"))
          for m in MODELS:
              info = api("models/" + m)
              if not isinstance(info, dict):
                  print("%-40s %-13s %-26s %-7s %s" % (m[:40], "(取得不可)", "-", "-", "-"))
                  continue
              cd = info.get("cardData") or {}
              lic = str(cd.get("license") or "-")
              ds = ",".join(cd.get("datasets") or []) or "-"
              rd = raw(m, "README.md")
              hits = []
              low = rd.lower()
              for w in ("dataset", "training data", "trained on", "corpus", "common voice",
                        "voice of", "speaker consent", "recorded"):
                  if w in low:
                      hits.append(w)
              print("%-40s %-13s %-26s %-7s %s" % (m[:40], lic[:13], ds[:26],
                                                   str(info.get("gated")), ",".join(hits) or "(なし)"))

          print()
          print("=== 学習data側 ===")
          for d in ["mozilla-foundation/common_voice_17_0", "bayartsogt/mbspeech",
                    "mozilla-foundation/common_voice_13_0"]:
              info = api("datasets/" + d)
              if not isinstance(info, dict):
                  print("  %-42s (取得不可 / HFに無い)" % d)
                  continue
              cd = info.get("cardData") or {}
              print("  %-42s license=%s gated=%s" % (d, cd.get("license"), info.get("gated")))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mn-audio-poc
          path: out/
          retention-days: 7
