<!--
  Mongolian 90 — 社長個人β (1ファイル版)
  build-standalone.js が engine/ 言語パック/ UI / 教材を連結して生成する。
  手で編集しない。直すときは元のファイルを直して作り直す。
  生成元: 教材 140件 / モジュール 26本 / 参考音声 0件
-->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f6f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)" />
<!-- 個人βのため検索に載せない。URL を知っている人だけが開く前提 -->
<meta name="robots" content="noindex, nofollow, noarchive" />
<!-- iPhone のホーム画面から開いたときに、ブラウザのバーを出さない -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Mongolian 90" />
<!-- ホーム画面に追加したときの情報。置き場に同じ階層で置く。無くても動く -->
<link rel="manifest" href="manifest.webmanifest" />
<!-- タブのアイコン。外部ファイルを読まないよう、SVGを埋め込む -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f5f6b'/%3E%3Ctext x='32' y='43' font-family='system-ui,sans-serif' font-size='30' font-weight='700' fill='%23fff' text-anchor='middle'%3E90%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>Mongolian 90</title>
<style>
:root{
  --paper:#f4f6f7; --raised:#ffffff; --sunk:#e8ecee; --ink:#141a1d; --dim:#54626a; --faint:#8b979d;
  --line:#d5dde0; --accent:#0f5f6b; --accent-soft:#dbeced; --on-accent:#ffffff;
  --ok:#2c6a4a; --ok-soft:#dcebe3; --warn:#8a5a12; --warn-soft:#f3e9d3; --crit:#a2372c; --crit-soft:#f6e2de;
  --vh:1vh;
  --fs:1;                  /* 文字の倍率。表示設定で変える。押す場所の大きさは変えない */
  --tap:48px;              /* 44pt 以上。実測で余裕を持たせる */
  --tap-main:56px;         /* 主操作。親指で外さない大きさ */
  --tap-pair:60px;         /* 2つ並ぶもの。押し間違えないよう、さらに大きく */
  --action-h:76px;         /* 学習中の押す場所。**答えの前後で変えない高さ** */

  /* 余白。同じ意味の隙間に、画面ごとの独自の値を置かない */
  --space-1:6px;
  --space-2:10px;
  --space-3:14px;
  --space-4:18px;
  --space-5:26px;

  /* 角丸。3種類だけ。同じ意味のものに違う丸みを使わない */
  --radius-card:16px;      /* 面 (箱・カード・行) */
  --radius-btn:12px;       /* 押すもの */
  --radius-pill:99px;      /* 帯・バー・丸い印 */

  /* 文字の大きさ。iPhone で読みやすい実寸から決める。
     ここを1か所にまとめておき、画面ごとに勝手な値を置かない */
  --t-prompt:30px;         /* 日本語の問題 */
  --t-answer:34px;         /* モンゴル語の答え。いちばん目立たせる */
  --t-mission:18px;        /* 今日のミッション。大きさでも CTA を超えない */
  --t-btn:18px;            /* ボタン。主役なので小さくしない */
  --t-body:16px;
  --t-sub:14px;            /* 補助。これより小さくしない */
  --t-tiny:12px;           /* 最小。数字や注記だけ */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#101418; --raised:#191f24; --sunk:#151b20; --ink:#e4ebee; --dim:#95a3ab; --faint:#6d7b83;
  --line:#28323a; --accent:#4fb3c0; --accent-soft:#123034; --on-accent:#101418;
  --ok:#6fb894; --ok-soft:#16301f; --warn:#d3a75c; --warn-soft:#312817; --crit:#e08578; --crit-soft:#331c19;
}}
:root[data-theme="dark"]{
  --paper:#101418; --raised:#191f24; --sunk:#151b20; --ink:#e4ebee; --dim:#95a3ab; --faint:#6d7b83;
  --line:#28323a; --accent:#4fb3c0; --accent-soft:#123034; --on-accent:#101418;
  --ok:#6fb894; --ok-soft:#16301f; --warn:#d3a75c; --warn-soft:#312817; --crit:#e08578; --crit-soft:#331c19;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  font-size:calc(var(--t-body) * var(--fs)); line-height:1.65;
  min-height:100vh; min-height:calc(var(--vh,1vh)*100);
  padding-top:env(safe-area-inset-top);
  overscroll-behavior-y:contain;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none !important}

.wrap{max-width:640px;margin:0 auto;
  padding:12px max(16px, env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right))}

/* ---- 通知 ---- */
#notice{
  background:var(--warn-soft);color:var(--warn);font-size:.82rem;
  padding:10px 16px;border-bottom:1px solid var(--line);
}

/* ---- 見出し行 ---- */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.brand{font-size:.94rem;font-weight:700;letter-spacing:.01em;color:var(--accent)}
#day-label{font-size:.82rem;color:var(--dim);font-variant-numeric:tabular-nums}
.icon-btn{min-height:var(--tap);min-width:var(--tap);padding:0 12px;font-size:.82rem;
  color:var(--dim);border-radius:var(--radius-btn);display:inline-flex;align-items:center;justify-content:center}
.icon-btn:active{background:var(--sunk)}
.track{height:6px;background:var(--sunk);border-radius:var(--radius-pill);overflow:hidden;margin-bottom:18px}
.track>i{display:block;height:100%;background:var(--accent);border-radius:var(--radius-pill)}

/* ---- ホーム上部。出すのは3つだけ ---- */
/* 点数・順位・通貨・残機は作らない。増やすほど学習から目が離れる */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.top-left{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.streak{display:inline-flex;align-items:center;gap:5px;font-size:.9rem;font-weight:700;
  color:var(--warn);font-variant-numeric:tabular-nums}
.streak.off{color:var(--faint);font-weight:600}
.streak-flame{font-size:1rem}

/* ---- 今日のミッション ---- */
/* 「カードを処理する」ではなく「これができるようになる」を先に見せる */
/* 枠で囲まず、面の色だけで区切る。小さい箱を並べると業務アプリに見える */
.mission{background:var(--accent-soft);border-radius:var(--radius-card);
  padding:16px 18px;margin-bottom:14px}
.mission-h{font-size:calc(var(--t-tiny) * var(--fs));color:var(--accent);
  letter-spacing:.08em;font-weight:700}
.mission-t{font-size:calc(var(--t-mission) * var(--fs));font-weight:700;line-height:1.5;
  margin-top:3px;text-wrap:balance}
.mission-n{font-size:.8rem;color:var(--dim);margin-top:6px;font-variant-numeric:tabular-nums}

/* ---- 今週の目当て ---- */
.wk{display:grid;gap:7px}
.wk-row{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:10px;
  background:var(--raised);border:1px solid var(--line);border-radius:var(--radius-btn);
  padding:11px 14px;font-size:.9rem}
.wk-row.met{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
.wk-m{text-align:center}
.wk-n{font-size:.8rem;color:var(--faint);font-variant-numeric:tabular-nums}
.wk-row.met .wk-n{color:var(--ok)}

/* ---- できること ---- */
.can{display:grid;gap:10px}
.can-row{background:var(--raised);border-radius:var(--radius-card);padding:14px 16px}
.can-head{display:flex;align-items:center;gap:8px}
.can-m{color:var(--faint);font-weight:800}
.can-row.on .can-m{color:var(--ok)}
.can-t{font-size:calc(var(--t-body) * var(--fs));font-weight:700}
.can-row.on .can-t{color:var(--ok)}
.can-bar{height:8px;background:var(--sunk);border-radius:var(--radius-pill);overflow:hidden;margin:10px 0 8px}
.can-bar>i{display:block;height:100%;background:var(--accent);border-radius:var(--radius-pill)}
.can-row.on .can-bar>i{background:var(--ok)}
.can-foot{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.can-n{font-size:calc(var(--t-sub) * var(--fs));color:var(--dim);font-variant-numeric:tabular-nums}
.can-used{font-size:calc(var(--t-sub) * var(--fs));color:var(--accent);font-weight:700}

/* ---- 学習中の小さな案内 ---- */
.step-hint{font-size:calc(var(--t-sub) * var(--fs));letter-spacing:.04em;
  font-weight:700;margin-left:auto}
.step-hint.near{color:var(--accent);font-weight:700}

/* ---- 完了画面の飾り ---- */
.perfect{display:inline-flex;align-items:center;gap:7px;align-self:center;margin-top:14px;
  font-size:.94rem;font-weight:800;color:var(--accent);
  background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius-pill);padding:7px 18px}
.cheer-bar{height:8px;background:var(--sunk);border-radius:var(--radius-pill);overflow:hidden;
  margin:18px auto 0;max-width:240px;width:100%}
.cheer-bar>i{display:block;height:100%;background:var(--accent);border-radius:var(--radius-pill);width:0}
@media (prefers-reduced-motion:no-preference){
  .cheer-bar>i{transition:width .55s cubic-bezier(.3,.9,.4,1)}
}
.cheer-sub{font-size:.85rem;color:var(--faint);margin-top:8px;font-variant-numeric:tabular-nums}

/* ---- 1タップ感想 ---- */
.ask{margin-top:26px}
.ask-q{font-size:.9rem;color:var(--dim);margin-bottom:10px}
.ask-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ask-row button{min-height:var(--tap-main);border-radius:var(--radius-btn);font-size:.88rem;
  background:var(--raised);border:1px solid var(--line)}
.ask-row button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);
  color:var(--accent);font-weight:700}
.ask-done{font-size:.85rem;color:var(--ok);margin-top:10px}

/* ---- 今日の目標 ---- */
/* 今日どこまで来たか。枠を持たせず、一行として置く */
.goal{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:0 4px;margin:0 0 26px}
.goal.met .goal-t{color:var(--ok)}
.goal-t{font-size:calc(var(--t-sub) * var(--fs));color:var(--dim)}
.goal-n{font-size:calc(var(--t-body) * var(--fs));font-variant-numeric:tabular-nums;
  color:var(--ink);font-weight:700}
.goal.met .goal-n{color:var(--ok)}

/* ---- 90日の道すじ ---- */
/* いる場所が一目で分かることだけを狙う。前後数日しか出さない */
.path{display:grid;gap:0;margin-bottom:8px}
.path-h{margin-top:30px}
.node{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:14px;
  padding:6px 0;position:relative}
.node-mark{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--sunk);color:var(--faint);border:2px solid var(--line);z-index:1}
.node-line{position:absolute;left:21px;top:0;bottom:0;width:2px;background:var(--line);z-index:0}
.node:first-child .node-line{top:50%}
.node:last-child .node-line{bottom:50%}
.node-body{min-width:0}
.node-d{font-size:.85rem;color:var(--dim);font-variant-numeric:tabular-nums}
.node-t{font-size:.94rem;line-height:1.4;color:var(--faint)}

.node-done .node-mark{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.node-done .node-line{background:var(--ok)}
.node-done .node-d{color:var(--ok);font-weight:700}
.node-done .node-t{color:var(--dim)}

.node-today{padding:14px 0}
.node-today .node-mark{width:56px;height:56px;background:var(--accent);color:var(--on-accent);
  border-color:var(--accent);font-size:1rem;margin-left:-6px}
.node-today .node-d{color:var(--accent);font-weight:800;font-size:1.06rem}
.node-today .node-t{color:var(--ink);font-weight:600}

.node-soon .node-mark{border-style:dashed}
.node-soon .node-t{font-style:normal}

/* ---- ミニレッスンの一覧 ---- */
.lessons{display:grid;gap:2px;margin:6px 0 8px}
.lesson{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:12px;
  min-height:var(--tap);padding:6px 10px;border-radius:var(--radius-btn);text-align:left;
  background:transparent;font-size:calc(var(--t-sub) * var(--fs))}
.lesson-mark{font-size:1rem;text-align:center;color:var(--faint)}
.lesson-sub{font-size:.78rem;color:var(--faint);font-variant-numeric:tabular-nums}
.lesson-done{background:transparent}
.lesson-done .lesson-mark{color:var(--ok)}
.lesson-done .lesson-t{color:var(--ok)}
.lesson-now{background:var(--accent-soft)}
.lesson-now .lesson-mark,.lesson-now .lesson-t{color:var(--accent);font-weight:700}
.lesson-todo{opacity:.72}
/* 残りのレッスン。**破線の枠にしない。**
   点線の箱は「まだ何か入る場所」に見えて、その1行に目が留まる */
.lesson-more{opacity:.6}

/* ホームの注記。**本文と同じ大きさにしない。**
   毎日見る画面で説明が主役より大きいと、それが用件のように読める */
.hero-note{font-size:calc(var(--t-sub) * var(--fs));color:var(--faint);
  line-height:1.6;margin:var(--space-2) 0 var(--space-1)}

/* ---- 練習 ---- */
.practice{display:grid;gap:8px}
.pr{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;
  min-height:var(--tap-pair);padding:12px 15px;text-align:left;border-radius:var(--radius-btn);
  background:var(--raised);border:1px solid var(--line)}
.pr:active{background:var(--sunk)}
/* 見出しと説明は縦に積む。span のままだと1行に続いてしまう */
.pr>span{display:block;min-width:0}
.pr-t{display:block;font-size:.98rem;font-weight:600;line-height:1.4}
.pr-d{display:block;font-size:.78rem;color:var(--faint);margin-top:3px;line-height:1.45}
.pr-n{font-size:.85rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;
  background:var(--accent-soft);border-radius:var(--radius-pill);padding:3px 10px;white-space:nowrap}
.pr-wait .pr-n{color:var(--dim);background:var(--sunk)}
/* いまできないものは、そう見えるようにする。
   押せる見た目のまま反応しないと、壊れているのかどうかが分からない */
.pr[disabled]{opacity:.5}
.pr[disabled]:active{transform:none;background:var(--raised)}

/* ---- 7日カレンダー ---- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px}
.wd{text-align:center}
.wd-l{font-size:calc(var(--t-tiny) * var(--fs));color:var(--faint);margin-bottom:5px}
.wd-m{height:34px;border-radius:var(--radius-btn);display:flex;align-items:center;justify-content:center;
  font-size:.85rem;background:var(--sunk);color:var(--faint)}
.wd-on .wd-m{background:var(--ok-soft);color:var(--ok);font-weight:700}
.wd-today .wd-l{color:var(--accent);font-weight:700}
.wd-today .wd-m{outline:2px solid var(--accent);outline-offset:1px}

/* ---- 組み合わせ練習 ---- */
.match-lead{font-size:.85rem;color:var(--dim);line-height:1.7;margin:0 0 16px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match button{min-height:var(--tap-pair);border-radius:var(--radius-btn);padding:8px 10px;font-size:.94rem;
  background:var(--raised);border:1px solid var(--line);line-height:1.35;word-break:break-word}
.match button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);
  color:var(--accent);font-weight:700}
.match button:disabled{opacity:.32}
.match button.m-hit{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.match button.m-miss{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.match-n{font-size:.85rem;color:var(--dim);text-align:center;margin-top:16px;
  font-variant-numeric:tabular-nums}

/* ---- 一覧（その他・各画面）---- */
.grp{margin-bottom:22px}
.grp-h{font-size:.75rem;color:var(--faint);letter-spacing:.06em;margin-bottom:8px}
.menu{display:grid;gap:8px}
.menu button{min-height:var(--tap-main);border-radius:var(--radius-btn);background:var(--raised);
  border:1px solid var(--line);font-size:.94rem;text-align:left;padding:10px 15px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.menu button>span:first-child{min-width:0}
.menu .m-sub{flex:none}
.menu button:active{background:var(--sunk)}
.menu .m-sub{font-size:.78rem;color:var(--faint);font-variant-numeric:tabular-nums}

.stats{display:grid;gap:8px}
.stat{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius-btn);
  padding:14px 15px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.stat>div{min-width:0}
.stat b{font-size:1.6rem;line-height:1.15;font-variant-numeric:tabular-nums;flex:none}
.stat span{display:block;font-size:.85rem;color:var(--dim);line-height:1.4}
.stat i{display:block;font-style:normal;font-size:.75rem;color:var(--faint);
  margin-top:3px;line-height:1.45}

.about{background:var(--sunk);border-radius:var(--radius-btn);padding:13px 15px;font-size:.82rem;
  color:var(--dim);line-height:1.75}
.about b{color:var(--ink)}
.about p{margin:0 0 9px}
.about p:last-child{margin:0}

/* ---- 90日ロードマップ ---- */
.road{display:grid;gap:8px}
.road-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--raised);border:1px solid var(--line);border-radius:var(--radius-btn);padding:13px 15px}
.road-d{font-weight:700;font-variant-numeric:tabular-nums}
.road-s{font-size:.8rem;padding:4px 10px;border-radius:var(--radius-pill);white-space:nowrap}
.road-ready{background:var(--ok-soft);color:var(--ok)}
.road-soon{background:var(--sunk);color:var(--dim)}

/* ---- 表示設定 ---- */
.opt-row{display:grid;gap:8px;margin-bottom:18px}
.opt{min-height:var(--tap-main);border-radius:var(--radius-btn);background:var(--raised);border:1px solid var(--line);
  font-size:.94rem;text-align:left;padding:0 15px;display:flex;align-items:center;gap:10px}
.opt[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700}
.opt-mark{width:1.2em;flex:none}

/* ---- 主要ボタンは画面下部固定。親指の到達範囲に置く ---- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:10px max(16px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right));
  background:linear-gradient(to top, var(--paper) 72%, transparent);
}
.dock-inner{max-width:640px;margin:0 auto;display:grid;gap:8px}
/* 「次の5問」の上の一行。**煽らない。**事実のときだけ出し、褒美は書かない */
.next-why{font-size:calc(var(--t-sub) * var(--fs));color:var(--dim);text-align:center;
  margin-bottom:2px}
.primary{
  min-height:var(--tap-main);border-radius:var(--radius-btn);background:var(--accent);color:var(--on-accent);
  font-size:calc(var(--t-btn) * var(--fs));font-weight:700;padding:8px 16px;
}
.primary:disabled{opacity:.45}
.ghost{min-height:var(--tap-main);border-radius:var(--radius-btn);background:var(--sunk);color:var(--dim);
  font-size:calc(var(--t-sub) * var(--fs));padding:8px 16px}

/* 押した瞬間に必ず見た目が変わる。「押せたか分からない」を無くす。
   端末の振動は iPhone Safari で動かないので当てにしない */
.primary,.ghost,.judge button,.menu button,.lesson,.pr,.opt,.ob-opt,.match button,.ex-tab,.fav,.spk{
  transition:transform .06s ease-out, filter .06s ease-out;
}
.primary:active,.ghost:active,.judge button:active,.menu button:active,
.lesson:active,.pr:active,.opt:active,.ob-opt:active,.match button:active,
.ex-tab:active,.fav:active,.spk:active{
  transform:scale(.975); filter:brightness(.94);
}
@media (prefers-reduced-motion:reduce){
  .primary:active,.ghost:active,.judge button:active,.menu button:active,
  .lesson:active,.pr:active,.opt:active,.ob-opt:active,.match button:active,
  .ex-tab:active,.fav:active,.spk:active{transform:none}
}
.dock-pad{height:104px}
.dock-pad-2{height:164px}

/* ---- セッション ---- */
.sess-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
#progress{font-size:.82rem;color:var(--dim);font-variant-numeric:tabular-nums}
#quit-btn{font-size:.82rem;color:var(--dim);min-height:var(--tap);padding:0 10px;border-radius:var(--radius-btn)}
#quit-btn:active{background:var(--sunk)}

/* 学習画面は画面いっぱいを使う。
   カードだけに高さを持たせると、問題文が上に寄って下が大きく空く */
#session{min-height:100vh;min-height:calc(var(--vh,1vh)*100);
  display:flex;flex-direction:column}
.card{
  padding:8px 4px;margin-bottom:12px;
  flex:1 1 auto;
  display:flex;flex-direction:column;justify-content:center;text-align:center;
}
.prompt-slot{display:flex;flex-direction:column;justify-content:center}

/**
 * 答えの枠は、**出る前から同じ場所を取っておく。**
 *
 * 以前は答えを出した瞬間に枠が増え、上下中央に寄せているぶん
 * 問題文が上へ動いていた。読み始めた位置が変わると視線をやり直すことになる。
 * かといって場所を空けておくだけだと、問題文が画面の上のほうに寄って
 * 下が大きく空く。**中身はそのままに、見えなくするだけ**にすれば、
 * 高さは実際の答えの長さぴったりで、出ても1pxも動かない。
 * visibility:hidden は読み上げの対象からも外れるので、
 * 答えを先に読まれてしまうこともない。
 */
#answer-box.veiled{visibility:hidden}
/* 手順とレッスンの位置。**毎問おなじ高さ**を取り、出ても出なくても動かさない */
.sess-meta{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);
  min-height:26px;margin-bottom:var(--space-2)}
.step-lead{font-size:calc(var(--t-sub) * var(--fs));color:var(--accent);font-weight:700}
#prompt{font-size:calc(var(--t-prompt) * var(--fs));font-weight:700;line-height:1.45;
  text-wrap:balance;word-break:break-word}
#answer-box{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
#answer{font-size:calc(var(--t-answer) * var(--fs));font-weight:800;line-height:1.35;
  word-break:break-word;letter-spacing:-.01em}
.answer-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.answer-ja{font-size:1.06rem;color:var(--dim);margin-top:12px;line-height:1.5;text-wrap:balance}
.listen-lead{font-size:.94rem;color:var(--dim);margin-bottom:18px;text-wrap:balance}

/* 実使用の記録は、押さない限り邪魔をしない小さなリンク */
/* 答えの下の操作。どちらも同じ弱さにする。
   片方だけボタンらしく見せると、そちらが答えと同じ強さで目に入る */
.sub-actions{display:flex;align-items:center;justify-content:center;gap:4px;
  flex-wrap:wrap;margin-top:24px}
.field-open,.fav{min-height:var(--tap);padding:0 12px;border-radius:var(--radius-btn);
  font-size:calc(var(--t-sub) * var(--fs));color:var(--faint);
  background:none;border:0;text-decoration:underline}
.field-open:active,.fav:active{background:var(--sunk)}
.fav[aria-pressed="true"]{color:var(--warn);font-weight:700;text-decoration:none}

/* 片手で押し間違えないよう、2つの間を広くとる。
   確認のひと手間を毎回入れるより、そもそも外れにくくするほうが速い */
.judge{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}

/**
 * 学習中の押す場所は、**答えを見る前と後で同じ高さ**にする。
 *
 * 文字を大きくした 320px 幅で「言えなかった」が2行になり、
 * 「答えを見る」(1行) との差で主操作が 28px 跳ねていた。
 * 親指を置く位置が問題ごとに変わると、それだけで押し間違いが増える。
 * どの状態でも収まる高さを先に取っておく。
 */
#session-dock #reveal-btn,
#session-dock #next-btn,
#session-dock .judge{min-height:var(--action-h)}
.judge button{min-height:var(--tap-pair);border-radius:var(--radius-btn);font-weight:700;padding:8px 6px;
  font-size:calc(var(--t-btn) * var(--fs))}
/* 幅の狭い端末で文字を大きくすると「言えなかった」が2行になり、
   高さを取っておいてもなお 8px はみ出していた。
   ここだけ本文の大きさに落として1行に収める (それでも 16px は下回らない) */
@media (max-width:360px){
  .judge button{font-size:calc(var(--t-body) * var(--fs))}
}

#judge-wrong{background:var(--crit-soft);color:var(--crit)}
#judge-ok{background:var(--ok-soft);color:var(--ok)}
.keyhint{font-size:calc(var(--t-tiny) * var(--fs));color:var(--faint);text-align:center;margin-top:8px}
@media (hover:none){.keyhint{display:none}}

/* 押したことが分かる短い合図。ゲーム的な演出はしない */
/* 押したボタンのすぐ上に出す。画面の真ん中に出すと問題文を覆ってしまう */
#tap-ack{
  position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:40;
  display:flex;align-items:center;gap:10px;
  padding:16px 24px;border-radius:var(--radius-card);font-size:1.06rem;font-weight:700;
  background:var(--raised);border:1px solid var(--line);
  box-shadow:0 6px 24px rgba(0,0,0,.16);
  pointer-events:none;
}
#tap-ack.ok{color:var(--ok);border-color:var(--ok)}
#tap-ack.ng{color:var(--warn);border-color:var(--warn)}
/* 「覚える」を進めたときの印。言葉を付けないので、その分だけ小さくする */
#tap-ack.learn{color:var(--accent);border-color:var(--accent);padding:12px 20px}
#tap-ack .ack-mark{font-size:1.3rem}
@media (prefers-reduced-motion:no-preference){
  #tap-ack{animation:ackin .12s ease-out}
  @keyframes ackin{from{opacity:0}to{opacity:1}}
}

/* ---- 参考音声（音声が入るまで、これらは画面に出ない）---- */
.spk{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap-main);min-width:56px;padding:0 18px;border-radius:var(--radius-card);
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);
  font-size:.94rem;font-weight:700;
}
.spk:active{filter:brightness(.95)}
/* 鳴っている間の印。**音が出たかどうかは画面からは分からない**ので、
   分かるのは「鳴らそうとしている」ことだけ。音量を絞っていても押した手応えは残る。
   ずっと動くものは置かない (視界の端で動き続けるものは、学習の邪魔になる) */
.spk.is-playing{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.spk svg{width:1.35em;height:1.35em;flex:none}
.spk-big{min-height:96px;min-width:180px;font-size:1.12rem;border-radius:var(--radius-card)}
.spk-big svg{width:2em;height:2em}
.sess-actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:20px}

/* 保存(お気に入り)。学習の判定とは別物なので、色も位置も分ける */
/* 一覧の中の ☆ はボタンとして見せる (押せることが分かる必要があるため) */
/* 一覧の ☆ は、表現より目立たせない。囲むと同じ強さで目に入る */
.ph-item .fav{background:none;color:var(--faint);border:0;
  border-radius:var(--radius-btn);text-decoration:none;padding:0 14px}
.ph-item .fav[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}

/* ---- 商談中に数秒で探すための見出しジャンプ ---- */
/* 横に並べて上に貼り付ける。スクロールして探す時間を無くす */
.jump{position:sticky;top:68px;z-index:5;display:flex;gap:6px;overflow-x:auto;
  padding:10px 0 12px;margin-bottom:6px;background:var(--paper);
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;min-height:44px;padding:0 14px;border-radius:var(--radius-pill);
  font-size:calc(var(--t-sub) * var(--fs));font-weight:600;white-space:nowrap;
  background:var(--sunk);color:var(--dim)}
.jump button[aria-current="true"]{background:var(--accent);color:var(--on-accent)}

/* ---- 保存したフレーズ / 商談の直前に見る ---- */
/* 商談中に日本語で探す。既存教材の中だけを絞り込む */
.ph-search{position:sticky;top:0;z-index:6;background:var(--paper);
  padding:2px 0 var(--space-2)}
.ph-q{width:100%;min-height:var(--tap-main);border-radius:var(--radius-btn);
  border:1px solid var(--line);background:var(--raised);color:var(--ink);
  padding:0 var(--space-3);font-size:calc(var(--t-body) * var(--fs))}
.ph-q::placeholder{color:var(--faint)}
.ph-count{font-size:calc(var(--t-sub) * var(--fs));color:var(--dim);
  margin-bottom:var(--space-2);font-variant-numeric:tabular-nums}

.ph-topic{font-size:1.06rem;font-weight:700;margin:26px 0 10px;padding-bottom:6px;
  border-bottom:2px solid var(--accent);color:var(--accent)}
.ph-topic:first-child{margin-top:0}
.ph-item{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius-card);
  padding:14px 15px;margin-bottom:9px;display:flex;align-items:center;gap:12px}
.ph-txt{flex:1;min-width:0}
.ph-ja{font-size:.94rem;color:var(--dim);line-height:1.45}
.ph-mn{font-size:1.35rem;font-weight:700;line-height:1.35;word-break:break-word;margin-top:3px}
.ph-lead{font-size:.85rem;color:var(--dim);line-height:1.7;margin:0 0 20px}
/* 一覧のあとに置く但し書き。読み終わったあとに目に入ればよい */
.ph-lead-foot{font-size:calc(var(--t-sub) * var(--fs));color:var(--faint);
  margin:var(--space-4) 0 0}
.ph-del{min-height:var(--tap);min-width:var(--tap);border-radius:var(--radius-btn);font-size:.82rem;
  background:var(--sunk);color:var(--dim);border:1px solid var(--line);padding:0 12px}

/* ---- 書き出し / 不具合報告 ---- */
.copybox{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius-card);padding:15px}
.copy-lead{font-size:.85rem;color:var(--dim);line-height:1.7;margin:0 0 14px}
/* この画面の用件。幅いっぱいにして、下の「もどる」より強く見せる */
.copy-btn{width:100%}
.copy-done{font-size:.85rem;color:var(--ok);margin-top:12px;font-weight:700}
.copy-detail{margin-top:14px}
.copy-detail summary{font-size:.82rem;color:var(--dim);min-height:var(--tap);
  display:flex;align-items:center;cursor:pointer}
#export-text,#diag-text{
  width:100%;border-radius:var(--radius-btn);border:1px solid var(--line);background:var(--sunk);
  color:inherit;padding:10px;font-size:.75rem;line-height:1.5;margin-top:10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;
}
.export-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ex-tab{
  min-height:var(--tap);border-radius:var(--radius-btn);font-size:.82rem;font-weight:600;padding:6px 8px;
  background:var(--sunk);color:var(--dim);border:1px solid var(--line);
}
.ex-tab[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

/* ---- 実使用フィードバック ---- */
/* 学習の判定 (言えた/言えなかった) と混ざらないよう、色も位置も分ける */
.field{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);text-align:left}
.field-h{font-size:.85rem;font-weight:700;margin-bottom:10px;line-height:1.5}
.field-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.field-grid button{
  min-height:var(--tap);border-radius:var(--radius-btn);font-size:.82rem;font-weight:600;line-height:1.25;
  background:var(--sunk);color:var(--dim);border:1px solid var(--line);padding:6px 4px;
}
.field-grid button.fr-wide{grid-column:span 3}
.field-grid button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.field-step2{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.field-q{font-size:.85rem;font-weight:700;margin-bottom:8px;line-height:1.4}
.field-corr{display:none;gap:8px;margin-top:10px}
.field-corr.on{display:grid;grid-template-columns:1fr auto}
.field-corr input{
  min-height:var(--tap);border-radius:var(--radius-btn);border:1px solid var(--line);
  background:var(--raised);color:inherit;padding:0 12px;font-size:16px;
}
.field-corr button{min-height:var(--tap);border-radius:var(--radius-btn);padding:0 16px;font-weight:700}
.field-done{font-size:.78rem;color:var(--ok);margin-top:8px}
.fr-item{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius-card);padding:14px;margin-bottom:10px}
.fr-item .fr-ja{font-size:.9rem;color:var(--dim)}
.fr-item .fr-mn{font-size:1.2rem;font-weight:700;margin:2px 0 10px;word-break:break-word}
.fr-empty{color:var(--faint);font-size:.9rem;padding:20px 0;line-height:1.7}

/* ---- レッスン完了 / 1日の完了 ---- */
/* 紙吹雪のような派手な演出は毎回出さない。1日の完了だけ少し強くする */
/* 完了画面も画面いっぱいを使い、中身を上下の真ん中に置く。
   高さを決め打ちすると、下に大きな空白が残って「途中で切れた」ように見える */
#summary{min-height:100vh;min-height:calc(var(--vh,1vh)*100);
  display:flex;flex-direction:column}
.cheer{display:flex;flex-direction:column;justify-content:center;text-align:center;
  flex:1 1 auto;gap:4px}
.cheer-mark{font-size:2.6rem;line-height:1;margin-bottom:10px}
.cheer-t{font-size:1.6rem;font-weight:800;line-height:1.25}
/* 数字より先に「終わった」が目に入るよう、印(2.6rem)より小さくする */
.cheer-n{font-size:2rem;font-weight:800;margin-top:16px;font-variant-numeric:tabular-nums}
.cheer-n small{font-size:1rem;font-weight:700;margin-left:3px}
.cheer-note{font-size:.94rem;color:var(--dim);margin-top:18px;line-height:1.7;text-wrap:balance}
.cheer-streak{display:inline-flex;align-items:center;gap:6px;margin-top:18px;
  font-size:1rem;font-weight:700;color:var(--warn);
  background:var(--warn-soft);border-radius:var(--radius-pill);padding:8px 18px;align-self:center}
@media (prefers-reduced-motion:no-preference){
  .cheer-mark{animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
  .cheer .cheer-n{animation:rise .45s ease-out}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
}

/* ---- まとめ ---- */
.done{display:flex;flex-direction:column;justify-content:center;text-align:center;
  min-height:52vh;min-height:calc(var(--vh,1vh)*52);gap:4px}
.done-t{font-size:1.75rem;font-weight:800;line-height:1.2}
.done-n{font-size:2.6rem;font-weight:800;margin-top:14px;font-variant-numeric:tabular-nums}
.done-n small{font-size:1.1rem;font-weight:700;margin-left:3px}
.done-split{display:flex;justify-content:center;gap:34px;margin-top:20px}
.done-split div{text-align:center}
.done-split b{display:block;font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.done-split span{font-size:.82rem;color:var(--dim)}
.done-ok b{color:var(--ok)}
.done-ng b{color:var(--crit)}
.done-learn b{color:var(--accent)}
.done-note{font-size:.9rem;color:var(--dim);margin-top:22px;line-height:1.7;text-wrap:balance}

/* ---- オンボーディング ---- */
.ob-step{font-size:.75rem;color:var(--faint);letter-spacing:.06em;margin-bottom:6px}
#ob-body h2{font-size:1.35rem;margin:0 0 16px;line-height:1.35;text-wrap:balance}
.ob-options{display:grid;gap:8px}
.ob-opt{
  display:flex;flex-direction:column;gap:2px;text-align:left;
  min-height:var(--tap-main);padding:13px 15px;
  background:var(--raised);border:1px solid var(--line);border-radius:var(--radius-btn);
}
.ob-opt:active{background:var(--sunk)}
.ob-opt-t{font-weight:700}
.ob-opt-d{font-size:.78rem;color:var(--dim)}
.ob-preset{
  margin-top:16px;min-height:var(--tap-main);width:100%;padding:12px;
  background:var(--sunk);color:var(--dim);border-radius:var(--radius-btn);font-size:.85rem;
}

/* ---- 節目チェックポイント ---- */
.cp-list{display:grid;gap:8px;margin-bottom:16px}
.cp-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--raised);border:1px solid var(--line);border-radius:var(--radius-btn);padding:12px 14px}
.cp-txt{font-size:.9rem}
.cp-judge{font-size:calc(var(--t-tiny) * var(--fs));font-weight:700;padding:3px 9px;border-radius:var(--radius-pill);white-space:nowrap}
.cp-tutor{background:var(--warn-soft);color:var(--warn)}
.cp-auto{background:var(--sunk);color:var(--dim)}
.cp-verdict{border-radius:var(--radius-btn);padding:14px 16px;margin-bottom:14px}
.cp-verdict .cp-v-t{font-size:1.06rem;font-weight:700;margin-bottom:4px}
.cp-verdict .cp-v-d{font-size:.85rem;line-height:1.6}
.cp-pending{background:var(--warn-soft);color:var(--warn)}
.cp-passed{background:var(--ok-soft);color:var(--ok)}
.cp-failed{background:var(--crit-soft);color:var(--crit)}
.cp-note{font-size:.8rem;color:var(--dim);background:var(--sunk);border-radius:var(--radius-btn);padding:11px 13px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="notice" hidden></div>
<!-- 押したことが分かる短い合図。次の問題へは自動で進む -->
<div id="tap-ack" hidden role="status" aria-live="polite"></div>

<!-- オンボーディング -->
<main id="onboarding" class="wrap" hidden>
  <div class="head"><span class="brand">Mongolian 90</span></div>
  <div id="ob-body"></div>
</main>

<!-- ホーム。開いて「何を押せばいいか」を考えさせない -->
<main id="home" class="wrap" hidden>
  <!-- 上部に出すのは3つだけ。点数・順位・通貨・残機は作らない -->
  <div class="topbar">
    <div class="top-left">
      <span class="brand">Mongolian 90</span>
      <span class="streak" id="streak-chip" hidden></span>
      <span id="day-label">—</span>
    </div>
    <button id="more-btn" class="icon-btn" type="button">その他</button>
  </div>

  <!-- おかえりなさい。間が空いても責めない -->
  <div class="mission" id="welcome-box" hidden>
    <div class="mission-t" id="welcome-t"></div>
    <div class="mission-n" id="welcome-n"></div>
  </div>

  <!-- 今日のミッション。「これができるようになる」を先に見せる。
       ただし主役は下の大きなボタンなので、文字はそれより弱くする -->
  <div class="mission" id="mission-box" hidden>
    <div class="mission-h">今日のミッション</div>
    <div class="mission-t" id="mission-t"></div>
  </div>

  <!-- 今日どこまで来たか。1行だけ -->
  <div class="goal" id="goal-box" hidden>
    <span class="goal-t" id="goal-t">今日</span>
    <span class="goal-n" id="goal-n"></span>
  </div>

  <!-- 今日を5問ずつに分けたもの。開始ボタンのすぐ上に置く -->
  <div class="lessons" id="lessons"></div>

  <div class="hero-note" id="today-note" hidden></div>

  <!-- 90日の道すじ。いちばん下。毎日見る必要はないが、いる場所は分かる -->
  <div class="grp-h path-h" id="path-h" hidden>90日の道すじ</div>
  <div class="path" id="path"></div>

  <div class="dock-pad-2"></div>
</main>

<div class="dock" id="home-dock">
  <div class="dock-inner">
    <button id="start-btn" class="primary" type="button">5問だけ進める</button>
    <button id="practice-btn" class="ghost" type="button">練習</button>
  </div>
</div>

<!-- その他。毎日の学習動線には置かないものをここへ集める -->
<main id="more" class="wrap" hidden>
  <div class="head"><span class="brand">その他</span></div>
  <div id="update-row" hidden>
    <div class="grp">
      <div class="menu">
        <button id="update-btn" type="button">
          <span>更新があります</span><span class="m-sub">押すと新しい版になります</span>
        </button>
      </div>
    </div>
  </div>
  <div class="grp">
    <div class="menu" id="more-menu"></div>
  </div>
  <div class="dock-pad"></div>
</main>

<div class="dock" id="more-dock" hidden>
  <div class="dock-inner">
    <button id="more-back" class="primary" type="button">ホームへ戻る</button>
  </div>
</div>

<!-- 「その他」の中の各画面。中身は JS が組み立てる -->
<main id="sheet" class="wrap" hidden>
  <div class="head"><span class="brand" id="sheet-title">—</span></div>
  <div id="sheet-body"></div>
  <div class="dock-pad"></div>
</main>

<div class="dock" id="sheet-dock" hidden>
  <div class="dock-inner">
    <button id="sheet-back" class="primary" type="button">もどる</button>
  </div>
</div>

<!-- 学習画面。ここには説明を置かない -->
<main id="session" class="wrap" hidden>
  <div class="sess-top">
    <span id="progress">0 / 0</span>
    <button id="quit-btn" type="button">終了</button>
  </div>
  <div class="track"><i id="progress-bar" style="width:0%"></i></div>

  <!-- 手順と「あと何問」。**この行の高さは毎問おなじ。**
       出たり消えたりで問題文の位置が動かないようにする -->
  <div class="sess-meta">
    <span class="step-lead" id="step-label" hidden>覚える</span>
    <span class="step-hint" id="step-hint" aria-live="polite" hidden></span>
  </div>

  <div class="card">
    <!-- 問題文の枠。高さを先に取り、答えはこの下に出す -->
    <div class="prompt-slot">
      <!-- 聞き取りの問題。音声が入るまで、この一式は一度も表示されない -->
      <div id="listen-prompt" hidden>
        <div class="listen-lead">聞こえたモンゴル語の意味は？</div>
        <button id="listen-big" class="spk spk-big" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2.2v2.1a7.7 7.7 0 0 1 0 15.4v2.1a9.8 9.8 0 0 0 0-19.6z"/></svg><span>聞く</span></button>
      </div>

      <div id="prompt">—</div>
    </div>

    <div id="answer-box" hidden>
      <!-- モンゴル語はこの画面の主役。**真ん中に置く。**
           隣にボタンを並べると、その分だけ答えが横にずれる -->
      <div class="answer-row">
        <div id="answer">—</div>
      </div>
      <!-- 聞き取りのときだけ、意味をここに出す -->
      <div class="answer-ja" id="answer-ja" hidden></div>

      <!-- 音の操作は**1つだけ。**押すたびに最初から鳴る。
           ボタンに「合成」と書いてあるので、別に注記を並べなくてよい -->
      <div class="sess-actions">
        <button id="speak-btn" class="spk" type="button" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2.2v2.1a7.7 7.7 0 0 1 0 15.4v2.1a9.8 9.8 0 0 0 0-19.6z"/></svg><span id="speak-label">参考音声（合成）</span></button>
      </div>

      <!-- 押さない限り、通常の学習の邪魔をしない -->
      <div class="sub-actions">
        <button id="fav-btn" class="fav" type="button" aria-pressed="false">☆ 保存</button>
        <button id="field-open" class="field-open" type="button">実際の会話で使った</button>
      </div>

      <div class="field" id="field-row" hidden>
        <div class="field-h">実際の会話で、この表現はどうでしたか？</div>
        <div class="field-grid" id="field-buttons"></div>

        <div class="field-step2" id="field-step2" hidden>
          <div class="field-q">同じモンゴル語を、画面で相手に見せましたか？</div>
          <div class="field-grid" id="field-text-buttons"></div>
        </div>

        <div class="field-corr" id="field-corr">
          <input id="field-corr-input" type="text" inputmode="text"
                 placeholder="相手が実際に言い直した表現" autocomplete="off">
          <button id="field-corr-save" class="primary" type="button">記録</button>
        </div>
        <div class="field-done" id="field-done" hidden></div>
      </div>
    </div>
  </div>
  <div class="dock-pad"></div>
</main>

<div class="dock" id="session-dock" hidden>
  <div class="dock-inner">
    <button id="reveal-btn" class="primary" type="button">答えを見る</button>
    <button id="next-btn" class="primary" type="button" hidden>覚えた・次へ</button>
    <div id="judge-row" class="judge" hidden>
      <button id="judge-wrong" type="button">言えなかった</button>
      <button id="judge-ok" type="button">言えた</button>
    </div>
    <div class="keyhint" id="keyhint">Space = 答え / ← 言えなかった / → 言えた</div>
  </div>
</div>

<!-- 実使用フィードバック（あとから記録する） -->
<main id="fieldlog" class="wrap" hidden>
  <div class="head"><span class="brand">実際に使った結果</span></div>
  <p class="ph-lead" id="fieldlog-note">
    商談や会話で実際に使った表現の結果を記録します。通じなかったときは、
    できるだけ画面を見せて、その結果も残してください。
  </p>
  <div id="fieldlog-body"></div>
  <div class="dock-pad"></div>
</main>

<div class="dock" id="fieldlog-dock" hidden>
  <div class="dock-inner">
    <button id="fieldlog-back" class="primary" type="button">もどる</button>
  </div>
</div>

<!-- 節目チェックポイント -->
<main id="checkpoint" class="wrap" hidden>
  <div id="cp-body"></div>
  <div class="dock-pad"></div>
</main>

<div class="dock" id="checkpoint-dock" hidden>
  <div class="dock-inner">
    <button id="cp-continue" class="primary" type="button">確認した</button>
  </div>
</div>

<!-- レッスン完了 / 今日の完了。どちらもここを使い、文言と演出だけ変える -->
<main id="summary" class="wrap" hidden>
  <div class="cheer">
    <div class="cheer-mark" id="done-mark" aria-hidden="true">✓</div>
    <div class="cheer-t" id="done-t">5問 完了</div>
    <div class="cheer-n"><span id="done-count">0</span><small>問</small></div>
    <!-- 0のものは出さない。「0 もう一度」は読む価値が無く、見出しの数だけ増える -->
    <div class="done-split">
      <div class="done-learn" id="cell-learned"><b id="done-learned">0</b><span>覚えた</span></div>
      <div class="done-ok" id="cell-ok"><b id="done-ok">0</b><span>言えた</span></div>
      <div class="done-ng" id="cell-ng"><b id="done-ng">0</b><span>もう一度</span></div>
    </div>
    <div class="perfect" id="done-perfect" hidden></div>
    <div class="cheer-bar"><i id="done-bar"></i></div>
    <div class="cheer-sub" id="done-sub"></div>
    <div class="cheer-streak" id="done-streak" hidden></div>
    <div class="cheer-note" id="done-note" hidden></div>

    <!-- その日の分を終えたときだけ、任意で1タップ。答えなくてよい -->
    <div class="ask" id="ask-box" hidden>
      <div class="ask-q">今日の量は？（答えなくても大丈夫です）</div>
      <div class="ask-row" id="ask-row"></div>
      <div class="ask-done" id="ask-done" hidden></div>
    </div>
  </div>
  <div class="dock-pad-2"></div>
</main>

<div class="dock" id="summary-dock" hidden>
  <div class="dock-inner">
    <!-- 事実として正しいときだけ、次の5問で何が起きるかを一行だけ添える -->
    <div class="next-why" id="next-why" hidden></div>
    <button id="next-lesson" class="primary" type="button" hidden>次の5問</button>
    <!-- その日の分を終えたあとだけ。押さなくても今日は成功 -->
    <button id="extra-btn" class="ghost" type="button" hidden>もう5問チャレンジ</button>
    <button id="back-home" class="primary" type="button">ホームへ</button>
  </div>
</div>

<!-- 組み合わせ練習。覚え具合もSRSも動かさない -->
<main id="match" class="wrap" hidden>
  <div class="head"><span class="brand">組み合わせ</span></div>
  <p class="match-lead" id="match-lead"></p>
  <div class="match" id="match-grid"></div>
  <div class="match-n" id="match-n"></div>
  <div class="dock-pad"></div>
</main>

<div class="dock" id="match-dock" hidden>
  <div class="dock-inner">
    <button id="match-again" class="primary" type="button" hidden>もう5組</button>
    <button id="match-back" class="ghost" type="button">練習へ戻る</button>
  </div>
</div>

</body>
</html>

// ===== engine/field-report.js =====
(() => {
/**
 * 実使用フィードバック (Field QA)。
 *
 * 人間の言語監修者を置かない構成では、「その表現が実際に通じるか」を
 * 事前に判定する工程が存在しない。したがってそれを事後に拾う経路が要る。
 *
 * ただし、**「通じなかった」から「教材が悪い」を導いてはいけない。**
 * 通じなかった原因には、教材側の問題(意味の誤り・不自然さ・場面違い)だけでなく、
 * 学習者側の問題(発音・速度・声量)や環境の問題(雑音・相手が聞いていない・
 * 教材どおりに言わなかった)がある。この構成では AI による発音判定を禁止しているため、
 * 発話が原因かどうかをアプリが判定する手段は無い。
 *
 * そこで、負の結果が出たときだけ **文字で見せたらどうだったか** を1問だけ聞く。
 * 文字で見せて通じたなら、少なくともその文自体は相手に伝わる形をしている。
 * 文字でも通じなかったなら、教材側を疑う根拠になる。
 * この1問が、発話問題と教材問題を分ける唯一の手がかりである。
 *
 * この工程がしないこと:
 *   - 発音の採点 (低資源言語では判定が当てにならず、誤った音を固定する)
 *   - 教材本文の自動降格・自動置換 (帰属が確定しないため)
 *   - 相手の言い直しをそのまま正解として採用すること
 */

/** 話したときの結果。UI の5つの選択肢と1対1で対応する。 */
const SPOKEN_OUTCOMES = ['understood', 'repeated', 'not_understood', 'wrong_reaction', 'corrected'];

/** understood 以外は、原因の切り分けが要る。 */
const NEGATIVE_SPOKEN = ['repeated', 'not_understood', 'wrong_reaction', 'corrected'];

/**
 * 文字で見せたときの結果。負の結果のときだけ聞く。
 *   not_shown        文字は見せていない → 帰属を決められない
 *   understood       文字を見せたら通じた → 発話側が疑わしい
 *   not_understood   文字を見せても通じなかった → 教材側が疑わしい
 *   corrected        相手が別の表現に直した → 要確認 (ただし誤りの証明ではない)
 */
const TEXT_CHECKS = ['not_shown', 'understood', 'not_understood', 'corrected'];

/**
 * 1件の記録の帰属。
 *   positive          意図が伝わった
 *   delivery_suspect  話してNG / 文字OK。**教材の問題ではない**
 *   content_suspect   文字でもNG。教材側を疑う根拠
 *   correction        相手が別表現へ直した。要確認
 *   inconclusive      文字を見せていない。どちらとも言えない
 */
const ATTRIBUTIONS = ['positive', 'delivery_suspect', 'content_suspect', 'correction', 'inconclusive'];

/**
 * 教材ごとの Field QA 状態。**教材本体の status (draft/ai_checked/production_ready) とは別軸。**
 * 実使用の記録がこちらを動かし、教材本体の status は書き換えない。
 *
 *   unobserved         現 revision での実使用記録が無い
 *   field_observed     使われた。問題は出ていない
 *   delivery_suspect   話してNGだが文字ではOK。教材の問題として扱わない
 *   qa_attention       文字でもNGが1回。再確認の候補
 *   qa_attention_high  強い証拠がある (下記 STRONG_EVIDENCE)。再QAへ送る
 *   suspended          新規学習を一時停止した。**削除ではない**
 *   revised            本文を修正した。次の revision で再度実使用にかける
 */
const FIELD_STATUS = [
  'unobserved', 'field_observed', 'delivery_suspect',
  'qa_attention', 'qa_attention_high', 'suspended', 'revised',
];

/** SRS から外す Field QA 状態。suspended だけ。suspect は外さない。 */
const FIELD_BLOCKS_SRS = ['suspended'];

/**
 * 1件の実使用記録を作る。
 *
 * contentRevision は「そのとき画面に出ていた本文の版」。
 * 本文を直したら版を上げるので、古い版の悪い結果が新しい版の評価に混ざらない。
 *
 * counterpartCorrection は **相手が実際に言い直した表現** のみ。
 * 「ネイティブが監修した」という意味では絶対に使わない。
 */
function newReport(p) {
  if (!SPOKEN_OUTCOMES.includes(p.spokenOutcome)) {
    throw new Error(`未知の spokenOutcome: ${p.spokenOutcome}`);
  }
  const textCheck = p.textCheck || 'not_shown';
  if (!TEXT_CHECKS.includes(textCheck)) throw new Error(`未知の textCheck: ${textCheck}`);
  if (p.spokenOutcome === 'understood' && textCheck !== 'not_shown') {
    // 通じたのに文字確認が入るのは、UIの流れとして起こらない。取り違えを弾く。
    throw new Error('understood に textCheck は付かない');
  }
  if (!p.itemId) throw new Error('itemId が無い');
  if (!Number.isInteger(p.contentRevision) || p.contentRevision < 1) {
    throw new Error('contentRevision (1以上の整数) が無い。どの版に対する記録か特定できない');
  }
  return {
    at: p.at || new Date().toISOString(),
    itemId: p.itemId,
    contentRevision: p.contentRevision,
    spokenOutcome: p.spokenOutcome,
    textCheck,
    counterpartCorrection: p.counterpartCorrection || null,  // 相手が実際に言い直した表現
    context: p.context || null,                              // どの場面で使ったか
    note: p.note || null,
  };
}

/** 1件の記録の帰属を決める。ここには閾値も重みも無い。事実の分類だけ。 */
function attributionOf(r) {
  if (r.spokenOutcome === 'understood') return 'positive';
  if (r.textCheck === 'corrected' || r.counterpartCorrection) return 'correction';
  if (r.textCheck === 'understood') return 'delivery_suspect';
  if (r.textCheck === 'not_understood') return 'content_suspect';
  return 'inconclusive';   // 文字を見せていない
}

/** その記録の暦日 (UTC基準の粗い区切り)。「異なる日に複数回」の判定に使う。 */
function dayOf(r) { return String(r.at || '').slice(0, 10); }

/**
 * 教材の問題を強く示す証拠。X7。
 * どれか1つでも当たれば qa_attention_high。
 */
function strongEvidence(reports) {
  const reasons = [];
  const contentSuspect = reports.filter(r => attributionOf(r) === 'content_suspect');
  const corrections = reports.filter(r => attributionOf(r) === 'correction');

  if (corrections.length) reasons.push('相手が別の表現へ直した');
  if (reports.some(r => r.spokenOutcome === 'wrong_reaction' && r.textCheck === 'not_understood')) {
    reasons.push('意味と違う反応があり、文字で見せても通じなかった');
  }
  const days = new Set(contentSuspect.map(dayOf));
  if (days.size >= 2) reasons.push('異なる日に、文字でも通じない結果が複数回');
  return reasons;
}

/**
 * 教材1件の実使用の集計。
 *
 * **現 revision の記録だけを数える。** 古い版の結果は履歴として残るが、
 * 修正後の版の評価には使わない (X6)。
 *
 * @param {Array} reports 全記録
 * @param {string} itemId
 * @param {number} revision 現在の本文の版
 */
function scoreOf(reports, itemId, revision) {
  const all = reports.filter(r => r.itemId === itemId);
  const current = all.filter(r => r.contentRevision === revision);
  const previous = all.filter(r => r.contentRevision !== revision);

  const by = { positive: 0, delivery_suspect: 0, content_suspect: 0, correction: 0, inconclusive: 0 };
  for (const r of current) by[attributionOf(r)] += 1;

  const corrections = current.filter(r => r.counterpartCorrection).map(r => r.counterpartCorrection);
  const evidence = strongEvidence(current);

  let status;
  if (!current.length) status = 'unobserved';
  else if (evidence.length) status = 'qa_attention_high';
  else if (by.content_suspect) status = 'qa_attention';
  else if (by.delivery_suspect) status = 'delivery_suspect';
  else status = 'field_observed';

  return {
    itemId, revision, status,
    uses: current.length,
    firstPassSuccess: current.length ? current[0].spokenOutcome === 'understood' : null,
    by, corrections, evidence,
    contexts: [...new Set(current.map(r => r.context).filter(Boolean))],
    carriedOverFromPreviousRevisions: previous.length,   // 履歴としては残るが集計外
  };
}

/**
 * 実使用の記録を反映した Field QA 状態を返す。
 *
 * **教材本体の status は触らない。** 返すのは fieldStatus だけ。
 * suspended / revised は人の操作でしか付かないので、ここでは維持する。
 */
function fieldStatusOf(item, reports) {
  const cur = item.fieldStatus;
  if (cur === 'suspended' || cur === 'revised') return cur;
  return scoreOf(reports, item.id, item.contentRevision || 1).status;
}

/**
 * 新規学習を一時停止する。**削除ではない。**
 * 強い証拠がある場合だけ。教材本文は一切変えない。
 */
function suspend(item, reports) {
  const s = scoreOf(reports, item.id, item.contentRevision || 1);
  if (s.status !== 'qa_attention_high') {
    return { ok: false, reason: '強い証拠が無い。一時停止は qa_attention_high のときだけ', score: s };
  }
  return { ok: true, fieldStatus: 'suspended', evidence: s.evidence, score: s };
}

/** 一時停止を解除する。本文を直していないので revision は上がらない。 */
function unsuspend(item) {
  if (item.fieldStatus !== 'suspended') return { ok: false, reason: 'suspended ではない' };
  return { ok: true, fieldStatus: 'unobserved' };
}

/**
 * 本文を修正したときの遷移。revision を1つ上げ、Field QA をやり直す。
 * 古い記録は消さない (X6/X8)。集計から外れるだけ。
 */
function revise(item) {
  return {
    ok: true,
    contentRevision: (item.contentRevision || 1) + 1,
    fieldStatus: 'revised',
    revisedAt: new Date().toISOString().slice(0, 10),
  };
}

/** 修正版を再度実使用にかけられる状態へ戻す。 */
function backToField(item) {
  if (item.fieldStatus !== 'revised') return { ok: false, reason: 'revised ではない' };
  return { ok: true, fieldStatus: 'unobserved' };
}

/**
 * 第2巡 Language QA の対象を選ぶ (X4)。
 * **全件を再レビューしない。** 新しい実使用の証拠が出た項目だけ。
 */
function reviewQueue(items, reports) {
  const out = [];
  for (const it of items) {
    const rev = it.contentRevision || 1;
    const s = scoreOf(reports, it.id, rev);
    if (s.status !== 'qa_attention' && s.status !== 'qa_attention_high') continue;
    out.push({
      item_id: it.id,
      contentRevision: rev,
      current_ja: it.ja,
      current_mn: it.mn,
      fieldReports: reports.filter(r => r.itemId === it.id && r.contentRevision === rev),
      contexts: s.contexts,
      counterpartCorrections: s.corrections,
      reason_for_review: s.evidence.length ? s.evidence : ['文字で見せても通じなかった'],
      severity: s.status === 'qa_attention_high' ? 'high' : 'medium',
    });
  }
  return out.sort((a, b) => (a.severity === b.severity ? 0 : a.severity === 'high' ? -1 : 1));
}

/**
 * Field QA の指標 (X9)。**1つの割合にまとめない。**
 * delivery と content を混ぜた瞬間に、この設計の意味が消える。
 */

      const res = await fetch(new URL('../languages/mn/vocab.json', import.meta.url).href);
      vocab = await res.json();
    }
  } catch (e) { return { added: 0, skipped: 0, revised: 0 }; }
  let added = 0, skipped = 0, revised = 0;
  for (const v of vocab.items) {
    // draft は学習対象にしない。engine 側でも弾かれるが、そもそも取り込まない
    if (v.status === 'draft') { skipped += 1; continue; }
    const rev = v.contentRevision || 1;
    const known = state.cards[v.id];
    if (known) {
      known.reviewStatus = v.status;
      known.promptKey = v.ja;
      known.answerKey = v.mn;
      // 本文が新しい版になったときの扱いは engine が決める。
      // 古い版の記録は消えず、集計から外れるだけ。
      if ((known.contentRevision || 1) !== rev) {
        state.cards[v.id] = engine.applyContentRevision(known, rev);
        revised += 1;
      }
      continue;
    }
    state.cards[v.id] = newCard({
      id: v.id, promptKey: v.ja, answerKey: v.mn,
      skillTags: v.id.startsWith('s_') ? ['fluency', 'vocab'] : ['vocab'],
      grammarTags: v.grammarTags || [], scenarioTags: v.themes || [],
      introducedDay: v.introducedDay, reviewStatus: v.status, contentRevision: rev,
    });
    added += 1;
  }
  if (added || revised) storage.save(state);
  return { added, skipped, revised };
}

function curriculumDay(n) {
  if (!curriculum || n == null) return null;
  return curriculum.days.find(d => d.day === n) || null;
}

const TOTAL_DAYS = 90;

// ---------- DOM ヘルパ。innerHTML を使わない ----------
function el(tag, opts = {}, children = []) {
  const n = document.createElement(tag);
  if (opts.class) n.className = opts.class;
  if (opts.text != null) n.textContent = String(opts.text);
  if (opts.attrs) for (const [k, v] of Object.entries(opts.attrs)) n.setAttribute(k, String(v));
  if (opts.on) for (const [k, v] of Object.entries(opts.on)) n.addEventListener(k, v);
  for (const c of children) if (c) n.appendChild(c);
  return n;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function $(id) { return document.getElementById(id); }

function boot() {

/**
 * 起動時の知らせ。**開発者向けの言葉は1つも出さない。**
 *
 * ただし**学習記録が失われた可能性がある場合はぼかさない。**
 * 「読み込めませんでした」だけで済ませると、記録が残っていると思ったまま
 * 使い続けることになる。何が起きたかを書き、報告の場所へ案内する。
 */
function noticeFor(loaded) {
  switch (loaded.status) {
    case 'recovered_from_backup':
      return '学習記録が壊れていたため、直前の控えから戻しました。'
        + '直近の数問ぶんが入っていないことがあります。';
    case 'corrupt_reset':
    case 'invalid_reset':
    case 'migration_failed':
      return 'これまでの学習記録を読み込めませんでした。記録は失われています。'
        + '新しく始めますが、「その他」→「このアプリについて」から不具合を報告してください。';
    // 形式の更新に成功した場合は、記録は1件も失われていない。
    // 内部の版数を見せても社長にできることは無いので、何も出さない
    case 'migrated': return null;
    default: return null;
  }
}

function showNotice(text) {

/**
 * 日付をまたいだ途中セッションを、安全に終わらせる。

 * 昨日の途中から今日を続けてはいけない。今日の出題は今日の復習期日で
 * 組み直す必要があり、昨日の並びをそのまま出すと期日を無視することになる。
 * **解答済みの記録 (events / cards) は既に保存済みなので、ここで消えるのは
 * 「どこまで出したか」の途中経過だけ。** 学習の成果は失われない。

function dropStaleSession() {
  const s = state.session;
  if (s && s.day !== today.today) {

    storage.save(state);

}

// ---------- ホーム ----------
/**
 * ホーム。**開いて「何を押せばいいか」を考えさせない。**
 *
 * 上に3つ (名前 / 連続日数 / Day) → 今日の目標 → 90日の道すじ →

 * 統計・設定・説明はすべて「その他」の中。
 */
function renderHome() {

/** 上部の3つ。数字を増やさない。点数・順位・通貨・残機は作らない。 */
function renderTopBar() {
  $('day-label').textContent =
    today.state === 'before_start' ? '開始前' :

    chip.appendChild(el('span', { text: `連続 ${st.count}日` }));

/**
 * 間が空いたときの一言。**責めない。**
 *
 * 「昨日やっていません」と言われて再開したくなる人はいない。
 * 続けられなかった事実は連続日数がすでに表しているので、
 * ここでは戻ってきたことだけを受け止めて、いちばん軽い入口を出す。
 * **連続日数の値そのものには手を触れない。**
 */
function renderWelcome() {
  const box = $('welcome-box');
  const last = lastStudyDay();
  const gap = last ? daysBetweenIso(last, today.today) : null;
  // 前回から2日以上あいた日の、まだ何もしていないときだけ
  if (today.state === 'before_start' || !last || gap < 2 || dailyProgress() > 0) {
    box.hidden = true; return;
  }
  $('welcome-t').textContent = 'おかえりなさい';
  $('welcome-n').textContent = '今日は5問から。少しでも進めば十分です。';
  box.hidden = false;
}

/** 最後に学習した暦日。 */
function lastStudyDay() {
  const ev = state.events || [];
  for (let i = ev.length - 1; i >= 0; i--) {
    if (ev[i] && ev[i].at) return localDayOf(ev[i].at);
  }
  return null;
}
/** 暦日の差。日付の計算は engine が持つものを使う (UI が期日を計算しない)。 */
function daysBetweenIso(a, b) {
  let n = 0;
  while (n < 400 && engine.shiftDays(a, n) < b) n += 1;
  return n;
}

/**
 * 今日のミッション。**新しいモンゴル語は作らない。**
 * 今日の出題がどの場面に一番当たっているかを engine が数え、
 * 言語パックが持っている言い方をそのまま出すだけ。
 */
let missionCache = null;
function currentMission(plan) {
  if (!plan || !plan.split || !plan.steps) return null;
  if (missionCache && missionCache.day === today.today) return missionCache.mission;
  const m = engine.missionFor({
    steps: plan.steps,
    practiced: engine.practicedIds({ events: state.events || [], cards: state.cards }),
  });
  missionCache = { day: today.today, mission: m };
  return m;
}

function renderMission(plan) {
  const box = $('mission-box');
  const m = currentMission(plan);
  if (!m || plan.remaining === 0) { box.hidden = true; return; }
  $('mission-t').textContent = m.title;
  box.hidden = false;
}

/**
 * 今日どこまで進んだか。**画面に出したものは全部数える。**
 *
 * 「覚える」の手順も1つと数える。判定した数だけを数えると、新しい語ばかりの日に
 * 「5つやったのに0問」と出て、実感と合わない。
 * 保存する項目を1つ足すだけで、既存の保存形式は変えていない。
 */
function dailyProgress() {
  const d = state.dailyProgress;
  if (!d || d.day !== today.today) return 0;
  return d.steps || 0;
}
function bumpDailyProgress() {
  const d = state.dailyProgress;
  state.dailyProgress = (d && d.day === today.today)
    ? { day: d.day, steps: (d.steps || 0) + 1 }
    : { day: today.today, steps: 1 };
}

/**
 * 今日の目標。**連続学習日(🔥)とは別の基準。**
 *
 * 目標はミニレッスン1つぶん(5問)。連続学習日は engine/streak.js が
 * **別の、より重い条件**で判定していて、そちらの意味は変えていない。
 * 同じものとして見せると「目標を達成したのに連続日数が増えない」理由が
 * 説明できなくなるので、足りないぶんはそのまま書く。
 */
function renderGoal(plan) {
  const box = $('goal-box');
  if (today.state === 'before_start') { box.hidden = true; return; }
  const steps = dailyProgress();
  const met = engine.goalMet(steps);
  box.className = met ? 'goal met' : 'goal';
  const remaining = plan ? plan.remaining : 0;
  $('goal-t').textContent = met ? '✓ 今日の目標を達成' : '今日';
  const need = engine.streakMinAnswers - answeredOnDay(today.today);
  // 今日どこまで来たか。目標(5問)ではなく、今日の全体に対して出す
  $('goal-n').textContent = `${steps} / ${steps + remaining} 問`;
  box.hidden = false;
}

/**
 * 90日の道すじ。**前後数日だけ**を出し、今日を一番大きくする。
 * 教材があるのは Day1〜14 だけなので、それ以降は「準備中」と書く。
 * 出来ていないものを、出来ているように見せない。
 */
const PATH_BEFORE = 2;
const PATH_AFTER = 2;
/** 教材が入っている最後の日。ここから先は準備中。 */
const CONTENT_LAST_DAY = 14;

function renderPath() {
  const root = $('path');
  clear(root);
  $('path-h').hidden = today.day == null;
  if (today.day == null) return;

  const from = Math.max(1, today.day - PATH_BEFORE);
  const to = Math.min(TOTAL_DAYS, today.day + PATH_AFTER);
  for (let d = from; d <= to; d++) {
    const cd = curriculumDay(d);
    const isToday = d === today.day;
    const past = d < today.day;
    const soon = d > CONTENT_LAST_DAY;
    const cls = ['node', isToday ? 'node-today' : past ? 'node-done' : 'node-todo',
      (!isToday && soon) ? 'node-soon' : ''].filter(Boolean).join(' ');

    root.appendChild(el('div', { class: cls }, [
      el('div', { class: 'node-line' }),
      el('div', { class: 'node-mark', text: past ? '✓' : String(d) }),
      el('div', { class: 'node-body' }, [
        el('div', { class: 'node-d', text: isToday ? `Day ${d} ・ 今日` : `Day ${d}` }),
        el('div', { class: 'node-t',
          text: soon ? '準備中' : (cd && cd.theme) ? cd.theme : '' }),
      ]),
    ]));
  }
}

/**
 * 今日を5問ずつに分けた一覧。
 * **出題の中身は1つも変えていない。**engine が組んだ手順を、engine が切っただけ。
 */
function renderLessons(plan) {
  const root = $('lessons');
  clear(root);
  if (today.state === 'before_start') return;

  // 今日の分を終えた日は、空欄にせず終わったことを出す。
  // 何も無い画面は「壊れている」ように見える
  if (!plan.split || !plan.split.total) {
    if (dailyProgress() > 0) {
      root.appendChild(el('div', { class: 'lesson lesson-done' }, [
        el('span', { class: 'lesson-mark', text: '✓' }),
        el('span', { class: 'lesson-t', text: '今日の分は完了' }),
        el('span', { class: 'lesson-sub', text: `${dailyProgress()}問` }),
      ]));
    }
    return;
  }

  // 全部並べるとホームが縦に長くなり、いちばん大事な開始ボタンが遠くなる。
  // 済んだもの・いまのもの・次の2つ までを出し、残りは1行にまとめる
  const all = plan.split.lessons;
  const cur = Math.max(0, all.findIndex(l => l.state === 'current'));
  const from = Math.max(0, Math.min(cur - 1, all.length - LESSONS_SHOWN));
  const shown = all.slice(from, from + LESSONS_SHOWN);

  for (const l of shown) {
    const cls = 'lesson ' + (l.state === 'done' ? 'lesson-done'
      : l.state === 'current' ? 'lesson-now' : 'lesson-todo');
    root.appendChild(el('div', { class: cls }, [
      el('span', { class: 'lesson-mark',
        text: l.state === 'done' ? '●' : l.state === 'current' ? '▶' : '○' }),
      el('span', { class: 'lesson-t', text: `レッスン ${l.index + 1}` }),
      el('span', { class: 'lesson-sub',
        text: l.state === 'done' ? '完了'
          : l.state === 'current' ? `${l.doneInLesson} / ${l.size}`
          : `${l.size}問` }),
    ]));
  }
  const hidden = all.slice(from + shown.length);
  if (hidden.length) {
    // 数えるのは隠したレッスンぶんだけ。今日の残り全体を出すと開始ボタンと重複する
    const n = hidden.reduce((sum, l) => sum + l.size, 0);
    root.appendChild(el('div', { class: 'lesson lesson-todo lesson-more' }, [
      el('span', { class: 'lesson-mark', text: '⋯' }),
      el('span', { class: 'lesson-t', text: `ほか ${hidden.length} レッスン` }),
      el('span', { class: 'lesson-sub', text: `${n}問` }),
    ]));
  }
}

/** ホームに並べるレッスンの数。増やすほど開始ボタンが遠くなる。 */
const LESSONS_SHOWN = 4;

/** 下の大きなボタン。開いてから学習開始まで2タップ以内にする。 */
function renderHomeDock(plan) {
  const start = $('start-btn');
  start.disabled = today.state === 'before_start' || plan.remaining === 0;
  start.textContent =
    today.state === 'before_start' ? `${state.settings.startDayIso} から開始`
    : plan.remaining === 0 ? '今日の分は終わりました'
    // 途中でやめた日は、そのレッスンが終わるまでの数を出す。
    // 「あと3問」なら戻ってこられる
    : plan.inLesson > 0 && plan.inLesson < engine.lessonSize ? `続きから ${plan.inLesson}問`
    : `5問だけ進める（残り ${plan.remaining}問）`;
}

/** 今日の復習対象の数。練習の一覧に出す。 */
function dueOrRelearnCount() {
  if (today.day == null) return 0;
  const cards = Object.values(state.cards);
  const nowIso = new Date().toISOString();
  return engine.dueCards(cards, today.today).length
       + engine.relearnCards(cards, nowIso, today.today).length;
}

/**
 * 今日の見込み。**ホームの数字と、実際に出る問題数を必ず一致させる。**
 *
 * 数えるのは手順(steps)であって出題キューではない。はじめての語は
 * 「覚える」と「思い出す」の2手順になるため、キューの長さとは一致しない。
 * 5問ずつの切り分けも engine に任せ、画面側で数え直さない。
 */
let planCache = null;
function todayPlan() {
  const empty = { remaining: 0, minutes: null, resumed: false, steps: null, split: null, inLesson: 0, index: 0, total: 0 };
  if (today.state === 'before_start') return empty;

  const resume = resumableSession();
  if (resume) {
    const rest = restSteps(resume);
    const total = (resume.cardIds || []).length;
    return {
      remaining: rest.length,
      minutes: rest.length ? engine.estimateMinutes(rest) : null,
      resumed: true,
      steps: resume.cardIds.map(id => ({ cardId: id })),
      split: engine.splitLessons(resume.cardIds.map(id => ({ cardId: id })), resume.index),
      inLesson: engine.remainingInLesson(resume.index, total),
      index: resume.index, total,
    };
  }
  if (!planCache || planCache.day !== today.today) {
    planCache = { day: today.today, plan: planFor(defaultModeId()) };
  }
  const plan = planCache.plan;
  if (!plan || !plan.ok) return empty;
  return {
    remaining: plan.steps.length, minutes: plan.estimatedMinutes, resumed: false,
    steps: plan.steps,
    split: engine.splitLessons(plan.steps, 0),
    inLesson: 0, index: 0, total: plan.steps.length,
  };
}

/** 途中セッションの、まだ出していない手順。 */
function restSteps(resume) {
  return (resume.cardIds || []).slice(resume.index).map((id, i) => ({
    cardId: id,
    exercise: (resume.exercises || [])[resume.index + i] || 'recall',
  }));
}

/** 既定の学習モード。プロファイルの先頭で、画面操作ができるもの。 */
function defaultModeId() {
  const ids = engine.profile.availableModes.filter(id => MODES[id].screenInteraction !== 'none');
  return ids.includes('study20') ? 'study20' : ids[0];
}

/**
 * 学習状況。**数え上げられる事実だけ。**
 * 「覚えた」の数え方は engine が決める (何度か出していて、覚え具合が高いもの)。
 * 1回正解しただけのものを「覚えた」に入れると、実態より多く見える。

/**
 * 直近7日。「続いている」が一目で分かればよいので、大きな暦は作らない。
 * ✓ が付くのは、その日に1問でも解いた日。
 */
function renderWeek(root) {
  const days = [];
  for (let i = 6; i >= 0; i--) days.push(engine.shiftDays(today.today, -i));
  const answered = new Set();
  for (const e of state.events || []) {
    if (e && e.at) answered.add(localDayOf(e.at));
  }
  const LABEL = ['日', '月', '火', '水', '木', '金', '土'];

  const row = el('div', { class: 'week' });
  for (const d of days) {
    const on = answered.has(d);
    const isToday = d === today.today;
    const wd = LABEL[new Date(d + 'T00:00:00Z').getUTCDay()];
    row.appendChild(el('div', {
      class: 'wd' + (on ? ' wd-on' : '') + (isToday ? ' wd-today' : ''),
      attrs: { 'aria-label': `${d} ${on ? '学習した' : '学習していない'}` },
    }, [
      el('div', { class: 'wd-l', text: wd }),
      el('div', { class: 'wd-m', text: on ? '✓' : '・' }),
    ]));
  }
  root.appendChild(row);
}

/**
 * 「できること」。**点数の代わりに、現実で何ができるかを出す。**
 *
 * ✓ が付くのは**練習した範囲**を表すだけで、「習得した」「話せる」ではない。
 * 条件は engine が持つ (何件正解したか / 分類の何割か)。
 * 実際に通じるかどうかは、実使用の記録でしか分からない。
 */
/**
 * 実使用の記録の件数を、場面ごとに数える。
 *
 * **「練習した範囲」とは意味が違う**ので、同じ数字に混ぜない。
 * ここに出るのは「その場面・その相手には意図が伝わった」という記録の回数だけで、
 * 表現が正しいことの証拠でも、話せるようになったことの証拠でもない。
 */
function fieldUseByCategory() {
  const of = new Map();
  for (const c of (mnPack.categories || [])) for (const id of c.items) of.set(id, c.id);
  const out = {};
  for (const r of state.fieldReports || []) {
    if (!r || r.spokenOutcome !== 'understood') continue;
    const cid = of.get(r.itemId);
    if (cid) out[cid] = (out[cid] || 0) + 1;
  }
  return out;
}

 * たくさん回すことを条件にすると、こなす量が目的になってしまう。

function renderWeekly(root) {
  const days = new Set();
  for (const e of state.events || []) if (e && e.at) days.add(localDayOf(e.at));
  const use = state.use || {};
  const counters = weekCounters(use);
  const w = engine.weeklyProgress({ todayIso: today.today, studyDays: [...days], counters });

  root.appendChild(el('div', { class: 'grp-h', text: '今週' }));
  const list = el('div', { class: 'wk' });
  for (const g of w.goals) {
    list.appendChild(el('div', { class: g.met ? 'wk-row met' : 'wk-row' }, [
      el('span', { class: 'wk-m', text: g.met ? '✓' : '□' }),
      el('span', { text: g.label }),
      el('span', { class: 'wk-n', text: `${g.done} / ${g.need}` }),

  if (w.allMet) {
    root.appendChild(el('p', { class: 'ph-lead', text: '✓ 今週も継続できました。' }));
  }
}

/** 今週ぶんの利用回数。週の始まりから今日まで。 */
function weekCounters(use) {
  const from = engine.weekStartOf(today.today);
  const days = Object.keys((use && use.days) || {}).filter(d => d >= from && d <= today.today);
  const sum = k => days.reduce((n, d) => n + (use.days[d][k] || 0), 0);
  return { mistakes: sum('practice_mistakes'), briefing: sum('practice_briefing') };
}

/**
 * 記録の書き出し。
 *
 * まず「コピーしました」で終わらせる。**普段は生のデータを見せない。**
 * 見たい人だけが開けるように、詳細はたたんでおく。
 * 実使用の記録の形式 (Field QA へ渡すもの) は今までどおり変えない。
 */
/**
 * 書き出し。**3つに分かれていたものを1画面にまとめた。**
 *
 * 「実際に使った結果」「学習記録の控え」「うまく動かないときの情報」「利用状況」が
 * 別々の画面にあると、何を貼ればよいか毎回考えることになる。
 * 上の切り替えで選び、押すのは「コピー」1つだけにする。
 * **どれも外へは送らない。**画面に出して、社長がコピーして貼るためだけのもの。
 */
let exportMode = 'field';

const EXPORT_TABS = [
  ['field', '実際に使った結果', 'Claude に貼って、通じなかった表現を見直します'],
  ['usage', '使い勝手の記録', 'この版が使いやすかったかを見直す数字。学習内容は入りません'],
  ['bug', 'うまく動かないとき', '端末と画面の情報だけ。学習内容は入りません'],
  ['all', '控え（バックアップ）', '端末を替えるときや、念のため控えを取るとき'],
];

function exportPayload() {
  if (exportMode === 'field') {
    return JSON.stringify({
      _format: 'lang90/field-reports',
      _exportedAt: new Date().toISOString(),
      profileId: state.profileId || null,
      reports: state.fieldReports || [],
    }, null, 2);
  }
  if (exportMode === 'usage') {
    return JSON.stringify({
      _format: 'lang90/usage',
      _exportedAt: new Date().toISOString(),
      summary: engine.useSummary(state.use),
      dayFeedback: state.dayFeedback || {},
    }, null, 2);
  }
  if (exportMode === 'bug') return diagnosticsText();
  return storage.exportState(state);
}

function renderExport(root) {
  const n = (state.fieldReports || []).length;
  const box = el('div', { class: 'copybox' });

  const tabs = el('div', { class: 'export-tabs' });
  for (const [mode, label] of EXPORT_TABS) {
    tabs.appendChild(el('button', {
      class: 'ex-tab', attrs: { type: 'button', 'aria-pressed': String(exportMode === mode) },
      text: mode === 'field' && n ? `${label}（${n}）` : label,
      on: { click: () => { exportMode = mode; openSheet('export'); } },
    }));
  }
  box.appendChild(tabs);

  const lead = (EXPORT_TABS.find(t => t[0] === exportMode) || [])[2] || '';
  box.appendChild(el('p', { class: 'copy-lead', text: lead }));

  const done = el('div', { class: 'copy-done' });
  done.hidden = true;
  const text = el('textarea', { attrs: { id: 'export-text', readonly: 'readonly', rows: '10', spellcheck: 'false' } });
  text.value = exportPayload();

  // この画面の用件はコピー1つ。**下の「もどる」より強く見せる**
  box.appendChild(el('button', {
    class: 'primary copy-btn', attrs: { type: 'button' }, text: 'コピー',
    on: { click: async () => {
      const ok = await copyText(text);
      done.hidden = false;
      done.textContent = ok ? 'コピーしました。Claude のチャットに貼ってください'
        : '下の「データを見る」を開き、枠を長押しして「すべてを選択」→「コピー」してください';
    } },
  }));
  box.appendChild(done);

  const details = el('details', { class: 'copy-detail' });
  details.appendChild(el('summary', { text: 'データを見る（普段は開かなくて大丈夫です）' }));
  details.appendChild(text);
  box.appendChild(details);
  root.appendChild(box);
}

/** クリップボードへ入れる。効かない端末では false を返し、案内を切り替える。 */
async function copyText(node) {
  try {
    node.focus();
    node.setSelectionRange(0, node.value.length);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(node.value);
      return true;
    }
  } catch (e) { /* 下の案内へ落とす */ }
  return false;
}

  const s = state.session;
  return buildReport({
