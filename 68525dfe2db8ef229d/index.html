    screen: currentScreen,
    sessionPosition: s ? `${s.index} / ${(s.cardIds || []).length}` : '(学習していない)',
    audioAvailable: caps.audio,
    schemaVersion: state.schemaVersion,
    userAgent: navigator.userAgent,
    viewport: `${window.innerWidth}x${window.innerHeight}`,
    standalone: !!(window.navigator.standalone
      || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)),
    counts: `教材${Object.keys(state.cards).length} / 解答${(state.events || []).length}`
      + ` / 保存${Object.keys(favorites()).length} / 実使用${(state.fieldReports || []).length}`,
  });
}


// ---------- 練習 ----------
/**
 * 練習。**その日の予定とは別枠。**
 *
 * 通常の学習を終えていなくても、終えたあとでも開ける。
 * ここでの成績が今日の予定を作り直すことはない。
 */
function renderPractice(root) {
  const cards = Object.values(state.cards);
  const nowIso = new Date().toISOString();
  const m = today.day == null ? { ready: [], waiting: [], nextAt: null }
    : engine.mistakes({ cards, nowIso, learningDayIso: today.today });
  const favCount = Object.keys(favorites()).length;
  const dueNow = dueOrRelearnCount();

  root.appendChild(el('p', { class: 'ph-lead',
    text: '今日の学習とは別に、いつでもできる練習です。' }));

  /**
   * 並び順は**その時の状態で決まる。**
   *
   * 「おすすめ」と書いて順番を作らない。いま実際にできるものを上に出すだけで、
   * できないものは下へ下げ、待機中ならそう書く。engine が「まだ出さない」と
   * 言っているものを、画面の都合で先頭に置いて期待させない。
   */
  const rows = [
    {
      title: '間違えた表現',
      desc: m.ready.length ? '前に言えなかったものを、もう一度'
        : m.waiting.length ? '少し時間を空けてから出します' : 'まだありません',
      badge: m.ready.length ? `${m.ready.length}` : (m.waiting.length ? '待機中' : ''),
      ready: m.ready.length > 0,
      // 復習待ちがあるときは、いつ出せるかを見に行けるので押せるままにする
      enabled: m.ready.length > 0 || m.waiting.length > 0,
      onClick: () => { track('practice_mistakes'); openSheet('mistakes'); },
    },
    {
      title: '5分だけ復習', desc: '期日の来ているものだけ',
      badge: dueNow ? `${dueNow}` : '', ready: dueNow > 0, enabled: dueNow > 0,
      onClick: () => { track('practice_sprint'); startSession('sprint5'); },
    },
  ];
  // いまできるほうを上へ。どちらもできないときは、この2つの順番は変えない
  rows.sort((a, b) => (b.ready ? 1 : 0) - (a.ready ? 1 : 0));

  // ここから下は「いつでも見るもの」。状態で順番を入れ替えない
  rows.push(
    {
      title: '商談の直前に見る', desc: '場面ごとに並べた35表現。日本語で探せます',
      badge: '5分', ready: true, enabled: true,
      onClick: () => { track('practice_briefing'); openSheet('briefing'); },
    },
    {
      title: '保存したフレーズ', desc: '☆ を付けたもの',
      badge: favCount ? `${favCount}` : '', ready: favCount > 0, enabled: favCount > 0,
      onClick: () => { track('practice_favorites'); openSheet('favorites'); },
    },
    {
      title: '組み合わせ', desc: 'ウォームアップ。学習の記録には影響しません',
      badge: '', ready: true, enabled: true,
      onClick: () => { track('practice_match'); startMatch(); },
    },
  );

  const list = el('div', { class: 'practice' });
  for (const r of rows) {
    // **押しても何も起きないボタンを置かない。**
    // 見た目が同じまま反応しないと、壊れているのか自分の押し方が悪いのか分からない
    const attrs = { type: 'button' };
    if (!r.enabled) attrs.disabled = 'disabled';
    list.appendChild(el('button', {
      class: r.ready ? 'pr' : 'pr pr-wait',
      attrs, on: r.enabled ? { click: r.onClick } : {},
    }, [
      el('span', {}, [
        el('span', { class: 'pr-t', text: r.title }),
        el('span', { class: 'pr-d', text: r.desc }),
      ]),
      r.badge ? el('span', { class: 'pr-n', text: r.badge }) : null,
    ]));
  }
  root.appendChild(list);
}

/**
 * 間違えた表現。**再出題の時刻を破らない。**
 *
 * 直前に間違えたカードには engine が「次に出してよい時刻」を入れている。
 * その前に出し直すと、忘れかけた頃に思い出す、という前提が崩れる。
 * 待つべきものは、待つと書いて出さない。
 */
function renderMistakes(root) {
  const cards = Object.values(state.cards);
  const nowIso = new Date().toISOString();
  const m = today.day == null ? { ready: [], waiting: [], nextAt: null }
    : engine.mistakes({ cards, nowIso, learningDayIso: today.today });

  if (!m.ready.length) {
    root.appendChild(el('p', { class: 'fr-empty',
      text: m.waiting.length
        ? `いま出せるものはありません。${m.waiting.length}件が復習待ちです。`
          + '少し時間を空けてから出すほうが記憶に残るため、すぐには出しません。'
        : 'まだ間違えた表現がありません。' }));
    if (m.nextAt) {
      root.appendChild(el('p', { class: 'ph-lead',
        text: `次に復習できるのは ${formatTime(m.nextAt)} ごろです。` }));
    }
    return;
  }

  root.appendChild(el('p', { class: 'ph-lead',
    text: `前に言えなかった ${m.ready.length}件です。`
      + (m.waiting.length ? `（ほかに ${m.waiting.length}件が復習待ちです）` : '') }));

  const list = el('div', { class: 'practice' });
  list.appendChild(el('button', { class: 'pr', attrs: { type: 'button' },
    on: { click: () => startMistakeSession(m.ready) } }, [
    el('span', {}, [
      el('span', { class: 'pr-t', text: 'まとめて復習する' }),
      el('span', { class: 'pr-d', text: '日本語 → モンゴル語。通常の学習と同じ判定です' }),
    ]),
    el('span', { class: 'pr-n', text: String(m.ready.length) }),
  ]));
  root.appendChild(list);

  // 何が入っているかを先に見せる。押す前に中身が分かるようにする
  for (const c of m.ready.slice(0, 20)) {
    root.appendChild(el('div', { class: 'ph-item' }, [
      el('div', { class: 'ph-txt' }, [
        el('div', { class: 'ph-ja', text: c.promptKey }),
        el('div', { class: 'ph-mn', text: c.answerKey }),
      ]),
    ]));
  }
}

function formatTime(iso) {
  const d = new Date(iso);
  const tz = state.settings.timeZone || 'Asia/Tokyo';
  try {
    return new Intl.DateTimeFormat('ja-JP', { hour: '2-digit', minute: '2-digit', timeZone: tz }).format(d);
  } catch (e) { return iso.slice(11, 16); }
}

/**
 * 間違えた表現をまとめて復習する。
 * 通常の学習と同じ判定・同じ記録の付き方にする(別扱いにすると成績が二重になる)。
 */
function startMistakeSession(ready) {
  if (!ready.length) return;
  queue = ready.map(c => ({ cardId: c.id, source: 'review', exercise: 'recall', graded: true }));
  qIndex = 0;
  sessionStats = { answered: 0, correct: 0, wrong: 0, relearn: 0 };
  sessionKind = 'practice';   // 今日の予定とは別枠。途中経過を保存しない
  lessonEnd = queue.length;
  showScreen('session');
  nextItem();
}

// ---------- 組み合わせ練習 ----------
/**
 * 日本語とモンゴル語を合わせる練習。
 *
 * **これは「見て分かる」練習で、「自分で言える」練習ではない。**
 * 産出より明らかに簡単なので、覚え具合も次回の出題日も動かさない。
 * ここで全部合っても「言えるようになった」ことにはならないため。
 * 出すのは既にある教材の正しい組だけで、新しい対応づけは作らない。
 */
let matchState = null;

function startMatch() {
  const cards = Object.values(state.cards).filter(c => (c.reps || 0) > 0);
  const pool = cards.length >= 5 ? cards : Object.values(state.cards);
  const round = engine.matchRound({ cards: pool, size: 5 });
  if (!round) { showNotice('組み合わせに使える表現がまだありません'); return; }
  matchState = { round, picked: null, solved: new Set(), tries: 0 };
  renderMatch();
}

/**
 * 画面を組み立てる。**押すたびに全部作り直さない。**
 * 作り直すと押した感触が途切れ、読み上げの位置も失われる。
 * 変わったボタンの見た目だけを書き換える。
 */
function renderMatch() {
  const { round } = matchState;
  $('match-lead').textContent = '同じ意味どうしを選んでください。'
    + 'この練習は覚え具合には影響しません（見て分かるのと、自分で言えるのは別のため）。';
  const grid = $('match-grid');
  clear(grid);
  matchState.buttons = [];

  // 2列なので、左→右→左→右 の順に入れる
  for (let i = 0; i < round.left.length; i++) {
    for (const [side, it] of [['left', round.left[i]], ['right', round.right[i]]]) {
      const btn = el('button', {
        text: it.text,
        attrs: { type: 'button', 'aria-pressed': 'false' },
        on: { click: () => pickMatch(side, it.id) },
      });
      matchState.buttons.push({ side, id: it.id, node: btn });
      grid.appendChild(btn);
    }
  }
  paintMatch();
  showScreen('match');
}

/** 見た目だけを今の状態に合わせる。 */
function paintMatch() {
  const { solved, picked, buttons, round } = matchState;
  for (const b of buttons) {
    const done = solved.has(b.id);
    const on = !!picked && picked.side === b.side && picked.id === b.id;
    b.node.className = done ? 'm-hit' : '';
    b.node.setAttribute('aria-pressed', String(on));
    if (done) b.node.setAttribute('disabled', 'disabled');
    else b.node.removeAttribute('disabled');
  }
  $('match-n').textContent = `${solved.size} / ${round.pairs.length} 組`;
  $('match-again').hidden = solved.size < round.pairs.length;
}

function pickMatch(side, id) {
  const st = matchState;
  if (!st || st.solved.has(id)) return;
  // 同じ側をもう一度押したら選び直し
  if (!st.picked || st.picked.side === side) { st.picked = { side, id }; return paintMatch(); }

  st.tries += 1;
  const hit = engine.matchIsCorrect(st.round, st.picked.id, id);
  st.picked = null;
  if (hit) {
    st.solved.add(id);
    paintMatch();
    // **記録は付けない。**覚え具合・次回の出題日・教材の状態を1つも動かさない
  } else {
    paintMatch();
    flashMiss();
  }
}

function flashMiss() {
  const box = $('tap-ack');
  clear(box);
  box.className = 'ng';
  box.appendChild(el('span', { class: 'ack-mark', text: '↻' }));
  box.appendChild(el('span', { text: 'ちがいます' }));
  box.hidden = false;
  if (ackTimer) clearTimeout(ackTimer);
  ackTimer = setTimeout(() => { ackTimer = null; box.hidden = true; }, ACK_MS);
}

// ---------- セッション ----------
/**
 * その日の出題を組む。ホームの問題数表示と実際の出題で同じ経路を通す。
 * **学習ロジックは engine が決める。**ここは呼び出すだけ。
 */
function planFor(modeId) {
  const cards = Object.values(state.cards);
  const fresh = engine.freshCandidates(cards);   // 何が「新規」かも engine が決める
  const cd = curriculumDay(today.day);
  const base = {
    modeId, cards, events: state.events || [], freshCards: fresh,
    learningDayIso: today.today, nowIso: new Date().toISOString(), day: today.day,
    // **聞き取り問題に使ってよいか。**単に鳴らせるかとは別。
    // モンゴル語の声が無い端末では、別の言語の声で読み上げることになるので、
    // 参考として聞くのは許すが、聞き取りの正解には使わない
    audioAvailable: caps.listening,
    hasAudio: id => caps.listeningFor(id),
    // 「その日すでに出した新規語」を数えるための暦日の決め方。
    // 時間帯の扱いはアプリ側の責務なので、engine には関数として渡す
    dayOf: localDayOf,
  };
  let plan = engine.planSession({ ...base, plannedNewVocab: cd ? cd.vocab.newCount : undefined });

  // カリキュラムの予定どおりだと1問も出ない日がある。Day1〜3 は文字の練習期間で
  // 新規語彙の予定が0語だが、**その文字の練習教材がこの版に入っていない**。
  // 予定を守ると初日に何もできず、学習が始まらない。
  // 試験日 (milestone) は別で、そこは意図的に新規を入れないので前倒ししない。
  if (plan.ok && plan.steps.length === 0 && cd && !cd.milestone) {
    const fallback = engine.planSession({ ...base, plannedNewVocab: undefined });
    if (fallback.ok && fallback.steps.length > 0) return { ...fallback, advanced: true };
  }
  return plan;
}

/**
 * 途中で閉じたセッションの続き。
 *
 * 保存するのは「その日にどのカードを、どこまで出したか」だけ。
 * 学習の結果 (カードの状態・出題記録) は解答のたびに engine が保存済みなので、
 * ここが消えても記録は失われない。**既存の保存形式は壊さない**ため、
 * 無い場合は単に「続きは無い」として扱う。
 */
function resumableSession() {
  const s = state.session;
  if (!s || s.day !== today.today) return null;              // 日付をまたいだら続けない
  if (!Array.isArray(s.cardIds) || s.index >= s.cardIds.length) return null;
  if (!s.cardIds.every(id => state.cards[id])) return null;
  return s;
}

function saveSession() {
  state.session = queue.length ? {
    day: today.today,
    cardIds: queue.map(q => q.cardId),
    sources: queue.map(q => q.source),
    // 出題形式も一緒に残す。無い古い記録は「思い出す」として読み直す
    exercises: queue.map(q => q.exercise),
    index: qIndex,
    stats: sessionStats,
  } : null;
}

function clearSession() { state.session = null; }

/**
 * 学習を始める / 続ける。
 *
 * **1回は5問で切り上げられる。** その日の出題そのものは engine が組んだ
 * 1本のままで、どこまでを1回とみなすかだけを変えている。
 * 「30問やらないと終われない」と感じさせないための切り方で、
 * 出題の順番・SRS・1日の新規語の上限には一切触っていない。
 */
function startSession(modeId) {
  if (today.state === 'before_start') return;
  sessionKind = 'daily';

  // 続きがあれば、そこから再開する。**解答済みの問題はもう出さない**
  // (index から先だけを出すので、同じ問題が二重に記録されることはない)
  const resume = !modeId ? resumableSession() : null;
  if (resume) {
    queue = resume.cardIds.map((id, i) => {
      const ex = (resume.exercises || [])[i] || 'recall';
      return {
        cardId: id, source: (resume.sources || [])[i] || 'review',
        exercise: ex, graded: engine.gradedExercises.includes(ex),
      };
    });
    qIndex = resume.index;
    sessionStats = resume.stats || { answered: 0, correct: 0, wrong: 0, relearn: 0 };
    beginLesson();
    storage.save(state);
    showScreen('session');
    return nextItem();
  }

  const plan = planFor(modeId || defaultModeId());
  if (!plan.ok) { showNotice('いまの設定では、この練習を始められません'); return; }
  if (!plan.steps.length) { showNotice('いま出せる問題がありません'); return; }

  // 出題形式まで engine が決めたものをそのまま使う
  queue = plan.steps;
  qIndex = 0;
  sessionStats = { answered: 0, correct: 0, wrong: 0, relearn: 0 };
  // 5分だけ復習は、それ自体が1回分なので途中で切らない
  sessionKind = modeId === 'sprint5' ? 'practice' : 'daily';
  beginLesson();
  if (sessionKind === 'daily') { saveSession(); }
  storage.save(state);
  showScreen('session');
  nextItem();
}

/** いまのミニレッスンの区切りを決める。切り方の計算は engine が持つ。 */
function beginLesson() {
  lessonStats = { steps: 0, answered: 0, correct: 0, wrong: 0, introduced: 0 };
  lessonStart = qIndex;
  sawRecallLabel = false;
  sessionStartedAt = Date.now();
  // 「始めた回数」と「終えた回数」はレッスン単位で数える。
  // セッション単位で数えると、1回の中で6レッスン終えたときに率が600%になる
  track('lesson_start');
  lessonEnd = sessionKind === 'daily'
    ? engine.endOfLesson(qIndex, queue.length)
    : queue.length;
}

function currentCard() {
  const item = queue[qIndex];
  return item ? state.cards[item.cardId] : null;
}

/**
 * 1問を出す。出題形式は engine が決めたものに従う。
 *
 *   introduce  はじめての語。母語と目標言語を最初から見せる。**採点しない。**
 *   recall     日本語を見て、モンゴル語を自分で言う
 *   listening  音を聞いて、意味を思い出す（音声が入るまで1問も出ない）
 */
function nextItem() {
  audio.stop();        // 前の問題の音を必ず止める（音声が無い版では何も起きない）
  markPlaying(false);
  playedThisItem = 0;  // 「もう一度聞いた」は、その問題の中での2回目から
  hideAck();
  busy = false;

  if (qIndex >= queue.length) return endSession();
  // ミニレッスンの区切り。ここでいったん切り上げ、続けるかを選んでもらう
  if (qIndex >= lessonEnd) return endLesson();
  const item = queue[qIndex];
  const card = state.cards[item.cardId];
  if (!card) { qIndex += 1; return nextItem(); }

  const ex = item.exercise || 'recall';
  const listening = ex === 'listening';
  const introduce = ex === 'introduce';
  const hasAudio = caps.audioFor(card.id);

  revealed = false;
  $('field-row').hidden = true;
  // はじめて見る語には「実際の会話で使った」を出さない。まだ使いようがない
  $('field-open').hidden = introduce;

  // 「覚える」には毎回ラベルを出す (答えが最初から見えている理由になる)。
  // 「思い出す」はその回の1問目にだけ出す。毎問出すと、
  // 思い出すことに使うはずの視線を1つ余分に奪う
  const lead = $('step-label');
  if (introduce) { lead.textContent = '覚える'; lead.hidden = false; sawRecallLabel = false; }
  else if (!sawRecallLabel) { lead.textContent = '思い出す'; lead.hidden = false; sawRecallLabel = true; }
  else lead.hidden = true;

  // 聞き取りのときだけ、日本語を伏せて音を主役にする
  $('listen-prompt').hidden = !listening;
  $('prompt').hidden = listening;
  $('prompt').textContent = listening ? '' : card.promptKey;

  // 教材文字列は textContent で入れる。連結もテンプレートも使わない
  $('answer').textContent = card.answerKey;
  $('answer-ja').textContent = listening ? card.promptKey : '';
  $('answer-ja').hidden = !listening;

  // 音声が使えない版では、音に関するものを一切出さない。
  // 押す場所は1つだけ。ボタン自身が「参考音声（合成）」と名乗る
  $('speak-btn').hidden = !hasAudio;
  $('speak-label').textContent = caps.audioLabel;

  renderFav(card);

  // introduce は最初から答えを見せる。判定はしない。
  // **枠は常に置いたまま**にして、答えが出ても問題文が動かないようにする
  $('answer-box').hidden = false;
  $('answer-box').classList.toggle('veiled', !introduce);
  $('reveal-btn').hidden = introduce;
  $('next-btn').hidden = !introduce;
  $('judge-row').hidden = true;
  if (introduce) {
    revealed = true;
    // 答えが最初から見えている形式なので、鳴らしても答えを教えることにならない
    if (hasAudio) playCurrent();
  } else if (listening) {
    // 聞き取りは音そのものが問題。ここで鳴らさないと答えようがない
    track('listening_start');
    if (hasAudio) playCurrent();
  }
  // **「思い出す」では、答えを見るまで鳴らさない。**
  // 先に鳴らすと、それが答えを教えてしまう

  renderStepHint();

  $('keyhint').textContent = introduce
    ? 'Space = 次へ' : 'Space = 答え / ← 言えなかった / → 言えた';

  $('progress').textContent = `${qIndex + 1} / ${queue.length}`;
  $('progress-bar').style.width = `${(qIndex / queue.length) * 100}%`;

  // T2: 表示時刻を実測する
  shownAt = performance.now();
  // P1: ホームで押してから1問目が出るまでを1回だけ実測する
  trackFirstPaint();
}

/**
 * 5問の中の位置を、短く一言で出す。
 *
 * **常に煽らない。**残りが1〜2問になったときだけ少し強める。
 * ずっと「あと◯問！」と出していると、ただの背景になって効かなくなる。
 * 出題の中身は変えていない (engine が決めた順のまま、言い方だけ添える)。
 */
function renderStepHint() {
  const hint = $('step-hint');
  const left = lessonEnd - qIndex;      // このレッスンの残り

  // **終わりが近いときだけ出す。**
  // 毎問なにか書いてあると、それ自体が背景になって読まれなくなるうえ、
  // 思い出すことに使うはずの視線を1つ余分に奪う。
  const text = left === 1 ? '最後の1問' : left === 2 ? 'あと2問' : '';
  hint.textContent = text;
  hint.hidden = !text;
  hint.className = 'step-hint near';
}

/**
 * 答えを見せる。
 *
 * 参考音声があれば、このタップの中で鳴らす。答えを見た直後に音を聞き、
 * もう一度声に出してから判定する、という流れにするため。
 * 音声が無い版では何も起きず、流れだけが同じに保たれる。
 */
function reveal() {
  if (revealed || busy) return;
  revealed = true;
  const card = currentCard();
  $('answer-box').classList.remove('veiled');
  $('reveal-btn').hidden = true;
  $('judge-row').hidden = false;
  // 答えを見た直後に音を聞き、もう一度声に出してから判定する流れにする
  if (card && caps.audioFor(card.id)) playCurrent();
  // 実使用の記録は自動で開かない。「実際の会話で使った」を押したときだけ。
}

/** はじめての語を見せ終えたとき。**採点はしない**（接触しただけなので）。 */
function advanceIntroduce() {
  if (busy) return;
  const item = queue[qIndex];
  if (!item || item.graded) return;
  audio.stop();
  lessonStats.steps += 1;
  lessonStats.introduced += 1;
  bumpDailyProgress();
  qIndex += 1;
  // 保存してから次へ。**画面より先に記録を確定させる**
  if (sessionKind === 'daily') { saveSession(); storage.save(state); }
  // 押したことが分かる印だけ出して、短く次へ。連打はここで止める
  busy = true;
  showLearnAck();
  ackTimer = setTimeout(() => { ackTimer = null; nextItem(); }, ACK_MS_LEARN);
}

/**
 * スピーカー。押せば必ず鳴る。連打しても二重には鳴らない
 * (音を出す要素は1つしかないので、鳴らし直しになるだけ)。
 *
 * 2回目からは「もう一度聞いた」として数える。**遅くする機能は作らない** ――
 * 極端に遅くすると母音が別の音になり、通常の発話と違うものを覚えてしまう。
 * 「遅くする」ではなく「何度でも聞ける」で代える。
 */
let playedThisItem = 0;
function playCurrent() {
  const card = currentCard();
  if (!card) return;
  markPlaying(true);
  playedThisItem += 1;
  track(playedThisItem > 1 ? 'audio_replay' : 'audio_play');
  // **数えたらその場で保存する。**
  // track() は memory を書き換えるだけなので、聞いただけで答えずに閉じると
  // 「何回聞いたか」が丸ごと消える。10日間の観測でいちばん見たい数字なので、
  // ここで確定させる (保存は実測 2〜3ms。押した感じは変わらない)
  storage.save(state);
  audio.play(card.id).then(r => { if (r !== 'played') markPlaying(false); });
}

/**
 * 鳴っている間だけ、押した場所に印を出す。
 *
 * 無音の環境や音量を絞っているときに「押したのに何も起きない」と見えないため。
 * 音そのものが出ているかは画面からは分からないので、
 * **「鳴らそうとしている」ことだけ**を出す。
 */
function markPlaying(on) {
  for (const id of ['speak-btn', 'listen-big']) {
    const b = $(id);
    if (b) b.classList.toggle('is-playing', !!on);
  }
}

// ---------- 押したことが分かる合図 ----------
/**
 * 判定を押したあと、短く合図を出してから自動で次へ進む。
 *
 * 「押したのに何も起きない」状態を無くすためだけのもので、
 * ゲーム的な演出はしない。次に進むための追加のタップも要らない。
 * 再出題の時刻は engine が決める。画面の都合で即座に出し直さない。
 */
const ACK_MS = 420;
// 「覚える」を進めたときは印だけ、短く。まだ見ただけなので言葉は付けない
const ACK_MS_LEARN = 240;
let ackTimer = null;

function showAck(correct) {
  const box = $('tap-ack');
  clear(box);
  box.className = correct ? 'ok' : 'ng';
  box.appendChild(el('span', { class: 'ack-mark', attrs: { 'aria-hidden': 'true' }, text: correct ? '✓' : '↻' }));
  box.appendChild(el('span', { text: correct ? '言えた' : 'あとでもう一度' }));
  box.hidden = false;
}

/**
 * 「覚える」を1つ進めたときの合図。**印だけ。**
 *
 * 「正解」「できた」とは書かない。まだ見ただけで、
 * 言えるかどうかは何も確かめていない。押したことが分かればそれでよい。
 */
function showLearnAck() {
  const box = $('tap-ack');
  clear(box);
  box.className = 'learn';
  box.appendChild(el('span', { class: 'ack-mark', attrs: { 'aria-hidden': 'true' }, text: '✓' }));
  box.hidden = false;
}
function hideAck() {
  if (ackTimer) { clearTimeout(ackTimer); ackTimer = null; }
  $('tap-ack').hidden = true;
}

// ---------- 保存したフレーズ (お気に入り) ----------
/**
 * 覚え具合(SRS)とは**完全に別**の印。星を付けても外しても、
 * 出題の順番・次回の日・mastery は1つも動かない。
 * 商談の直前に見たいものを、社長が自分で選ぶためだけのもの。
 */
function favorites() { return state.favorites || (state.favorites = {}); }
function isFav(id) { return !!favorites()[id]; }
function toggleFav(id) {
  const f = favorites();
  if (f[id]) delete f[id]; else f[id] = { at: new Date().toISOString() };
  storage.save(state);
  return !!f[id];
}
function removeFav(id) {
  delete favorites()[id];
  storage.save(state);
}
function renderFav(card) {
  const b = $('fav-btn');
  const on = isFav(card.id);
  b.setAttribute('aria-pressed', String(on));
  b.textContent = on ? '★ 保存済み' : '☆ 保存';
}

function judge(correct) {
  if (!revealed || busy) return;
  const item = queue[qIndex];
  // 採点しない手順 (はじめての語の接触) では判定を受け付けない
  if (!item || !item.graded) return;
  const card = state.cards[item.cardId];
  // T2: 判定時刻との差を response_ms として engine に渡す
  const responseMs = Math.round(performance.now() - shownAt);
  const nowIso = new Date().toISOString();

  const r = engine.submit(card, {
    correct, responseMs,
    learningDayIso: today.today, nowIso, day: today.day,
    mode: 'session',
    // 出題形式を渡す。覚え具合の計算は形式によらず同じで、記録にだけ残る
    exercise: item.exercise || 'recall',
    remainingDays: clock.remainingDays(today.day, TOTAL_DAYS),
  });

  // UI は next日 / mastery / lapses / grade を一切計算しない。engine の結果をそのまま保存する
  state.cards[card.id] = r.card;
  state.events = state.events || [];
  state.events.push(r.event);

  // 聞き取り問題に答えた回数。**中身は入れず、回数だけ**
  if ((item.exercise || 'recall') === 'listening') track('listening_complete');

  sessionStats.answered += 1;
  if (correct) sessionStats.correct += 1; else sessionStats.wrong += 1;
  if (r.outcome === 'relearn_correct') sessionStats.relearn += 1;

  lessonStats.steps += 1;
  lessonStats.answered += 1;
  if (correct) lessonStats.correct += 1; else lessonStats.wrong += 1;
  bumpDailyProgress();

  qIndex += 1;
  audio.stop();
  // 練習は今日の予定とは別枠なので、途中経過を上書きしない
  if (sessionKind === 'daily') saveSession();
  const saved = storage.save(state);
  if (!saved.ok) showNotice('保存できませんでした。端末の空き容量を確認してください');

  // 合図を出してから自動で次へ。この間は判定を受け付けない(二重記録の防止)
  busy = true;
  showAck(correct);
  ackTimer = setTimeout(() => { ackTimer = null; nextItem(); }, ACK_MS);
}
// ---------- 実使用フィードバック (Field QA) ----------
/**
 * 学習の判定 (言えた/言えなかった) とは別物。
 * こちらは「実際の会話でその表現がどうなったか」だけを記録する。
 *
 * 通じなかったときは、必ず1問だけ追加で聞く:
 * 「同じモンゴル語を画面で相手に見せましたか？」
 *
 * これが要るのは、通じなかった原因が教材にあるとは限らないから。
 * 発音・速度・声量・雑音・相手が聞いていない、のどれでも同じ結果になる。
 * このアプリは発音の採点を行わない (低資源言語では判定が当てにならない) ため、
 * 文字で見せたらどうだったかが、
 * 発話の問題と教材の問題を分ける唯一の手がかりになる。
 *
 * ラベルは表示のためだけにここにある。帰属の判定も状態遷移も engine が持つ。
 * counterpartCorrection は「相手が実際に言い直した表現」の意味でのみ使う。
 */
const SPOKEN_LABELS = {
  understood: '通じた',
  repeated: '聞き返された',
  not_understood: '通じなかった',
  wrong_reaction: '相手の反応が違った',
  corrected: '相手に言い直された',
};

/** 追加の1問。選択肢の言葉は、判定ではなく起きた事実だけを言う。 */
const TEXT_LABELS = {
  understood: 'A. 文字を見せたら通じた',
  not_understood: 'B. 文字を見せても通じなかった',
  corrected: 'C. 相手が別の表現に直した',
  not_shown: 'D. 文字は見せていない',
};
const TEXT_ORDER = ['understood', 'not_understood', 'corrected', 'not_shown'];

/**
 * 「通じた」が意味すること。**この定義を広げてはいけない。**
 *   「その場面・その相手には意図が伝わった」
 * 自然さの保証でも、唯一正しい表現である証拠でも、ネイティブ品質の裏付けでもない。
 */
const UNDERSTOOD_MEANS = 'その場面・その相手には意図が伝わった、という記録です';

function fieldReportsFor(itemId) {
  return (state.fieldReports || []).filter(r => r.itemId === itemId);
}

/**
 * 実使用の記録を1件足す。
 * **教材本体の状態 (reviewStatus) は変えない。** 動くのは fieldStatus だけで、
 * 一時停止 (suspended) へは自動で進まない。
 */
function recordFieldUse(card, spokenOutcome, textCheck, counterpartCorrection) {
  state.fieldReports = state.fieldReports || [];
  const r = engine.recordFieldUse(card, {
    spokenOutcome, textCheck,
    counterpartCorrection: counterpartCorrection || null,
    nowIso: new Date().toISOString(), reports: state.fieldReports,
    context: `day${today.day == null ? '' : today.day}`,
  });
  state.fieldReports.push(r.report);
  state.cards[card.id] = engine.applyFieldStatus(state.cards[card.id], r.fieldStatus);
  const saved = storage.save(state);
  if (!saved.ok) showNotice('保存できませんでした。端末の空き容量を確認してください');
  return r;
}

/** 記録したあとに出す一文。帰属を言葉でも分けて見せる。 */
const RESULT_NOTE = {
  positive: () => UNDERSTOOD_MEANS,
  delivery_suspect: () => '文字では通じたので、教材の問題としては扱いません。話し方の練習に回します',
  content_suspect: () => '文字でも通じなかったので、教材の見直し候補に入れました',
  correction: () => '相手の言い換えを記録しました。そのまま置き換えず、再確認に回します',
  inconclusive: () => '記録しました。次に使うときは、文字を見せた結果も残すと原因が分かります',
};

function fieldButtons(labels, order, cls, onPick) {
  return order.map(key => {
    const b = el('button', {
      text: labels[key], class: cls(key),
      attrs: { type: 'button', 'data-outcome': key, 'aria-pressed': 'false' },
      on: { click: () => onPick(key, b) },
    });
    return b;
  });
}

/** 「実際の会話で使った」を押したときだけ開く。通常の学習は邪魔しない。 */
function openFieldRow() {
  const card = currentCard();
  if (!card) return;
  track('field_open');
  renderFieldRow(card);
  $('field-open').hidden = true;
  $('field-row').scrollIntoView({ block: 'nearest' });
}

/** 記録欄の中身。開いたときだけ組み立てる。 */
function renderFieldRow(card) {
  const row = $('field-row');
  const grid = $('field-buttons');
  const step2 = $('field-step2');
  const textGrid = $('field-text-buttons');
  const corr = $('field-corr');
  const done = $('field-done');
  clear(grid); clear(textGrid);
  step2.hidden = true;
  corr.className = 'field-corr';
  done.hidden = true; done.textContent = '';
  $('field-corr-input').value = '';

  const finish = (spoken, textCheck, correction) => {
    const r = recordFieldUse(card, spoken, textCheck, correction);
    done.hidden = false;
    done.textContent = RESULT_NOTE[r.attribution]();
    step2.hidden = true;
    corr.className = 'field-corr';
  };

  const askTextCheck = (spoken) => {
    clear(textGrid);
    const wide = () => 'fr-wide';
    for (const b of fieldButtons(TEXT_LABELS, TEXT_ORDER, wide, (textCheck) => {
      if (textCheck === 'corrected') {
        corr.className = 'field-corr on';
        $('field-corr-input').focus();
        $('field-corr-save').onclick = () => {
          finish(spoken, 'corrected', $('field-corr-input').value.trim() || null);
        };
        return;
      }
      finish(spoken, textCheck, null);
    })) textGrid.appendChild(b);
    step2.hidden = false;
  };

  const spokenOrder = engine.fieldSpokenOutcomes;
  const cls = k => (k === 'wrong_reaction' || k === 'corrected') ? 'fr-wide' : '';
  for (const b of fieldButtons(SPOKEN_LABELS, spokenOrder, cls, (spoken, btn) => {
    for (const other of grid.children) other.setAttribute('aria-pressed', 'false');
    btn.setAttribute('aria-pressed', 'true');
    // 選び直したときに前の結果表示が残らないようにする
    done.hidden = true; done.textContent = '';
    corr.className = 'field-corr';
    $('field-corr-input').value = '';
    // 「通じた」は1タップで終わり。負の結果のときだけ原因を切り分ける。
    if (engine.fieldNegativeOutcomes.includes(spoken)) askTextCheck(spoken);
    else finish(spoken, 'not_shown', null);
  })) grid.appendChild(b);

  row.hidden = false;
}


/**
 * ミニレッスンの区切り。**まだ今日の分は残っている。**
 *
 * ここで「次の5問」か「今日はここまで」を選べるようにする。
 * 全部やらないと終われない、と感じさせないための区切り。
 */
function endLesson() {
  audio.stop();
  hideAck();
  busy = false;

  const n = lessonNumberOf(qIndex);
  showCheer({
    mark: '✓',
    title: `レッスン ${n} 完了`,
    // 見出しは「この回でやった数」。覚える手順も1つと数える。
    // 判定した数だけを出すと、新しい語ばかりの回で「1問」になって実感と合わない
    count: lessonStats.steps,
    learned: lessonStats.introduced,
    ok: lessonStats.correct,
    ng: lessonStats.wrong,
    note: goalNote(),
    streak: milestoneNote(),
    perfect: perfectLabel(lessonStats),
    progress: { done: qIndex, total: queue.length },
    next: '次の5問',
  });
  track('lesson_complete');
  trackDuration((Date.now() - sessionStartedAt) / 1000);
  if (sessionKind === 'daily') saveSession();
  bumpStreak();
  storage.save(state);
  planCache = null;
}

/** この回で見せた「新しい語」の数。判定していないので、成績とは別に数える。 */
function introducedInSession() {
  return queue.slice(0, qIndex).filter(q => !q.graded).length;
}

/** 何番目のレッスンを終えたか。切り方の計算は engine が持つ。 */
function lessonNumberOf(index) {
  return Math.max(1, Math.ceil(index / engine.lessonSize));
}

/**
 * 目標に対する一言。**連続学習日(🔥)とは条件が違う**ので、
 * 足りないときは何問足りないかをそのまま書く。
 */
function goalNote() {
  const steps = dailyProgress();
  if (!engine.goalMet(steps)) return `今日の目標まで あと ${engine.dailyGoal - steps}問`;
  const need = engine.streakMinAnswers - answeredOnDay(today.today);
  if (need > 0) return `✓ 今日も前進。連続記録がつくまで あと ${need}問`;
  return '✓ 今日も前進';
}

/**
 * 今日の分を全部終えたとき。**ここだけ少し特別にする。**
 * 覚え具合やSRSの内部の値は出さない。
 */
function endSession() {
  audio.stop();
  hideAck();
  busy = false;

  const finished = qIndex >= queue.length;
  if (finished) { track('lesson_complete'); if (sessionKind === 'daily') track('day_complete'); }
  else { track('quit_mid'); trackQuit(qIndex - lessonStart, lessonEnd - lessonStart); }
  trackDuration((Date.now() - sessionStartedAt) / 1000);
  // 1回開いて何問やったか。中身は入れず、数だけ
  trackAnswers(sessionStats.answered + introducedInSession());

  // 最後まで終わったら続きは無い。途中で終了した場合は残しておく
  if (sessionKind === 'daily') {
    if (finished) clearSession(); else saveSession();
  }
  bumpStreak();
  storage.save(state);
  planCache = null;

  if (sessionKind === 'practice') {
    showCheer({
      mark: '✓', title: '練習 完了',
      count: sessionStats.answered, ok: sessionStats.correct, ng: sessionStats.wrong,
      note: goalNote(), streak: null, next: null,
    });
    return;
  }

  const st = engine.displayStreak(state.streak, today.today);
  showCheer({
    mark: finished ? '🎉' : '✓',
    title: finished ? `Day ${today.day} 完了` : '今日はここまで',
    count: sessionStats.answered + introducedInSession(),
    learned: introducedInSession(),
    ok: sessionStats.correct,
    ng: sessionStats.wrong,
    note: finished
      ? (today.day != null && today.day < TOTAL_DAYS ? `明日は Day ${today.day + 1}` : '')
      : `今日の残り ${Math.max(0, queue.length - qIndex)}問`,
    streak: finished && st.count > 0 ? (milestoneNote() || `🔥 ${st.count}日連続`) : milestoneNote(),
    // 1日の完了ではその日ぶん全体で見る (直前のレッスンの数だと画面の数字と合わない)
    perfect: perfectLabel(sessionStats),
    improved: finished ? improvedNote() : null,
    progress: { done: qIndex, total: queue.length },
    // その日の分を終えたときだけ。押さなくても今日は成功
    extra: finished && extraAvailable() > 0,
    ask: finished,
    next: finished ? null : '続きの5問',
  });
}

/**
 * 全部言えた回の一言。**褒美は出さない。**
 *
 * 点数も通貨もSRSの上乗せも無い。ただ「全部言えた」という事実だけを出す。
 * **判定のある問題が1問も無い回では出さない。**「覚える」しか無かった回に
 * 「全部言えた」と出ると、言えたかどうかを確かめていないのに褒めることになる。
 */
function perfectLabel(stats) {
  const answered = stats.answered;
  if (answered < 2) return null;                 // 1問だけで「全部」とは言わない
  if (stats.wrong > 0) return null;
  return `✓ ${answered}問すべて言えました`;
}

/**
 * 「前より言えた」。**比べられるときだけ出す。**
 * 前に間違えて今日は言えたものを engine が数える。0件なら何も出さない
 * (作り話の励ましは書かない)。
 */
function improvedNote() {
  const up = engine.improvedOn(state.events || [], today.today, localDayOf);
  if (!up.count) return null;
  return `前に言えなかった ${up.count}件が、今日は言えました`;
}

/**
 * 節目の一言。**毎日は出さない。**
 * 毎日祝うと、節目であることの意味が無くなる。
 * 連続日数の値そのものは engine/streak.js のまま、ここでは読むだけ。
 */
const MILESTONES = [3, 7, 14, 30, 60, 90];
function milestoneNote() {
  const st = engine.displayStreak(state.streak, today.today);
  if (!st.activeToday || !MILESTONES.includes(st.count)) return null;
  return st.count === 7 ? '🔥 1週間続きました'
    : st.count === 14 ? '🔥 2週間続きました'
    : `🔥 ${st.count}日続きました`;
}

/**
 * 「もう5問」で出せる数。
 * **新しい語は1語も足さない。**その日の残りと、期日の来ている復習だけ。
 * 1日の新規語の上限を後ろから破らないようにする。
 */
function extraAvailable() {
  if (today.day == null) return 0;
  const cards = Object.values(state.cards);
  const nowIso = new Date().toISOString();
  return engine.dueCards(cards, today.today).length
       + engine.relearnCards(cards, nowIso, today.today).length;
}

/** 完了画面。レッスンの区切りも1日の完了も、同じ場所を使い分ける。 */
function showCheer(p) {
  $('done-mark').textContent = p.mark;
  $('done-t').textContent = p.title;
  $('done-count').textContent = String(p.count);

  // **0のものは出さない。**「0 もう一度」は読む価値が無いのに1行ぶん場所を取り、
  // 見出しの数字から目を逸らす。3つ足すと見出しの数になる関係はそのまま。
  const cell = (id, value) => {
    $(id).textContent = String(value || 0);
    $('cell-' + id.replace('done-', '')).hidden = !(value > 0);
  };
  cell('done-learned', p.learned);
  cell('done-ok', p.ok);
  cell('done-ng', p.ng);

  const perfect = $('done-perfect');
  perfect.textContent = p.perfect || '';
  perfect.hidden = !p.perfect;

  // 今日の中でどこまで来たか。バーは描いたあとに伸ばす (止まって見えないように)
  const bar = $('done-bar');
  const pr = p.progress || { done: 0, total: 0 };
  const pctNow = pr.total ? Math.round((pr.done / pr.total) * 100) : 0;
  bar.style.width = '0%';
  $('done-sub').textContent = pr.total ? `今日 ${pr.done} / ${pr.total} 問` : '';
  requestAnimationFrame(() => { bar.style.width = `${pctNow}%`; });

  const streak = $('done-streak');
  streak.textContent = p.streak || '';
  streak.hidden = !p.streak;

  // 「前より言えた」があればそちらを優先して出す (事実のほうが励ましより効く)
  const note = $('done-note');
  const text = p.improved || p.note || '';
  note.textContent = text;
  note.hidden = !text;

  $('next-lesson').hidden = !p.next;
  if (p.next) $('next-lesson').textContent = p.next;
  $('extra-btn').hidden = !p.extra;

  // 「あと5問でどうなるか」。**本当にそうなるときだけ**出す
  const why = $('next-why');
  const line = p.next ? nextLessonNote(p.progress) : '';
  why.textContent = line;
  why.hidden = !line;

  // 続きがあるときは「次の5問」を主役にし、切り上げるほうは控えめにする。
  // 同じ見た目のボタンを2つ並べると、どちらを押すのか毎回考えることになる
  const back = $('back-home');
  back.textContent = p.next ? '今日はここまで' : 'ホームへ';
  back.className = p.next ? 'ghost' : 'primary';

  renderAsk(!!p.ask);
  showScreen('summary');
}

/**
 * 「次の5問」の上に出す一行。
 *
 * **事実として正しいときだけ出す。**「もう少し!」のような煽りは書かない
 * (嘘でなくても、毎回出れば背景になり、当たっていなければ信用を失う)。
 * 出るのは「あと1回で半分」「あと1回で今日の分が終わる」のどちらかだけ。
 */
function nextLessonNote(progress) {
  const pr = progress || {};
  const total = pr.total || 0;
  const done = pr.done || 0;
  if (!total || done >= total) return '';
  const after = Math.min(total, done + engine.lessonSize);   // 次の1回を終えた時点
  if (after >= total) return 'あと5問で今日の分が終わります';
  const half = total / 2;
  if (done < half && after >= half) return 'あと5問で今日の半分です';
  return '';
}

/**
 * 1タップの感想。**任意。答えなくても先へ進める。**
 *
 * この答えだけで翌日の出題や新規語の上限を自動で変えない。
 * 1日の量は復習の負荷から決まるもので、その日の気分で動かすと
 * 復習が溜まったときに破綻する。まずは記録として貯める。
 */
const ASK_CHOICES = [['few', '少ない'], ['ok', 'ちょうどいい'], ['many', '多い']];

function renderAsk(show) {
  const box = $('ask-box');
  if (!show) { box.hidden = true; return; }
  const answered = (state.dayFeedback || {})[today.today];
  const row = $('ask-row');
  clear(row);
  for (const [v, label] of ASK_CHOICES) {
    row.appendChild(el('button', {
      text: label,
      attrs: { type: 'button', 'aria-pressed': String(answered === v) },
      on: { click: () => saveAsk(v) },
    }));
  }
  const done = $('ask-done');
  done.textContent = answered ? 'ありがとうございます。記録しました' : '';
  done.hidden = !answered;
  box.hidden = false;
}

function saveAsk(value) {
  state.dayFeedback = state.dayFeedback || {};
  state.dayFeedback[today.today] = value;
  // 古いものは残さない (30日ぶんで十分)
  const days = Object.keys(state.dayFeedback).sort();
  while (days.length > 30) delete state.dayFeedback[days.shift()];
  storage.save(state);
  renderAsk(true);
}

/** 続きの5問へ。区切り直して同じセッションを続ける。 */
function continueLesson() {
  if (qIndex >= queue.length) return goHome();
  track('next_lesson');
  beginLesson();
  showScreen('session');
  nextItem();
}

/**
 * 「もう5問チャレンジ」。**その日の分を終えたあとだけ。**
 *
 * 出すのは期日の来ている復習と、当日の再学習だけ。
 * **新しい語は1語も足さない**ので、1日の新規語の上限を後ろから破ることはない。
 * 押さなくても今日は成功。押した人だけが少し多くやる。
 */
function startExtra() {
  const cards = Object.values(state.cards);
  const nowIso = new Date().toISOString();
  const pool = [
    ...engine.relearnCards(cards, nowIso, today.today),
    ...engine.dueCards(cards, today.today),
  ];
  const seen = new Set();
  const picked = pool.filter(c => !seen.has(c.id) && seen.add(c.id)).slice(0, engine.lessonSize);
  if (!picked.length) { showNotice('いま復習できるものはありません'); return; }

  track('extra_challenge');
  queue = picked.map(c => ({ cardId: c.id, source: 'review', exercise: 'recall', graded: true }));
  qIndex = 0;
  sessionStats = { answered: 0, correct: 0, wrong: 0, relearn: 0 };
  sessionKind = 'practice';   // 今日の予定とは別枠。途中経過を上書きしない
  beginLesson();
  showScreen('session');
  nextItem();
}

/**
 * 連続学習日の更新。**条件は engine/streak.js が持つ既存のもののまま。**
 * ミニレッスンを1つ終えただけでは足りない場合があるが、
 * その基準をここで緩めない (緩めると「記録を守るための1分学習」が起きる)。
 */
function bumpStreak() {
  const r = engine.updateStreak(state.streak, {
    learningDayIso: today.today, answeredToday: answeredOnDay(today.today),
  });
  state.streak = r.streak;
  storage.save(state);
}

/** その暦日に解いた問題数。streak の最低学習条件の判定に使う。 */
function answeredOnDay(dayIso) {
  return engine.answeredOn(state.events || [], dayIso, localDayOf);
}
function localDayOf(iso) {
  return clock.dayIso(new Date(iso), state.settings.timeZone || 'Asia/Tokyo');
}

// ---------- 保存したフレーズ / 商談の直前に見る ----------
/**
 * どちらも**見るだけの画面**。判定ボタンは置かない。
 *
 * 覚え具合(SRS)・連続日数を1つも動かさないのは意図的で、商談5分前に眺めたことを
 * 「復習した」と数えてしまうと、次にいつ出すかの計算が狂うため。
 * 出てくるモンゴル語は既にある教材そのままで、ここで新しくは作らない。
 */
const PHRASE_VIEWS = {
  briefing: {
    // 商談の直前に開く画面なので、説明は最短にする。
    // 毎回3行読ませると、それだけで探す時間が削られる
    lead: '読むだけです。学習の記録には影響しません。',
    groups: () => (mnPack.briefing ? mnPack.briefing.topics : [])
      .map(t => ({ label: t.label, ids: t.items.filter(id => state.cards[id]) }))
      .filter(g => g.ids.length),
    deletable: false,
    search: true,       // 商談中に日本語で探す。既存教材の中だけ
  },
  favorites: {
    lead: '学習中に「☆ 保存」を押したものが、新しい順に並びます。'
      + '読むだけなので、学習の記録には影響しません。',
    groups: () => {
      const f = favorites();
      const ids = Object.keys(f)
        .filter(id => state.cards[id])
        .sort((a, b) => String(f[b].at).localeCompare(String(f[a].at)));
      return ids.length ? [{ label: null, ids }] : [];
    },
    deletable: true,
  },
};

function renderPhrases(viewId) {
  const view = PHRASE_VIEWS[viewId];
  const body = $('sheet-body');
  clear(body);

  const groups = view.groups();
  if (!groups.length) {
    body.appendChild(el('p', { class: 'ph-lead', text: view.lead }));
    body.appendChild(el('p', { class: 'fr-empty',
      text: viewId === 'favorites'
        ? 'まだ保存したフレーズがありません。学習中に「☆ 保存」を押すと、ここに並びます。'
        : '表示できる表現がありません。' }));
    return;
  }

  const list = el('div', { class: 'ph-list' });

  // 商談中に探すための入力。**説明より先に置く。**
  // 開いた瞬間に探し始められないと、この画面を開く意味が薄い。
  // **既にある教材の中を日本語で探すだけ**で、新しいモンゴル語は作らない
  // (作れば誰も確かめていない文が混ざる)。覚え具合も出題の順番も動かさない。
  if (view.search) {
    const input = el('input', { class: 'ph-q', attrs: {
      type: 'search', inputmode: 'search', autocomplete: 'off',
      placeholder: '日本語で探す', 'aria-label': '日本語で探す',
    } });
    input.addEventListener('input', () => paintPhrases(list, groups, view, viewId, input.value));
    body.appendChild(el('div', { class: 'ph-search' }, [input]));
  }

  body.appendChild(list);
  body.appendChild(el('p', { class: 'ph-lead ph-lead-foot', text: view.lead }));
  paintPhrases(list, groups, view, viewId, '');
}

/**
 * 一覧の中身。探している最中は、見出しごとの並びをやめて該当だけを出す。
 * 商談中に「見出しを開いてから探す」の一手間を挟ませないため。
 */
function paintPhrases(list, groups, view, viewId, query) {
  clear(list);
  const q = (query || '').trim();

  if (q) {
    // 日本語側だけで探す。モンゴル語での検索は、社長がキリル文字を
    // 打てる前提になってしまうので今は作らない
    const hits = [];
    for (const g of groups) for (const id of g.ids) {
      const card = state.cards[id];
      if (card && card.promptKey.includes(q)) hits.push(id);
    }
    if (!hits.length) {
      list.appendChild(el('p', { class: 'fr-empty', text: `「${q}」に当てはまる表現はありません。` }));
      return;
    }
    list.appendChild(el('div', { class: 'ph-count', text: `${hits.length}件` }));
    for (const id of hits) list.appendChild(phraseRow(id, view, viewId));
    return;
  }

  // 商談中は「探す時間」がいちばん惜しい。場面の見出しを上に貼り付けて、
  // 1タップでその場所へ飛べるようにする
  const anchors = [];
  if (groups.length > 1) {
    const jump = el('div', { class: 'jump', attrs: { role: 'navigation', 'aria-label': '場面へ移動' } });
    groups.forEach((g) => {
      jump.appendChild(el('button', { text: g.label, attrs: { type: 'button', 'aria-current': 'false' } }));
    });
    [...jump.children].forEach((btn, i) => {
      btn.addEventListener('click', () => {
        const target = anchors[i];
        if (!target) return;
        target.scrollIntoView({ block: 'start', behavior: 'smooth' });
        for (const b of jump.children) b.setAttribute('aria-current', 'false');
        btn.setAttribute('aria-current', 'true');
      });
    });
    list.appendChild(jump);
  }

  for (const g of groups) {
    if (g.label) {
      const h = el('div', { class: 'ph-topic', text: g.label });
      list.appendChild(h);
      anchors.push(h);
    }
    for (const id of g.ids) list.appendChild(phraseRow(id, view, viewId));
  }
}

/** 1件ぶんの行。読むだけ。判定ボタンは置かない。 */
function phraseRow(id, view, viewId) {
  const card = state.cards[id];
  return el('div', { class: 'ph-item' }, [
    el('div', { class: 'ph-txt' }, [
      el('div', { class: 'ph-ja', text: card.promptKey }),
      el('div', { class: 'ph-mn', text: card.answerKey }),
    ]),
    // 音声が入れば、ここにスピーカーが並ぶ。無いあいだは出さない
    caps.audioFor(id) ? el('button', {
      class: 'spk', attrs: { type: 'button', 'aria-label': `${card.promptKey} を聞く` },
      on: { click: () => audio.play(id) },
    }, [speakerIcon()]) : null,
    view.deletable
      ? el('button', {
        class: 'ph-del', attrs: { type: 'button', 'aria-label': `${card.promptKey} を保存から外す` },
        text: '削除',
        on: { click: () => { removeFav(id); renderPhrases(viewId); } },
      })
      : el('button', {
        class: 'fav', attrs: { type: 'button', 'aria-pressed': String(isFav(id)),
          'aria-label': `${card.promptKey} を保存` },
        text: isFav(id) ? '★' : '☆',
        on: { click: (e) => {
          const on = toggleFav(id);
          e.currentTarget.setAttribute('aria-pressed', String(on));
          e.currentTarget.textContent = on ? '★' : '☆';
        } },
      }),
  ]);
}

/** スピーカーの絵。画像ファイルを読まないよう、その場で組み立てる。 */
function speakerIcon() {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'currentColor');
  svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('d', 'M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z');
  svg.appendChild(path);
  return svg;
}
/** ホームから開く一覧。直近に学習した表現へ、あとからでも記録できる。 */
function renderFieldLog() {
  const body = $('fieldlog-body');
  clear(body);
  const seen = new Set();
  const recent = [...(state.events || [])].reverse()
    .map(e => e.cardId).filter(id => id && state.cards[id] && !seen.has(id) && seen.add(id))
    .slice(0, 20);

  if (!recent.length) {
    body.appendChild(el('p', { class: 'fr-empty', text: 'まだ学習した表現がありません。' }));
    return;
  }
  for (const id of recent) {
    const card = state.cards[id];
    const grid = el('div', { class: 'field-grid' });
    const status = el('div', { class: 'field-done', text: '' });
    status.hidden = true;

    const cls = k => (k === 'wrong_reaction' || k === 'corrected') ? 'fr-wide' : '';
    for (const b of fieldButtons(SPOKEN_LABELS, engine.fieldSpokenOutcomes, cls, (spoken, btn) => {
      let textCheck = 'not_shown', correction = null;
      if (engine.fieldNegativeOutcomes.includes(spoken)) {
        const pick = window.prompt(
          '同じモンゴル語を画面で相手に見せましたか？\n'
          + 'A: 文字を見せたら通じた\nB: 文字を見せても通じなかった\n'
          + 'C: 相手が別の表現に直した\nD: 文字は見せていない', 'D');
        const map = { a: 'understood', b: 'not_understood', c: 'corrected', d: 'not_shown' };
        textCheck = map[String(pick || 'd').trim().toLowerCase()] || 'not_shown';
        if (textCheck === 'corrected') {
          correction = (window.prompt('相手が実際に言い直した表現') || '').trim() || null;
        }
      }
      const r = recordFieldUse(card, spoken, textCheck, correction);
      btn.setAttribute('aria-pressed', 'true');
      status.hidden = false;
      status.textContent = RESULT_NOTE[r.attribution]();
    })) grid.appendChild(b);

    const n = fieldReportsFor(id).length;
    body.appendChild(el('div', { class: 'fr-item' }, [
      el('div', { class: 'fr-ja', text: card.promptKey }),
      el('div', { class: 'fr-mn', text: card.answerKey }),
      grid, status,
      n ? el('div', { class: 'field-h', text: `これまでの記録 ${n} 件（版 ${card.contentRevision || 1}）` }) : null,
    ]));
  }
}

// ---------- C2: 節目チェックポイント ----------
/** 節目の日なら画面を出す。出したら true を返す。 */
function maybeShowCheckpoint() {
  if (today.day == null) return false;
  const cp = engine.checkpointFor(today.day);
  if (!cp) return false;
  const done = (state.checkpoints || {})[today.day];
  if (done && done.acknowledged) return false;
  renderCheckpoint(cp, done);
  return true;
}

function renderCheckpoint(cp, saved) {
  const root = $('cp-body');
  clear(root);
  root.appendChild(el('div', { class: 'ob-step', text: `Day ${cp.day} ・ ${cp.cefr}` }));
  root.appendChild(el('h2', { text: `${cp.label}の確認` }));

  root.appendChild(el('div', { class: 'section-label', text: 'できるようになっているか' }));
  const list = el('div', { class: 'cp-list' });
  for (const c of cp.canDo) {
    list.appendChild(el('div', { class: 'cp-row' }, [
      el('span', { class: 'cp-txt', text: c.text }),
      el('span', { class: 'cp-judge cp-' + c.judge, text: c.judge === 'tutor' ? '講師が判定' : '自動' }),
    ]));
  }
  root.appendChild(list);

  const scores = (saved && saved.scores) || {};
  const result = engine.evaluateCheckpoint(cp.day, scores);
  const verdict = el('div', { class: 'cp-verdict' });
  if (!result || result.status === 'not_taken') {
    verdict.classList.add('cp-pending');
    verdict.appendChild(el('div', { class: 'cp-v-t', text: 'まだ受けていません' }));
    verdict.appendChild(el('div', { class: 'cp-v-d', text: `自動採点 ${cp.autoSections.length}節 と、講師による判定 ${cp.humanSections.length}節 があります。` }));
  } else if (result.status === 'pending_human') {
    verdict.classList.add('cp-pending');
    verdict.appendChild(el('div', { class: 'cp-v-t', text: '講師の判定待ち' }));
    verdict.appendChild(el('div', { class: 'cp-v-d',
      text: `自動採点は終わっていますが、${result.humanJudgementPending.join(' と ')} を講師が判定するまで合否は出ません。発音と自然さは自動では判定できません。` }));
  } else if (result.status === 'passed') {
    verdict.classList.add('cp-passed');
    verdict.appendChild(el('div', { class: 'cp-v-t', text: '合格' }));
    verdict.appendChild(el('div', { class: 'cp-v-d', text: `総合 ${Math.round(result.overall * 100)}%` }));
  } else {
    verdict.classList.add('cp-failed');
    verdict.appendChild(el('div', { class: 'cp-v-t', text: '未達' }));
    verdict.appendChild(el('div', { class: 'cp-v-d',
      text: `${result.failedSections.join(' / ')} が基準に届いていません。${result.action ? result.action.rationale : ''}` }));
  }
  root.appendChild(verdict);

  if (cp.outOfScope) {
    root.appendChild(el('div', { class: 'cp-note', text: 'この時点で到達していないこと: ' + cp.outOfScope.join(' / ') }));
  }
  showScreen('checkpoint');
}


// ---------- 端末の中だけの利用の記録 ----------
/**
 * 何が何回起きたかだけを数える。**外へは送らない。**
 * 教材の本文・実使用の記録の中身・カードのIDは1つも入れない
 * (あとで貼って見直すものなので、貼り先の履歴に残ってよいものだけを持つ)。
 */
function track(name) {
  if (!today) return;
  state.use = engine.countUse(state.use, name, today.today);
}
function trackQuit(index, total) {
  state.use = engine.recordQuit(state.use, index, total);
}
function trackDuration(sec) {
  state.use = engine.recordDuration(state.use, sec);
}
function trackAnswers(n) {
  state.use = engine.recordAnswers(state.use, n);
}
/**
 * 「5問だけ進める」を押してから1問目が画面に出るまでの実測。
 *
 * **速さを自分の感想で語らないため**の数字。
 * 1問目を描いた次の描画まで待ってから測る (描く前に測ると実際より短く出る)。
 */
let startTapAt = 0;
function markStartTap() { startTapAt = performance.now(); }
function trackFirstPaint() {
  if (!startTapAt) return;
  const t0 = startTapAt;
  startTapAt = 0;
  requestAnimationFrame(() => {
    if (!today) return;
    state.use = engine.recordStart(state.use, performance.now() - t0);
  });
}

// ---------- 入力 ----------
function goHome() {
  audio.stop();
  hideAck();
  planCache = null;
  showScreen('home');
  renderHome();
}

function wire() {
  // Safari は最初 getVoices() が空を返し、あとから揃う。
  // 揃ったら判定し直す (1回空だっただけで「音声なし」に固定しない)
  if (window.speechSynthesis && window.speechSynthesis.addEventListener) {
    window.speechSynthesis.addEventListener('voiceschanged', refreshAudioCapabilities);
  }
  // 押す場所を1つにする。学習の長さを選ばせない
  // 最初のタップの中で音を1回通しておく。iOS はこれをしないと、
  // あとから画面が自動で音を出そうとしても止められる
  $('start-btn').addEventListener('click', () => { audio.unlock(); markStartTap(); startSession(null); });
  // 練習は「その他」からも、ホームの下からも1タップで開ける
  $('practice-btn').addEventListener('click', () => openSheet('practice'));
  $('next-lesson').addEventListener('click', continueLesson);
  $('match-again').addEventListener('click', startMatch);
  $('match-back').addEventListener('click', () => openSheet('practice'));
  $('reveal-btn').addEventListener('click', reveal);
  $('next-btn').addEventListener('click', advanceIntroduce);
  $('judge-wrong').addEventListener('click', () => judge(false));
  $('judge-ok').addEventListener('click', () => judge(true));
  $('quit-btn').addEventListener('click', endSession);
  $('field-open').addEventListener('click', openFieldRow);
  // 参考音声。押せば必ず鳴る。速度は変えない (遅くすると別の音になるため)
  $('speak-btn').addEventListener('click', playCurrent);
  $('listen-big').addEventListener('click', playCurrent);
  $('fav-btn').addEventListener('click', () => {
    const card = currentCard();
    if (card) { toggleFav(card.id); renderFav(card); }
  });
  $('back-home').addEventListener('click', () => {
    if (!$('next-lesson').hidden) track('stop_here');
    goHome();
  });
  $('extra-btn').addEventListener('click', startExtra);
  $('more-btn').addEventListener('click', () => { showScreen('more'); renderMore(); });
  $('more-back').addEventListener('click', goHome);
  $('sheet-back').addEventListener('click', () => { showScreen('more'); renderMore(); });
  $('fieldlog-back').addEventListener('click', () => { showScreen('more'); renderMore(); });
  $('update-btn').addEventListener('click', applyUpdate);
