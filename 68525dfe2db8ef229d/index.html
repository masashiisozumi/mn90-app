<!--
  Mongolian 90 — 社長個人β (1ファイル版)
  build-standalone.js が engine/ 言語パック/ UI / 教材を連結して生成する。
  手で編集しない。直すときは元のファイルを直して作り直す。
  生成元: 教材 140件 / モジュール 22本 / 参考音声 0件
-->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f6f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)" />
<!-- 個人βのため検索に載せない。URL を知っている人だけが開く前提 -->
<meta name="robots" content="noindex, nofollow, noarchive" />
<!-- iPhone のホーム画面から開いたときに、ブラウザのバーを出さない -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Mongolian 90" />
<!-- ホーム画面に追加したときの情報。置き場に同じ階層で置く。無くても動く -->
<link rel="manifest" href="manifest.webmanifest" />
<!-- タブのアイコン。外部ファイルを読まないよう、SVGを埋め込む -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f5f6b'/%3E%3Ctext x='32' y='43' font-family='system-ui,sans-serif' font-size='30' font-weight='700' fill='%23fff' text-anchor='middle'%3E90%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>Mongolian 90</title>
<style>
:root{
  --paper:#f4f6f7; --raised:#ffffff; --sunk:#e8ecee; --ink:#141a1d; --dim:#54626a; --faint:#8b979d;
  --line:#d5dde0; --accent:#0f5f6b; --accent-soft:#dbeced; --on-accent:#ffffff;
  --ok:#2c6a4a; --ok-soft:#dcebe3; --warn:#8a5a12; --warn-soft:#f3e9d3; --crit:#a2372c; --crit-soft:#f6e2de;
  --vh:1vh;
  --fs:1;                  /* 文字の倍率。表示設定で変える。押す場所の大きさは変えない */
  --tap:48px;              /* 44pt 以上。実測で余裕を持たせる */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#101418; --raised:#191f24; --sunk:#151b20; --ink:#e4ebee; --dim:#95a3ab; --faint:#6d7b83;
  --line:#28323a; --accent:#4fb3c0; --accent-soft:#123034; --on-accent:#101418;
  --ok:#6fb894; --ok-soft:#16301f; --warn:#d3a75c; --warn-soft:#312817; --crit:#e08578; --crit-soft:#331c19;
}}
:root[data-theme="dark"]{
  --paper:#101418; --raised:#191f24; --sunk:#151b20; --ink:#e4ebee; --dim:#95a3ab; --faint:#6d7b83;
  --line:#28323a; --accent:#4fb3c0; --accent-soft:#123034; --on-accent:#101418;
  --ok:#6fb894; --ok-soft:#16301f; --warn:#d3a75c; --warn-soft:#312817; --crit:#e08578; --crit-soft:#331c19;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  font-size:calc(16px * var(--fs)); line-height:1.6;
  min-height:100vh; min-height:calc(var(--vh,1vh)*100);
  padding-top:env(safe-area-inset-top);
  overscroll-behavior-y:contain;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none !important}

.wrap{max-width:640px;margin:0 auto;
  padding:12px max(16px, env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right))}

/* ---- 通知 ---- */
#notice{
  background:var(--warn-soft);color:var(--warn);font-size:.82rem;
  padding:10px 16px;border-bottom:1px solid var(--line);
}

/* ---- 見出し行 ---- */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.brand{font-size:.94rem;font-weight:700;letter-spacing:.01em;color:var(--accent)}
#day-label{font-size:.82rem;color:var(--dim);font-variant-numeric:tabular-nums}
.icon-btn{min-height:var(--tap);min-width:var(--tap);padding:0 12px;font-size:.82rem;
  color:var(--dim);border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:active{background:var(--sunk)}
.track{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-bottom:18px}
.track>i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* ---- ホーム上部。出すのは3つだけ ---- */
/* 点数・順位・通貨・残機は作らない。増やすほど学習から目が離れる */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.top-left{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.streak{display:inline-flex;align-items:center;gap:5px;font-size:.9rem;font-weight:700;
  color:var(--warn);font-variant-numeric:tabular-nums}
.streak.off{color:var(--faint);font-weight:600}
.streak-flame{font-size:1rem}

/* ---- 今日の目標 ---- */
.goal{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--raised);border:1px solid var(--line);border-radius:14px;
  padding:12px 15px;margin-bottom:18px}
.goal.met{background:var(--ok-soft);border-color:var(--ok)}
.goal-t{font-size:.85rem;color:var(--dim)}
.goal.met .goal-t{color:var(--ok);font-weight:700}
.goal-n{font-size:.9rem;font-variant-numeric:tabular-nums;color:var(--dim)}
.goal.met .goal-n{color:var(--ok)}

/* ---- 90日の道すじ ---- */
/* いる場所が一目で分かることだけを狙う。前後数日しか出さない */
.path{display:grid;gap:0;margin-bottom:8px}
.node{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:14px;
  padding:6px 0;position:relative}
.node-mark{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--sunk);color:var(--faint);border:2px solid var(--line);z-index:1}
.node-line{position:absolute;left:21px;top:0;bottom:0;width:2px;background:var(--line);z-index:0}
.node:first-child .node-line{top:50%}
.node:last-child .node-line{bottom:50%}
.node-body{min-width:0}
.node-d{font-size:.85rem;color:var(--dim);font-variant-numeric:tabular-nums}
.node-t{font-size:.94rem;line-height:1.4;color:var(--faint)}

.node-done .node-mark{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.node-done .node-line{background:var(--ok)}
.node-done .node-d{color:var(--ok);font-weight:700}
.node-done .node-t{color:var(--dim)}

.node-today{padding:14px 0}
.node-today .node-mark{width:56px;height:56px;background:var(--accent);color:var(--on-accent);
  border-color:var(--accent);font-size:1rem;margin-left:-6px}
.node-today .node-d{color:var(--accent);font-weight:800;font-size:1.06rem}
.node-today .node-t{color:var(--ink);font-weight:600}

.node-soon .node-mark{border-style:dashed}
.node-soon .node-t{font-style:normal}

/* ---- ミニレッスンの一覧 ---- */
.lessons{display:grid;gap:7px;margin:4px 0 18px}
.lesson{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;
  min-height:52px;padding:8px 14px;border-radius:12px;text-align:left;
  background:var(--raised);border:1px solid var(--line);font-size:.9rem}
.lesson-mark{font-size:1rem;text-align:center;color:var(--faint)}
.lesson-sub{font-size:.78rem;color:var(--faint);font-variant-numeric:tabular-nums}
.lesson-done{background:var(--ok-soft);border-color:var(--ok-soft)}
.lesson-done .lesson-mark{color:var(--ok)}
.lesson-done .lesson-t{color:var(--ok)}
.lesson-now{border-color:var(--accent);border-width:2px;background:var(--accent-soft)}
.lesson-now .lesson-mark,.lesson-now .lesson-t{color:var(--accent);font-weight:700}
.lesson-todo{opacity:.72}

/* ---- 練習 ---- */
.practice{display:grid;gap:8px}
.pr{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;
  min-height:60px;padding:12px 15px;text-align:left;border-radius:12px;
  background:var(--raised);border:1px solid var(--line)}
.pr:active{background:var(--sunk)}
/* 見出しと説明は縦に積む。span のままだと1行に続いてしまう */
.pr>span{display:block;min-width:0}
.pr-t{display:block;font-size:.98rem;font-weight:600;line-height:1.4}
.pr-d{display:block;font-size:.78rem;color:var(--faint);margin-top:3px;line-height:1.45}
.pr-n{font-size:.85rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;
  background:var(--accent-soft);border-radius:99px;padding:3px 10px;white-space:nowrap}
.pr-wait .pr-n{color:var(--dim);background:var(--sunk)}

/* ---- 7日カレンダー ---- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px}
.wd{text-align:center}
.wd-l{font-size:.72rem;color:var(--faint);margin-bottom:5px}
.wd-m{height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:.85rem;background:var(--sunk);color:var(--faint)}
.wd-on .wd-m{background:var(--ok-soft);color:var(--ok);font-weight:700}
.wd-today .wd-l{color:var(--accent);font-weight:700}
.wd-today .wd-m{outline:2px solid var(--accent);outline-offset:1px}

/* ---- 組み合わせ練習 ---- */
.match-lead{font-size:.85rem;color:var(--dim);line-height:1.7;margin:0 0 16px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match button{min-height:60px;border-radius:12px;padding:8px 10px;font-size:.94rem;
  background:var(--raised);border:1px solid var(--line);line-height:1.35;word-break:break-word}
.match button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);
  color:var(--accent);font-weight:700}
.match button:disabled{opacity:.32}
.match button.m-hit{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.match button.m-miss{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.match-n{font-size:.85rem;color:var(--dim);text-align:center;margin-top:16px;
  font-variant-numeric:tabular-nums}

/* ---- 一覧（その他・各画面）---- */
.grp{margin-bottom:22px}
.grp-h{font-size:.75rem;color:var(--faint);letter-spacing:.06em;margin-bottom:8px}
.menu{display:grid;gap:8px}
.menu button{min-height:56px;border-radius:12px;background:var(--raised);
  border:1px solid var(--line);font-size:.94rem;text-align:left;padding:10px 15px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.menu button>span:first-child{min-width:0}
.menu .m-sub{flex:none}
.menu button:active{background:var(--sunk)}
.menu .m-sub{font-size:.78rem;color:var(--faint);font-variant-numeric:tabular-nums}

.stats{display:grid;gap:8px}
.stat{background:var(--raised);border:1px solid var(--line);border-radius:12px;
  padding:14px 15px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.stat>div{min-width:0}
.stat b{font-size:1.6rem;line-height:1.15;font-variant-numeric:tabular-nums;flex:none}
.stat span{display:block;font-size:.85rem;color:var(--dim);line-height:1.4}
.stat i{display:block;font-style:normal;font-size:.75rem;color:var(--faint);
  margin-top:3px;line-height:1.45}

.about{background:var(--sunk);border-radius:12px;padding:13px 15px;font-size:.82rem;
  color:var(--dim);line-height:1.75}
.about b{color:var(--ink)}
.about p{margin:0 0 9px}
.about p:last-child{margin:0}

/* ---- 90日ロードマップ ---- */
.road{display:grid;gap:8px}
.road-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.road-d{font-weight:700;font-variant-numeric:tabular-nums}
.road-s{font-size:.8rem;padding:4px 10px;border-radius:99px;white-space:nowrap}
.road-ready{background:var(--ok-soft);color:var(--ok)}
.road-soon{background:var(--sunk);color:var(--dim)}

/* ---- 表示設定 ---- */
.opt-row{display:grid;gap:8px;margin-bottom:18px}
.opt{min-height:56px;border-radius:12px;background:var(--raised);border:1px solid var(--line);
  font-size:.94rem;text-align:left;padding:0 15px;display:flex;align-items:center;gap:10px}
.opt[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700}
.opt-mark{width:1.2em;flex:none}

/* ---- 主要ボタンは画面下部固定。親指の到達範囲に置く ---- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:10px max(16px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right));
  background:linear-gradient(to top, var(--paper) 72%, transparent);
}
.dock-inner{max-width:640px;margin:0 auto;display:grid;gap:8px}
.primary{
  min-height:56px;border-radius:14px;background:var(--accent);color:var(--on-accent);
  font-size:1.06rem;font-weight:700;padding:8px 16px;
}
.primary:disabled{opacity:.45}
.ghost{min-height:56px;border-radius:12px;background:var(--sunk);color:var(--dim);
  font-size:.9rem;padding:8px 16px}

/* 押した瞬間に必ず見た目が変わる。「押せたか分からない」を無くす。
   端末の振動は iPhone Safari で動かないので当てにしない */
.primary,.ghost,.judge button,.menu button,.lesson,.pr,.opt,.ob-opt,.match button,.ex-tab,.fav,.spk{
  transition:transform .06s ease-out, filter .06s ease-out;
}
.primary:active,.ghost:active,.judge button:active,.menu button:active,
.lesson:active,.pr:active,.opt:active,.ob-opt:active,.match button:active,
.ex-tab:active,.fav:active,.spk:active{
  transform:scale(.975); filter:brightness(.94);
}
@media (prefers-reduced-motion:reduce){
  .primary:active,.ghost:active,.judge button:active,.menu button:active,
  .lesson:active,.pr:active,.opt:active,.ob-opt:active,.match button:active,
  .ex-tab:active,.fav:active,.spk:active{transform:none}
}
.dock-pad{height:104px}
.dock-pad-2{height:164px}

/* ---- セッション ---- */
.sess-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
#progress{font-size:.82rem;color:var(--dim);font-variant-numeric:tabular-nums}
#quit-btn{font-size:.82rem;color:var(--dim);min-height:var(--tap);padding:0 10px;border-radius:10px}
#quit-btn:active{background:var(--sunk)}

.card{
  padding:8px 4px;margin-bottom:12px;
  min-height:46vh;min-height:calc(var(--vh,1vh)*46);
  display:flex;flex-direction:column;justify-content:center;text-align:center;
}
.step-lead{font-size:.85rem;color:var(--accent);font-weight:700;margin-bottom:14px}
#prompt{font-size:1.9rem;font-weight:700;line-height:1.4;text-wrap:balance;word-break:break-word}
#answer-box{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
#answer{font-size:2.1rem;font-weight:800;line-height:1.32;word-break:break-word;letter-spacing:-.01em}
.answer-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.answer-ja{font-size:1.06rem;color:var(--dim);margin-top:12px;line-height:1.5;text-wrap:balance}
.listen-lead{font-size:.94rem;color:var(--dim);margin-bottom:18px;text-wrap:balance}

/* 実使用の記録は、押さない限り邪魔をしない小さなリンク */
.field-open{margin-top:22px;font-size:.84rem;color:var(--dim);
  min-height:var(--tap);padding:0 12px;border-radius:10px;text-decoration:underline}
.field-open:active{background:var(--sunk)}

.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge button{min-height:56px;border-radius:14px;font-size:1rem;font-weight:700;padding:8px 6px}
#judge-wrong{background:var(--crit-soft);color:var(--crit)}
#judge-ok{background:var(--ok-soft);color:var(--ok)}
.keyhint{font-size:.7rem;color:var(--faint);text-align:center;margin-top:8px}
@media (hover:none){.keyhint{display:none}}

/* 押したことが分かる短い合図。ゲーム的な演出はしない */
/* 押したボタンのすぐ上に出す。画面の真ん中に出すと問題文を覆ってしまう */
#tap-ack{
  position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:40;
  display:flex;align-items:center;gap:10px;
  padding:16px 24px;border-radius:16px;font-size:1.06rem;font-weight:700;
  background:var(--raised);border:1px solid var(--line);
  box-shadow:0 6px 24px rgba(0,0,0,.16);
  pointer-events:none;
}
#tap-ack.ok{color:var(--ok);border-color:var(--ok)}
#tap-ack.ng{color:var(--warn);border-color:var(--warn)}
#tap-ack .ack-mark{font-size:1.3rem}
@media (prefers-reduced-motion:no-preference){
  #tap-ack{animation:ackin .12s ease-out}
  @keyframes ackin{from{opacity:0}to{opacity:1}}
}

/* ---- 参考音声（音声が入るまで、これらは画面に出ない）---- */
.spk{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:56px;min-width:56px;padding:0 18px;border-radius:16px;
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);
  font-size:.94rem;font-weight:700;
}
.spk:active{filter:brightness(.95)}
.spk svg{width:1.35em;height:1.35em;flex:none}
.spk-big{min-height:96px;min-width:180px;font-size:1.12rem;border-radius:22px}
.spk-big svg{width:2em;height:2em}
.spk-again{background:var(--sunk);color:var(--dim);border-color:var(--line);
  min-height:var(--tap);font-size:.84rem;font-weight:600}
.audio-note{font-size:.72rem;color:var(--faint);margin-top:8px}
.sess-actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:20px}

/* 保存(お気に入り)。学習の判定とは別物なので、色も位置も分ける */
.fav{min-height:var(--tap);padding:0 14px;border-radius:12px;font-size:.82rem;
  background:var(--sunk);color:var(--dim);border:1px solid var(--line)}
.fav[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}

/* ---- 保存したフレーズ / 商談の直前に見る ---- */
.ph-topic{font-size:1.06rem;font-weight:700;margin:26px 0 10px;padding-bottom:6px;
  border-bottom:2px solid var(--accent);color:var(--accent)}
.ph-topic:first-child{margin-top:0}
.ph-item{background:var(--raised);border:1px solid var(--line);border-radius:14px;
  padding:14px 15px;margin-bottom:9px;display:flex;align-items:center;gap:12px}
.ph-txt{flex:1;min-width:0}
.ph-ja{font-size:.94rem;color:var(--dim);line-height:1.45}
.ph-mn{font-size:1.35rem;font-weight:700;line-height:1.35;word-break:break-word;margin-top:3px}
.ph-lead{font-size:.85rem;color:var(--dim);line-height:1.7;margin:0 0 20px}
.ph-del{min-height:var(--tap);min-width:var(--tap);border-radius:12px;font-size:.82rem;
  background:var(--sunk);color:var(--dim);border:1px solid var(--line);padding:0 12px}

/* ---- 書き出し / 不具合報告 ---- */
.copybox{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:15px}
.copy-lead{font-size:.85rem;color:var(--dim);line-height:1.7;margin:0 0 14px}
.copy-done{font-size:.85rem;color:var(--ok);margin-top:12px;font-weight:700}
.copy-detail{margin-top:14px}
.copy-detail summary{font-size:.82rem;color:var(--dim);min-height:var(--tap);
  display:flex;align-items:center;cursor:pointer}
#export-text,#diag-text{
  width:100%;border-radius:10px;border:1px solid var(--line);background:var(--sunk);
  color:inherit;padding:10px;font-size:.75rem;line-height:1.5;margin-top:10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;
}
.export-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ex-tab{
  min-height:var(--tap);border-radius:10px;font-size:.82rem;font-weight:600;padding:6px 8px;
  background:var(--sunk);color:var(--dim);border:1px solid var(--line);
}
.ex-tab[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

/* ---- 実使用フィードバック ---- */
/* 学習の判定 (言えた/言えなかった) と混ざらないよう、色も位置も分ける */
.field{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);text-align:left}
.field-h{font-size:.85rem;font-weight:700;margin-bottom:10px;line-height:1.5}
.field-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.field-grid button{
  min-height:var(--tap);border-radius:12px;font-size:.82rem;font-weight:600;line-height:1.25;
  background:var(--sunk);color:var(--dim);border:1px solid var(--line);padding:6px 4px;
}
.field-grid button.fr-wide{grid-column:span 3}
.field-grid button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.field-step2{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.field-q{font-size:.85rem;font-weight:700;margin-bottom:8px;line-height:1.4}
.field-corr{display:none;gap:8px;margin-top:10px}
.field-corr.on{display:grid;grid-template-columns:1fr auto}
.field-corr input{
  min-height:var(--tap);border-radius:12px;border:1px solid var(--line);
  background:var(--raised);color:inherit;padding:0 12px;font-size:16px;
}
.field-corr button{min-height:var(--tap);border-radius:12px;padding:0 16px;font-weight:700}
.field-done{font-size:.78rem;color:var(--ok);margin-top:8px}
.fr-item{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.fr-item .fr-ja{font-size:.9rem;color:var(--dim)}
.fr-item .fr-mn{font-size:1.2rem;font-weight:700;margin:2px 0 10px;word-break:break-word}
.fr-empty{color:var(--faint);font-size:.9rem;padding:20px 0;line-height:1.7}

/* ---- レッスン完了 / 1日の完了 ---- */
/* 紙吹雪のような派手な演出は毎回出さない。1日の完了だけ少し強くする */
.cheer{display:flex;flex-direction:column;justify-content:center;text-align:center;
  min-height:52vh;min-height:calc(var(--vh,1vh)*52);gap:4px}
.cheer-mark{font-size:2.6rem;line-height:1;margin-bottom:10px}
.cheer-t{font-size:1.6rem;font-weight:800;line-height:1.25}
.cheer-n{font-size:2.4rem;font-weight:800;margin-top:16px;font-variant-numeric:tabular-nums}
.cheer-n small{font-size:1rem;font-weight:700;margin-left:3px}
.cheer-note{font-size:.94rem;color:var(--dim);margin-top:18px;line-height:1.7;text-wrap:balance}
.cheer-streak{display:inline-flex;align-items:center;gap:6px;margin-top:18px;
  font-size:1rem;font-weight:700;color:var(--warn);
  background:var(--warn-soft);border-radius:99px;padding:8px 18px;align-self:center}
@media (prefers-reduced-motion:no-preference){
  .cheer-mark{animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
  .cheer .cheer-n{animation:rise .45s ease-out}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
}

/* ---- まとめ ---- */
.done{display:flex;flex-direction:column;justify-content:center;text-align:center;
  min-height:52vh;min-height:calc(var(--vh,1vh)*52);gap:4px}
.done-t{font-size:1.75rem;font-weight:800;line-height:1.2}
.done-n{font-size:2.6rem;font-weight:800;margin-top:14px;font-variant-numeric:tabular-nums}
.done-n small{font-size:1.1rem;font-weight:700;margin-left:3px}
.done-split{display:flex;justify-content:center;gap:34px;margin-top:20px}
.done-split div{text-align:center}
.done-split b{display:block;font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.done-split span{font-size:.82rem;color:var(--dim)}
.done-ok b{color:var(--ok)}
.done-ng b{color:var(--crit)}
.done-learn b{color:var(--accent)}
.done-note{font-size:.9rem;color:var(--dim);margin-top:22px;line-height:1.7;text-wrap:balance}

/* ---- オンボーディング ---- */
.ob-step{font-size:.75rem;color:var(--faint);letter-spacing:.06em;margin-bottom:6px}
#ob-body h2{font-size:1.35rem;margin:0 0 16px;line-height:1.35;text-wrap:balance}
.ob-options{display:grid;gap:8px}
.ob-opt{
  display:flex;flex-direction:column;gap:2px;text-align:left;
  min-height:56px;padding:13px 15px;
  background:var(--raised);border:1px solid var(--line);border-radius:12px;
}
.ob-opt:active{background:var(--sunk)}
.ob-opt-t{font-weight:700}
.ob-opt-d{font-size:.78rem;color:var(--dim)}
.ob-preset{
  margin-top:16px;min-height:56px;width:100%;padding:12px;
  background:var(--sunk);color:var(--dim);border-radius:12px;font-size:.85rem;
}

/* ---- 節目チェックポイント ---- */
.cp-list{display:grid;gap:8px;margin-bottom:16px}
.cp-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.cp-txt{font-size:.9rem}
.cp-judge{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.cp-tutor{background:var(--warn-soft);color:var(--warn)}
.cp-auto{background:var(--sunk);color:var(--dim)}
.cp-verdict{border-radius:12px;padding:14px 16px;margin-bottom:14px}
.cp-verdict .cp-v-t{font-size:1.06rem;font-weight:700;margin-bottom:4px}
.cp-verdict .cp-v-d{font-size:.85rem;line-height:1.6}
.cp-pending{background:var(--warn-soft);color:var(--warn)}
.cp-passed{background:var(--ok-soft);color:var(--ok)}
.cp-failed{background:var(--crit-soft);color:var(--crit)}
.cp-note{font-size:.8rem;color:var(--dim);background:var(--sunk);border-radius:10px;padding:11px 13px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="notice" hidden></div>
<!-- 押したことが分かる短い合図。次の問題へは自動で進む -->
<div id="tap-ack" hidden aria-live="polite"></div>

<!-- オンボーディング -->
<main id="onboarding" class="wrap" hidden>
  <div class="head"><span class="brand">Mongolian 90</span></div>
  <div id="ob-body"></div>
</main>

<!-- ホーム。開いて「何を押せばいいか」を考えさせない -->
<main id="home" class="wrap" hidden>
  <!-- 上部に出すのは3つだけ。点数・順位・通貨・残機は作らない -->
  <div class="topbar">
    <div class="top-left">
      <span class="brand">Mongolian 90</span>
      <span class="streak" id="streak-chip" hidden></span>
      <span id="day-label">—</span>
    </div>
    <button id="more-btn" class="icon-btn" type="button">その他</button>
  </div>

  <!-- 今日の目標。全部やらないと終われない、と思わせないためのもの -->
  <div class="goal" id="goal-box" hidden>
    <span class="goal-t" id="goal-t">今日の目標</span>
    <span class="goal-n" id="goal-n"></span>
  </div>

  <!-- 90日の道すじ。前後数日だけ見せ、今日を一番大きくする -->
  <div class="path" id="path"></div>

  <!-- 今日を5問ずつに分けたもの -->
  <div class="lessons" id="lessons"></div>

  <div class="hero-note" id="today-note" hidden></div>
  <div class="dock-pad-2"></div>
</main>

<div class="dock" id="home-dock">
  <div class="dock-inner">
    <button id="start-btn" class="primary" type="button">5問だけ進める</button>
    <button id="practice-btn" class="ghost" type="button">練習</button>
  </div>
</div>

<!-- その他。毎日の学習動線には置かないものをここへ集める -->
<main id="more" class="wrap" hidden>
  <div class="head"><span class="brand">その他</span></div>
  <div id="update-row" hidden>
    <div class="grp">
      <div class="menu">
        <button id="update-btn" type="button">
          <span>更新があります</span><span class="m-sub">押すと新しい版になります</span>
        </button>
      </div>
    </div>
  </div>
  <div class="grp">
    <div class="menu" id="more-menu"></div>
  </div>
  <div class="dock-pad"></div>
</main>

<div class="dock" id="more-dock" hidden>
  <div class="dock-inner">
    <button id="more-back" class="primary" type="button">ホームへ戻る</button>
  </div>
</div>

<!-- 「その他」の中の各画面。中身は JS が組み立てる -->
<main id="sheet" class="wrap" hidden>
  <div class="head"><span class="brand" id="sheet-title">—</span></div>
  <div id="sheet-body"></div>
  <div class="dock-pad"></div>
</main>

<div class="dock" id="sheet-dock" hidden>
  <div class="dock-inner">
    <button id="sheet-back" class="primary" type="button">もどる</button>
  </div>
</div>

<!-- 学習画面。ここには説明を置かない -->
<main id="session" class="wrap" hidden>
  <div class="sess-top">
    <span id="progress">0 / 0</span>
    <button id="quit-btn" type="button">終了</button>
  </div>
  <div class="track"><i id="progress-bar" style="width:0%"></i></div>

  <div class="card">
    <!-- はじめて出す語だけに出す一言。想起させない -->
    <div class="step-lead" id="intro-lead" hidden>覚える</div>

    <!-- 聞き取りの問題。音声が入るまで、この一式は一度も表示されない -->
    <div id="listen-prompt" hidden>
      <div class="listen-lead">聞こえたモンゴル語の意味は？</div>
      <button id="listen-big" class="spk spk-big" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2.2v2.1a7.7 7.7 0 0 1 0 15.4v2.1a9.8 9.8 0 0 0 0-19.6z"/></svg><span>聞く</span></button>
    </div>

    <div id="prompt">—</div>

    <div id="answer-box" hidden>
      <div class="answer-row">
        <div id="answer">—</div>
        <button id="speak-btn" class="spk" type="button" aria-label="聞く" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2.2v2.1a7.7 7.7 0 0 1 0 15.4v2.1a9.8 9.8 0 0 0 0-19.6z"/></svg></button>
      </div>
      <!-- 聞き取りのときだけ、意味をここに出す -->
      <div class="answer-ja" id="answer-ja" hidden></div>

      <div class="sess-actions">
        <button id="replay-btn" class="spk spk-again" type="button" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg><span>もう一度聞く</span></button>
        <button id="fav-btn" class="fav" type="button" aria-pressed="false">☆ 保存</button>
      </div>
      <div class="audio-note" id="audio-note" hidden></div>

      <!-- 押さない限り、通常の学習の邪魔をしない -->
      <button id="field-open" class="field-open" type="button">実際の会話で使った</button>

      <div class="field" id="field-row" hidden>
        <div class="field-h">実際の会話で、この表現はどうでしたか？</div>
        <div class="field-grid" id="field-buttons"></div>

        <div class="field-step2" id="field-step2" hidden>
          <div class="field-q">同じモンゴル語を、画面で相手に見せましたか？</div>
          <div class="field-grid" id="field-text-buttons"></div>
        </div>

        <div class="field-corr" id="field-corr">
          <input id="field-corr-input" type="text" inputmode="text"
                 placeholder="相手が実際に言い直した表現" autocomplete="off">
          <button id="field-corr-save" class="primary" type="button">記録</button>
        </div>
        <div class="field-done" id="field-done" hidden></div>
      </div>
    </div>
  </div>
  <div class="dock-pad"></div>
</main>

<div class="dock" id="session-dock" hidden>
  <div class="dock-inner">
    <button id="reveal-btn" class="primary" type="button">答えを見る</button>
    <button id="next-btn" class="primary" type="button" hidden>覚えた・次へ</button>
    <div id="judge-row" class="judge" hidden>
      <button id="judge-wrong" type="button">言えなかった</button>
      <button id="judge-ok" type="button">言えた</button>
    </div>
    <div class="keyhint" id="keyhint">Space = 答え / ← 言えなかった / → 言えた</div>
  </div>
</div>

<!-- 実使用フィードバック（あとから記録する） -->
<main id="fieldlog" class="wrap" hidden>
  <div class="head"><span class="brand">実際に使った結果</span></div>
  <p class="ph-lead" id="fieldlog-note">
    商談や会話で実際に使った表現の結果を記録します。通じなかったときは、
    できるだけ画面を見せて、その結果も残してください。
  </p>
  <div id="fieldlog-body"></div>
  <div class="dock-pad"></div>
</main>

<div class="dock" id="fieldlog-dock" hidden>
  <div class="dock-inner">
    <button id="fieldlog-back" class="primary" type="button">もどる</button>
  </div>
</div>

<!-- 節目チェックポイント -->
<main id="checkpoint" class="wrap" hidden>
  <div id="cp-body"></div>
  <div class="dock-pad"></div>
</main>

<div class="dock" id="checkpoint-dock" hidden>
  <div class="dock-inner">
    <button id="cp-continue" class="primary" type="button">確認した</button>
  </div>
</div>

<!-- レッスン完了 / 今日の完了。どちらもここを使い、文言と演出だけ変える -->
<main id="summary" class="wrap" hidden>
  <div class="cheer">
    <div class="cheer-mark" id="done-mark">✓</div>
    <div class="cheer-t" id="done-t">5問 完了</div>
    <div class="cheer-n"><span id="done-count">0</span><small>問</small></div>
    <div class="done-split">
      <div class="done-learn"><b id="done-learned">0</b><span>覚えた</span></div>
      <div class="done-ok"><b id="done-ok">0</b><span>言えた</span></div>
      <div class="done-ng"><b id="done-ng">0</b><span>もう一度</span></div>
    </div>
    <div class="cheer-streak" id="done-streak" hidden></div>
    <div class="cheer-note" id="done-note" hidden></div>
  </div>
  <div class="dock-pad-2"></div>
</main>

<div class="dock" id="summary-dock" hidden>
  <div class="dock-inner">
    <button id="next-lesson" class="primary" type="button" hidden>次の5問</button>
    <button id="back-home" class="primary" type="button">ホームへ</button>
  </div>
</div>

<!-- 組み合わせ練習。覚え具合もSRSも動かさない -->
<main id="match" class="wrap" hidden>
  <div class="head"><span class="brand">組み合わせ</span></div>
  <p class="match-lead" id="match-lead"></p>
  <div class="match" id="match-grid"></div>
  <div class="match-n" id="match-n"></div>
  <div class="dock-pad"></div>
</main>

<div class="dock" id="match-dock" hidden>
  <div class="dock-inner">
    <button id="match-again" class="primary" type="button" hidden>もう5組</button>
    <button id="match-back" class="ghost" type="button">練習へ戻る</button>
  </div>
</div>

</body>
</html>

// ===== engine/field-report.js =====
(() => {
/**
 * 実使用フィードバック (Field QA)。
 *
 * 人間の言語監修者を置かない構成では、「その表現が実際に通じるか」を
 * 事前に判定する工程が存在しない。したがってそれを事後に拾う経路が要る。
 *
 * ただし、**「通じなかった」から「教材が悪い」を導いてはいけない。**
 * 通じなかった原因には、教材側の問題(意味の誤り・不自然さ・場面違い)だけでなく、
 * 学習者側の問題(発音・速度・声量)や環境の問題(雑音・相手が聞いていない・
 * 教材どおりに言わなかった)がある。この構成では AI による発音判定を禁止しているため、
 * 発話が原因かどうかをアプリが判定する手段は無い。
 *
 * そこで、負の結果が出たときだけ **文字で見せたらどうだったか** を1問だけ聞く。
 * 文字で見せて通じたなら、少なくともその文自体は相手に伝わる形をしている。
 * 文字でも通じなかったなら、教材側を疑う根拠になる。
 * この1問が、発話問題と教材問題を分ける唯一の手がかりである。
 *
 * この工程がしないこと:
 *   - 発音の採点 (低資源言語では判定が当てにならず、誤った音を固定する)
 *   - 教材本文の自動降格・自動置換 (帰属が確定しないため)
 *   - 相手の言い直しをそのまま正解として採用すること
 */

/** 話したときの結果。UI の5つの選択肢と1対1で対応する。 */
const SPOKEN_OUTCOMES = ['understood', 'repeated', 'not_understood', 'wrong_reaction', 'corrected'];

/** understood 以外は、原因の切り分けが要る。 */
const NEGATIVE_SPOKEN = ['repeated', 'not_understood', 'wrong_reaction', 'corrected'];

/**
 * 文字で見せたときの結果。負の結果のときだけ聞く。
 *   not_shown        文字は見せていない → 帰属を決められない
 *   understood       文字を見せたら通じた → 発話側が疑わしい
 *   not_understood   文字を見せても通じなかった → 教材側が疑わしい
 *   corrected        相手が別の表現に直した → 要確認 (ただし誤りの証明ではない)
 */
const TEXT_CHECKS = ['not_shown', 'understood', 'not_understood', 'corrected'];

/**
 * 1件の記録の帰属。
 *   positive          意図が伝わった
 *   delivery_suspect  話してNG / 文字OK。**教材の問題ではない**
 *   content_suspect   文字でもNG。教材側を疑う根拠
 *   correction        相手が別表現へ直した。要確認
 *   inconclusive      文字を見せていない。どちらとも言えない
 */
const ATTRIBUTIONS = ['positive', 'delivery_suspect', 'content_suspect', 'correction', 'inconclusive'];

/**
 * 教材ごとの Field QA 状態。**教材本体の status (draft/ai_checked/production_ready) とは別軸。**
 * 実使用の記録がこちらを動かし、教材本体の status は書き換えない。
 *
 *   unobserved         現 revision での実使用記録が無い
 *   field_observed     使われた。問題は出ていない
 *   delivery_suspect   話してNGだが文字ではOK。教材の問題として扱わない
 *   qa_attention       文字でもNGが1回。再確認の候補
 *   qa_attention_high  強い証拠がある (下記 STRONG_EVIDENCE)。再QAへ送る
 *   suspended          新規学習を一時停止した。**削除ではない**
 *   revised            本文を修正した。次の revision で再度実使用にかける
 */
const FIELD_STATUS = [
  'unobserved', 'field_observed', 'delivery_suspect',
  'qa_attention', 'qa_attention_high', 'suspended', 'revised',
];

/** SRS から外す Field QA 状態。suspended だけ。suspect は外さない。 */
const FIELD_BLOCKS_SRS = ['suspended'];

/**
 * 1件の実使用記録を作る。
 *
 * contentRevision は「そのとき画面に出ていた本文の版」。
 * 本文を直したら版を上げるので、古い版の悪い結果が新しい版の評価に混ざらない。
 *
 * counterpartCorrection は **相手が実際に言い直した表現** のみ。
 * 「ネイティブが監修した」という意味では絶対に使わない。
 */
function newReport(p) {
  if (!SPOKEN_OUTCOMES.includes(p.spokenOutcome)) {
    throw new Error(`未知の spokenOutcome: ${p.spokenOutcome}`);
  }
  const textCheck = p.textCheck || 'not_shown';
  if (!TEXT_CHECKS.includes(textCheck)) throw new Error(`未知の textCheck: ${textCheck}`);
  if (p.spokenOutcome === 'understood' && textCheck !== 'not_shown') {
    // 通じたのに文字確認が入るのは、UIの流れとして起こらない。取り違えを弾く。
    throw new Error('understood に textCheck は付かない');
  }
  if (!p.itemId) throw new Error('itemId が無い');
  if (!Number.isInteger(p.contentRevision) || p.contentRevision < 1) {
    throw new Error('contentRevision (1以上の整数) が無い。どの版に対する記録か特定できない');
  }
  return {
    at: p.at || new Date().toISOString(),
    itemId: p.itemId,
    contentRevision: p.contentRevision,
    spokenOutcome: p.spokenOutcome,
    textCheck,
    counterpartCorrection: p.counterpartCorrection || null,  // 相手が実際に言い直した表現
    context: p.context || null,                              // どの場面で使ったか
    note: p.note || null,
  };
}

/** 1件の記録の帰属を決める。ここには閾値も重みも無い。事実の分類だけ。 */
function attributionOf(r) {

/**
 * ホーム。**開いて「何を押せばいいか」を考えさせない。**
 *
 * 上に3つ (名前 / 連続日数 / Day) → 今日の目標 → 90日の道すじ →
 * 今日を5問ずつに分けた一覧 → 大きな開始ボタン。
 * 統計・設定・説明はすべて「その他」の中。
 */
function renderHome() {

  renderTopBar();
  renderGoal();
  renderPath();

  const note = $('today-note');

    note.textContent = '今日は本来キリル文字の練習日です。文字は手元の資料で進めてください。';
    note.hidden = false;
  } else { note.hidden = true; }

  renderHomeDock(plan);
}

/** 上部の3つ。数字を増やさない。点数・順位・通貨・残機は作らない。 */
function renderTopBar() {
  $('day-label').textContent =
    today.state === 'before_start' ? '開始前' :
    today.state === 'completed' ? '90日 完了' : `Day ${today.day} / ${TOTAL_DAYS}`;

    chip.className = 'streak';

}

/**
 * 今日どこまで進んだか。**画面に出したものは全部数える。**
 *
 * 「覚える」の手順も1つと数える。判定した数だけを数えると、新しい語ばかりの日に
 * 「5つやったのに0問」と出て、実感と合わない。
 * 保存する項目を1つ足すだけで、既存の保存形式は変えていない。
 */
function dailyProgress() {
  const d = state.dailyProgress;
  if (!d || d.day !== today.today) return 0;
  return d.steps || 0;
}
function bumpDailyProgress() {
  const d = state.dailyProgress;
  state.dailyProgress = (d && d.day === today.today)
    ? { day: d.day, steps: (d.steps || 0) + 1 }
    : { day: today.today, steps: 1 };
}

/**
 * 今日の目標。**連続学習日(🔥)とは別の基準。**
 *
 * 目標はミニレッスン1つぶん(5問)。連続学習日は engine/streak.js が
 * **別の、より重い条件**で判定していて、そちらの意味は変えていない。
 * 同じものとして見せると「目標を達成したのに連続日数が増えない」理由が
 * 説明できなくなるので、足りないぶんはそのまま書く。
 */
function renderGoal() {
  const box = $('goal-box');
  if (today.state === 'before_start') { box.hidden = true; return; }
  const steps = dailyProgress();
  const met = engine.goalMet(steps);
  box.className = met ? 'goal met' : 'goal';
  $('goal-t').textContent = met ? '✓ 今日の目標を達成' : '今日の目標';
  const need = engine.streakMinAnswers - answeredOnDay(today.today);
  $('goal-n').textContent = met
    ? (need > 0 ? `連続記録まで あと ${need}問` : `${steps}問`)
    : `${steps} / ${engine.dailyGoal} 問`;
  box.hidden = false;
}

/**
 * 90日の道すじ。**前後数日だけ**を出し、今日を一番大きくする。
 * 教材があるのは Day1〜14 だけなので、それ以降は「準備中」と書く。
 * 出来ていないものを、出来ているように見せない。
 */
const PATH_BEFORE = 2;
const PATH_AFTER = 2;
/** 教材が入っている最後の日。ここから先は準備中。 */
const CONTENT_LAST_DAY = 14;

function renderPath() {
  const root = $('path');
  clear(root);
  if (today.day == null) return;

  const from = Math.max(1, today.day - PATH_BEFORE);
  const to = Math.min(TOTAL_DAYS, today.day + PATH_AFTER);
  for (let d = from; d <= to; d++) {
    const cd = curriculumDay(d);
    const isToday = d === today.day;
    const past = d < today.day;
    const soon = d > CONTENT_LAST_DAY;
    const cls = ['node', isToday ? 'node-today' : past ? 'node-done' : 'node-todo',
      (!isToday && soon) ? 'node-soon' : ''].filter(Boolean).join(' ');

    root.appendChild(el('div', { class: cls }, [
      el('div', { class: 'node-line' }),
      el('div', { class: 'node-mark', text: past ? '✓' : String(d) }),
      el('div', { class: 'node-body' }, [
        el('div', { class: 'node-d', text: isToday ? `Day ${d} ・ 今日` : `Day ${d}` }),
        el('div', { class: 'node-t',
          text: soon ? '準備中' : (cd && cd.theme) ? cd.theme : '' }),
      ]),
    ]));
  }
}

/**
 * 今日を5問ずつに分けた一覧。
 * **出題の中身は1つも変えていない。**engine が組んだ手順を、engine が切っただけ。
 */
function renderLessons(plan) {
  const root = $('lessons');
  clear(root);
  if (today.state === 'before_start') return;

  // 今日の分を終えた日は、空欄にせず終わったことを出す。
  // 何も無い画面は「壊れている」ように見える
  if (!plan.split || !plan.split.total) {
    if (dailyProgress() > 0) {
      root.appendChild(el('div', { class: 'lesson lesson-done' }, [
        el('span', { class: 'lesson-mark', text: '✓' }),
        el('span', { class: 'lesson-t', text: '今日の分は完了' }),
        el('span', { class: 'lesson-sub', text: `${dailyProgress()}問` }),
      ]));
    }
    return;
  }

  for (const l of plan.split.lessons) {
    const cls = 'lesson ' + (l.state === 'done' ? 'lesson-done'
      : l.state === 'current' ? 'lesson-now' : 'lesson-todo');
    root.appendChild(el('div', { class: cls }, [
      el('span', { class: 'lesson-mark',
        text: l.state === 'done' ? '●' : l.state === 'current' ? '▶' : '○' }),
      el('span', { class: 'lesson-t', text: `レッスン ${l.index + 1}` }),
      el('span', { class: 'lesson-sub',
        text: l.state === 'done' ? '完了'
          : l.state === 'current' ? `${l.doneInLesson} / ${l.size}`
          : `${l.size}問` }),
    ]));
  }
}

/** 下の大きなボタン。開いてから学習開始まで2タップ以内にする。 */
function renderHomeDock(plan) {
  const start = $('start-btn');
  start.disabled = today.state === 'before_start' || plan.remaining === 0;
  start.textContent =
    today.state === 'before_start' ? `${state.settings.startDayIso} から開始`
    : plan.remaining === 0 ? '今日の分は終わりました'
    // 途中でやめた日は、そのレッスンが終わるまでの数を出す。
    // 「あと3問」なら戻ってこられる
    : plan.inLesson > 0 && plan.inLesson < engine.lessonSize ? `続きから ${plan.inLesson}問`
    : `5問だけ進める（残り ${plan.remaining}問）`;
}

/** 今日の復習対象の数。練習の一覧に出す。 */
function dueOrRelearnCount() {
  if (today.day == null) return 0;
  const cards = Object.values(state.cards);
  const nowIso = new Date().toISOString();
  return engine.dueCards(cards, today.today).length
       + engine.relearnCards(cards, nowIso, today.today).length;
}

/**
 * 今日の見込み。**ホームの数字と、実際に出る問題数を必ず一致させる。**
 *
 * 数えるのは手順(steps)であって出題キューではない。はじめての語は
 * 「覚える」と「思い出す」の2手順になるため、キューの長さとは一致しない。
 * 5問ずつの切り分けも engine に任せ、画面側で数え直さない。
 */
let planCache = null;
function todayPlan() {
  const empty = { remaining: 0, minutes: null, resumed: false, split: null, inLesson: 0, index: 0, total: 0 };
  if (today.state === 'before_start') return empty;

  const resume = resumableSession();
  if (resume) {
    const rest = restSteps(resume);
    const total = (resume.cardIds || []).length;
    return {
      remaining: rest.length,
      minutes: rest.length ? engine.estimateMinutes(rest) : null,
      resumed: true,
      split: engine.splitLessons(resume.cardIds.map(id => ({ cardId: id })), resume.index),
      inLesson: engine.remainingInLesson(resume.index, total),
      index: resume.index, total,
    };
  }
  if (!planCache || planCache.day !== today.today) {
    planCache = { day: today.today, plan: planFor(defaultModeId()) };
  }
  const plan = planCache.plan;
  if (!plan || !plan.ok) return empty;
  return {
    remaining: plan.steps.length, minutes: plan.estimatedMinutes, resumed: false,
    split: engine.splitLessons(plan.steps, 0),
    inLesson: 0, index: 0, total: plan.steps.length,
  };
}

/** 途中セッションの、まだ出していない手順。 */
function restSteps(resume) {
  return (resume.cardIds || []).slice(resume.index).map((id, i) => ({
    cardId: id,
    exercise: (resume.exercises || [])[resume.index + i] || 'recall',
  }));
}

/** 既定の学習モード。プロファイルの先頭で、画面操作ができるもの。 */
function defaultModeId() {
  const ids = engine.profile.availableModes.filter(id => MODES[id].screenInteraction !== 'none');
  return ids.includes('study20') ? 'study20' : ids[0];
}

/**
 * 学習状況。**数え上げられる事実だけ。**
 * 「覚えた」の数え方は engine が決める (何度か出していて、覚え具合が高いもの)。
 * 1回正解しただけのものを「覚えた」に入れると、実態より多く見える。
 */
/**
 * 直近7日。「続いている」が一目で分かればよいので、大きな暦は作らない。
 * ✓ が付くのは、その日に1問でも解いた日。
 */
function renderWeek(root) {
  const days = [];
  for (let i = 6; i >= 0; i--) days.push(engine.shiftDays(today.today, -i));
  const answered = new Set();
  for (const e of state.events || []) {
    if (e && e.at) answered.add(localDayOf(e.at));
  }
  const LABEL = ['日', '月', '火', '水', '木', '金', '土'];

  const row = el('div', { class: 'week' });
  for (const d of days) {
    const on = answered.has(d);
    const isToday = d === today.today;
    const wd = LABEL[new Date(d + 'T00:00:00Z').getUTCDay()];
    row.appendChild(el('div', {
      class: 'wd' + (on ? ' wd-on' : '') + (isToday ? ' wd-today' : ''),
      attrs: { 'aria-label': `${d} ${on ? '学習した' : '学習していない'}` },
    }, [
      el('div', { class: 'wd-l', text: wd }),
      el('div', { class: 'wd-m', text: on ? '✓' : '・' }),
    ]));
  }
  root.appendChild(row);
}

function renderStats(root) {
  const cards = Object.values(state.cards);
  const s = engine.statsFor({
    cards, events: state.events || [], todayIso: today.today, dayOf: localDayOf,

  const box = el('div', { class: 'stats' });

    el('div', {}, [el('span', { text: label }), note ? el('div', {}, [el('i', { text: note })]) : null]),
    el('b', { text: String(n) }),

  root.appendChild(el('div', { class: 'grp-h', text: 'この7日間' }));
  renderWeek(root);

  root.appendChild(el('div', { class: 'grp-h', text: '今日' }));
  row(s.answeredToday, '答えた問題', '');
  root.appendChild(box);

  const box2 = el('div', { class: 'stats' });
  const row2 = (n, label, note) => box2.appendChild(el('div', { class: 'stat' }, [
    el('div', {}, [el('span', { text: label }), note ? el('div', {}, [el('i', { text: note })]) : null]),
    el('b', { text: String(n) }),

  root.appendChild(el('div', { class: 'grp-h', text: '今週（直近7日）' }));

    el('div', {}, [

  box3.appendChild(el('div', { class: 'stat' }, [
    el('div', {}, [el('span', { text: '一度でも学習した表現' })]),

/** クリップボードへ入れる。効かない端末では false を返し、案内を切り替える。 */
async function copyText(node) {
  try {
    node.focus();
    node.setSelectionRange(0, node.value.length);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(node.value);
      return true;
    }
  } catch (e) { /* 下の案内へ落とす */ }
  return false;
}

// ---------- 組み合わせ練習 ----------
/**
 * 日本語とモンゴル語を合わせる練習。
 *
 * **これは「見て分かる」練習で、「自分で言える」練習ではない。**
 * 産出より明らかに簡単なので、覚え具合も次回の出題日も動かさない。
 * ここで全部合っても「言えるようになった」ことにはならないため。
 * 出すのは既にある教材の正しい組だけで、新しい対応づけは作らない。
 */
let matchState = null;

function startMatch() {
  const cards = Object.values(state.cards).filter(c => (c.reps || 0) > 0);
  const pool = cards.length >= 5 ? cards : Object.values(state.cards);
  const round = engine.matchRound({ cards: pool, size: 5 });
  if (!round) { showNotice('組み合わせに使える表現がまだありません'); return; }
  matchState = { round, picked: null, solved: new Set(), tries: 0 };
  renderMatch();
}

/**
 * 画面を組み立てる。**押すたびに全部作り直さない。**
 * 作り直すと押した感触が途切れ、読み上げの位置も失われる。
 * 変わったボタンの見た目だけを書き換える。
 */
function renderMatch() {
  const { round } = matchState;
  $('match-lead').textContent = '同じ意味どうしを選んでください。'
    + 'この練習は覚え具合には影響しません（見て分かるのと、自分で言えるのは別のため）。';
  const grid = $('match-grid');
  clear(grid);
  matchState.buttons = [];

  // 2列なので、左→右→左→右 の順に入れる
  for (let i = 0; i < round.left.length; i++) {
    for (const [side, it] of [['left', round.left[i]], ['right', round.right[i]]]) {
      const btn = el('button', {
        text: it.text,
        attrs: { type: 'button', 'aria-pressed': 'false' },
        on: { click: () => pickMatch(side, it.id) },
      });
      matchState.buttons.push({ side, id: it.id, node: btn });
      grid.appendChild(btn);
    }
  }
  paintMatch();
  showScreen('match');
}

/** 見た目だけを今の状態に合わせる。 */
function paintMatch() {
  const { solved, picked, buttons, round } = matchState;
  for (const b of buttons) {
    const done = solved.has(b.id);
    const on = !!picked && picked.side === b.side && picked.id === b.id;
    b.node.className = done ? 'm-hit' : '';
    b.node.setAttribute('aria-pressed', String(on));
    if (done) b.node.setAttribute('disabled', 'disabled');
    else b.node.removeAttribute('disabled');
  }
  $('match-n').textContent = `${solved.size} / ${round.pairs.length} 組`;
  $('match-again').hidden = solved.size < round.pairs.length;
}

function pickMatch(side, id) {
  const st = matchState;
  if (!st || st.solved.has(id)) return;
  // 同じ側をもう一度押したら選び直し
  if (!st.picked || st.picked.side === side) { st.picked = { side, id }; return paintMatch(); }

  st.tries += 1;
  const hit = engine.matchIsCorrect(st.round, st.picked.id, id);
  st.picked = null;
  if (hit) {
    st.solved.add(id);
    paintMatch();
    // **記録は付けない。**覚え具合・次回の出題日・教材の状態を1つも動かさない
  } else {
    paintMatch();
    flashMiss();
  }
}

function flashMiss() {
  const box = $('tap-ack');
  clear(box);
  box.className = 'ng';
  box.appendChild(el('span', { class: 'ack-mark', text: '↻' }));
  box.appendChild(el('span', { text: 'ちがいます' }));
  box.hidden = false;
  if (ackTimer) clearTimeout(ackTimer);
  ackTimer = setTimeout(() => { ackTimer = null; box.hidden = true; }, ACK_MS);
}

// ---------- セッション ----------
/**
 * その日の出題を組む。ホームの問題数表示と実際の出題で同じ経路を通す。
 * **学習ロジックは engine が決める。**ここは呼び出すだけ。
 */
function planFor(modeId) {
  const cards = Object.values(state.cards);
  const fresh = engine.freshCandidates(cards);   // 何が「新規」かも engine が決める
  const cd = curriculumDay(today.day);
  const base = {
    modeId, cards, events: state.events || [], freshCards: fresh,
    learningDayIso: today.today, nowIso: new Date().toISOString(), day: today.day,
    // 音声という機能自体が使えるか。false なら聞き取り問題は1問も作られない
    audioAvailable: caps.audio,
    hasAudio: id => caps.audioFor(id),
    // 「その日すでに出した新規語」を数えるための暦日の決め方。
    // 時間帯の扱いはアプリ側の責務なので、engine には関数として渡す
    dayOf: localDayOf,
  };
  let plan = engine.planSession({ ...base, plannedNewVocab: cd ? cd.vocab.newCount : undefined });

  // カリキュラムの予定どおりだと1問も出ない日がある。Day1〜3 は文字の練習期間で
  // 新規語彙の予定が0語だが、**その文字の練習教材がこの版に入っていない**。
  // 予定を守ると初日に何もできず、学習が始まらない。
  // 試験日 (milestone) は別で、そこは意図的に新規を入れないので前倒ししない。
  if (plan.ok && plan.steps.length === 0 && cd && !cd.milestone) {
    const fallback = engine.planSession({ ...base, plannedNewVocab: undefined });
    if (fallback.ok && fallback.steps.length > 0) return { ...fallback, advanced: true };
  }
  return plan;
}

/**
 * 途中で閉じたセッションの続き。
 *
 * 保存するのは「その日にどのカードを、どこまで出したか」だけ。
 * 学習の結果 (カードの状態・出題記録) は解答のたびに engine が保存済みなので、
 * ここが消えても記録は失われない。**既存の保存形式は壊さない**ため、
 * 無い場合は単に「続きは無い」として扱う。
 */
function resumableSession() {
  const s = state.session;
  if (!s || s.day !== today.today) return null;              // 日付をまたいだら続けない
  if (!Array.isArray(s.cardIds) || s.index >= s.cardIds.length) return null;
  if (!s.cardIds.every(id => state.cards[id])) return null;
  return s;
}

function saveSession() {
  state.session = queue.length ? {
    day: today.today,
    cardIds: queue.map(q => q.cardId),
    sources: queue.map(q => q.source),
    // 出題形式も一緒に残す。無い古い記録は「思い出す」として読み直す
    exercises: queue.map(q => q.exercise),
    index: qIndex,
    stats: sessionStats,
  } : null;
}

function clearSession() { state.session = null; }

/**
 * 学習を始める / 続ける。
 *
 * **1回は5問で切り上げられる。** その日の出題そのものは engine が組んだ
 * 1本のままで、どこまでを1回とみなすかだけを変えている。
 * 「30問やらないと終われない」と感じさせないための切り方で、
 * 出題の順番・SRS・1日の新規語の上限には一切触っていない。
 */
function startSession(modeId) {
  if (today.state === 'before_start') return;
  sessionKind = 'daily';

  // 続きがあれば、そこから再開する。**解答済みの問題はもう出さない**
  // (index から先だけを出すので、同じ問題が二重に記録されることはない)
  const resume = !modeId ? resumableSession() : null;
  if (resume) {
    queue = resume.cardIds.map((id, i) => {
      const ex = (resume.exercises || [])[i] || 'recall';
      return {
        cardId: id, source: (resume.sources || [])[i] || 'review',
        exercise: ex, graded: engine.gradedExercises.includes(ex),
      };
    });
    qIndex = resume.index;
    sessionStats = resume.stats || { answered: 0, correct: 0, wrong: 0, relearn: 0 };
    beginLesson();
    showScreen('session');
    return nextItem();
  }

  const plan = planFor(modeId || defaultModeId());
  if (!plan.ok) { showNotice('この学習時間の設定では使えないモードです'); return; }
  if (!plan.steps.length) { showNotice('今日の出題はありません'); return; }

  // 出題形式まで engine が決めたものをそのまま使う
  queue = plan.steps;
  qIndex = 0;
  sessionStats = { answered: 0, correct: 0, wrong: 0, relearn: 0 };
  // 5分だけ復習は、それ自体が1回分なので途中で切らない
  sessionKind = modeId === 'sprint5' ? 'practice' : 'daily';
  beginLesson();
  if (sessionKind === 'daily') { saveSession(); storage.save(state); }
  showScreen('session');
  nextItem();
}

/** いまのミニレッスンの区切りを決める。切り方の計算は engine が持つ。 */
function beginLesson() {
  lessonStats = { steps: 0, answered: 0, correct: 0, wrong: 0, introduced: 0 };
  lessonEnd = sessionKind === 'daily'
    ? engine.endOfLesson(qIndex, queue.length)
    : queue.length;
}

function currentCard() {
  const item = queue[qIndex];
  return item ? state.cards[item.cardId] : null;
}

/**
 * 1問を出す。出題形式は engine が決めたものに従う。
 *
 *   introduce  はじめての語。母語と目標言語を最初から見せる。**採点しない。**
 *   recall     日本語を見て、モンゴル語を自分で言う
 *   listening  音を聞いて、意味を思い出す（音声が入るまで1問も出ない）
 */
function nextItem() {
  audio.stop();        // 前の問題の音を必ず止める（音声が無い版では何も起きない）
  hideAck();
  busy = false;

  if (qIndex >= queue.length) return endSession();
  // ミニレッスンの区切り。ここでいったん切り上げ、続けるかを選んでもらう
  if (qIndex >= lessonEnd) return endLesson();
  const item = queue[qIndex];
  const card = state.cards[item.cardId];
  if (!card) { qIndex += 1; return nextItem(); }

  const ex = item.exercise || 'recall';
  const listening = ex === 'listening';
  const introduce = ex === 'introduce';
  const hasAudio = caps.audioFor(card.id);

  revealed = false;
  $('field-row').hidden = true;
  // はじめて見る語には「実際の会話で使った」を出さない。まだ使いようがない
  $('field-open').hidden = introduce;
  $('intro-lead').hidden = !introduce;

  // 聞き取りのときだけ、日本語を伏せて音を主役にする
  $('listen-prompt').hidden = !listening;
  $('prompt').hidden = listening;
  $('prompt').textContent = listening ? '' : card.promptKey;

  // 教材文字列は textContent で入れる。連結もテンプレートも使わない
  $('answer').textContent = card.answerKey;
  $('answer-ja').textContent = listening ? card.promptKey : '';
  $('answer-ja').hidden = !listening;

  // 音声が使えない版では、音に関するものを一切出さない
  $('speak-btn').hidden = !hasAudio;
  $('replay-btn').hidden = !hasAudio;
  const note = $('audio-note');
  note.textContent = hasAudio ? caps.audioLabel : '';
  note.hidden = !hasAudio;

  renderFav(card);

  // introduce は最初から答えを見せる。判定はしない
  $('answer-box').hidden = !introduce;
  $('reveal-btn').hidden = introduce;
  $('next-btn').hidden = !introduce;
  $('judge-row').hidden = true;
  if (introduce) {
    revealed = true;
    if (hasAudio) audio.play(card.id);
  } else if (listening && hasAudio) {
    audio.play(card.id);
  }

  $('keyhint').textContent = introduce
    ? 'Space = 次へ' : 'Space = 答え / ← 言えなかった / → 言えた';

  $('progress').textContent = `${qIndex + 1} / ${queue.length}`;
  $('progress-bar').style.width = `${(qIndex / queue.length) * 100}%`;

  // T2: 表示時刻を実測する
  shownAt = performance.now();
}

/**
 * 答えを見せる。
 *
 * 参考音声があれば、このタップの中で鳴らす。答えを見た直後に音を聞き、
 * もう一度声に出してから判定する、という流れにするため。
 * 音声が無い版では何も起きず、流れだけが同じに保たれる。
 */
function reveal() {
  if (revealed || busy) return;
  revealed = true;
  const card = currentCard();
  $('answer-box').hidden = false;
  $('reveal-btn').hidden = true;
  $('judge-row').hidden = false;
  if (card && caps.audioFor(card.id)) audio.play(card.id);
  // 実使用の記録は自動で開かない。「実際の会話で使った」を押したときだけ。
}

/** はじめての語を見せ終えたとき。**採点はしない**（接触しただけなので）。 */
function advanceIntroduce() {
  if (busy) return;
  const item = queue[qIndex];
  if (!item || item.graded) return;
  audio.stop();
  lessonStats.steps += 1;
  lessonStats.introduced += 1;
  bumpDailyProgress();
  qIndex += 1;
  if (sessionKind === 'daily') { saveSession(); storage.save(state); }
  nextItem();
}

/** スピーカー。押せば必ず鳴る。連打しても二重には鳴らない。 */
function playCurrent() {
  const card = currentCard();
  if (card) audio.play(card.id);
}

// ---------- 押したことが分かる合図 ----------
/**
 * 判定を押したあと、短く合図を出してから自動で次へ進む。
 *
 * 「押したのに何も起きない」状態を無くすためだけのもので、
 * ゲーム的な演出はしない。次に進むための追加のタップも要らない。
 * 再出題の時刻は engine が決める。画面の都合で即座に出し直さない。
 */
const ACK_MS = 420;
let ackTimer = null;

function showAck(correct) {
  const box = $('tap-ack');
  clear(box);
  box.className = correct ? 'ok' : 'ng';
  box.appendChild(el('span', { class: 'ack-mark', text: correct ? '✓' : '↻' }));
  box.appendChild(el('span', { text: correct ? '言えた' : 'あとでもう一度' }));
  box.hidden = false;
}
function hideAck() {
  if (ackTimer) { clearTimeout(ackTimer); ackTimer = null; }
  $('tap-ack').hidden = true;
}

// ---------- 保存したフレーズ (お気に入り) ----------
/**
 * 覚え具合(SRS)とは**完全に別**の印。星を付けても外しても、
 * 出題の順番・次回の日・mastery は1つも動かない。
 * 商談の直前に見たいものを、社長が自分で選ぶためだけのもの。
 */
function favorites() { return state.favorites || (state.favorites = {}); }
function isFav(id) { return !!favorites()[id]; }
function toggleFav(id) {
  const f = favorites();
  if (f[id]) delete f[id]; else f[id] = { at: new Date().toISOString() };
  storage.save(state);
  return !!f[id];
}
function removeFav(id) {
  delete favorites()[id];
  storage.save(state);
}
function renderFav(card) {
  const b = $('fav-btn');
  const on = isFav(card.id);
  b.setAttribute('aria-pressed', String(on));
  b.textContent = on ? '★ 保存済み' : '☆ 保存';
}

function judge(correct) {
  if (!revealed || busy) return;
  const item = queue[qIndex];
  // 採点しない手順 (はじめての語の接触) では判定を受け付けない
  if (!item || !item.graded) return;
  const card = state.cards[item.cardId];
  // T2: 判定時刻との差を response_ms として engine に渡す
  const responseMs = Math.round(performance.now() - shownAt);
  const nowIso = new Date().toISOString();

  const r = engine.submit(card, {
    correct, responseMs,
    learningDayIso: today.today, nowIso, day: today.day,
    mode: 'session',
    // 出題形式を渡す。覚え具合の計算は形式によらず同じで、記録にだけ残る
    exercise: item.exercise || 'recall',
    remainingDays: clock.remainingDays(today.day, TOTAL_DAYS),
  });

  // UI は next日 / mastery / lapses / grade を一切計算しない。engine の結果をそのまま保存する
  state.cards[card.id] = r.card;
  state.events = state.events || [];
  state.events.push(r.event);

  sessionStats.answered += 1;
  if (correct) sessionStats.correct += 1; else sessionStats.wrong += 1;
  if (r.outcome === 'relearn_correct') sessionStats.relearn += 1;

  lessonStats.steps += 1;
  lessonStats.answered += 1;
  if (correct) lessonStats.correct += 1; else lessonStats.wrong += 1;
  bumpDailyProgress();

  qIndex += 1;
  audio.stop();
  // 練習は今日の予定とは別枠なので、途中経過を上書きしない
  if (sessionKind === 'daily') saveSession();
  const saved = storage.save(state);
  if (!saved.ok) showNotice('保存できませんでした。端末の空き容量を確認してください');

  // 合図を出してから自動で次へ。この間は判定を受け付けない(二重記録の防止)
  busy = true;
  showAck(correct);
  ackTimer = setTimeout(() => { ackTimer = null; nextItem(); }, ACK_MS);
}
// ---------- 実使用フィードバック (Field QA) ----------
/**
 * 学習の判定 (言えた/言えなかった) とは別物。
 * こちらは「実際の会話でその表現がどうなったか」だけを記録する。
 *
 * 通じなかったときは、必ず1問だけ追加で聞く:
 * 「同じモンゴル語を画面で相手に見せましたか？」
 *
 * これが要るのは、通じなかった原因が教材にあるとは限らないから。
 * 発音・速度・声量・雑音・相手が聞いていない、のどれでも同じ結果になる。
 * このアプリは発音の採点を行わない (低資源言語では判定が当てにならない) ため、
 * 文字で見せたらどうだったかが、
 * 発話の問題と教材の問題を分ける唯一の手がかりになる。
 *
 * ラベルは表示のためだけにここにある。帰属の判定も状態遷移も engine が持つ。
 * counterpartCorrection は「相手が実際に言い直した表現」の意味でのみ使う。
 */
const SPOKEN_LABELS = {
  understood: '通じた',
  repeated: '聞き返された',
  not_understood: '通じなかった',
  wrong_reaction: '相手の反応が違った',
  corrected: '相手に言い直された',
};

/** 追加の1問。選択肢の言葉は、判定ではなく起きた事実だけを言う。 */
const TEXT_LABELS = {
  understood: 'A. 文字を見せたら通じた',
  not_understood: 'B. 文字を見せても通じなかった',
  corrected: 'C. 相手が別の表現に直した',
  not_shown: 'D. 文字は見せていない',
};
const TEXT_ORDER = ['understood', 'not_understood', 'corrected', 'not_shown'];

/**
 * 「通じた」が意味すること。**この定義を広げてはいけない。**
 *   「その場面・その相手には意図が伝わった」
 * 自然さの保証でも、唯一正しい表現である証拠でも、ネイティブ品質の裏付けでもない。
 */
const UNDERSTOOD_MEANS = 'その場面・その相手には意図が伝わった、という記録です';

function fieldReportsFor(itemId) {
  return (state.fieldReports || []).filter(r => r.itemId === itemId);
}

/**
 * 実使用の記録を1件足す。
 * **教材本体の状態 (reviewStatus) は変えない。** 動くのは fieldStatus だけで、
 * 一時停止 (suspended) へは自動で進まない。
 */
function recordFieldUse(card, spokenOutcome, textCheck, counterpartCorrection) {
  state.fieldReports = state.fieldReports || [];
  const r = engine.recordFieldUse(card, {
    spokenOutcome, textCheck,
    counterpartCorrection: counterpartCorrection || null,
    nowIso: new Date().toISOString(), reports: state.fieldReports,
    context: `day${today.day == null ? '' : today.day}`,
  });
  state.fieldReports.push(r.report);
  state.cards[card.id] = engine.applyFieldStatus(state.cards[card.id], r.fieldStatus);
  const saved = storage.save(state);
  if (!saved.ok) showNotice('保存できませんでした。端末の空き容量を確認してください');
  return r;
}

/** 記録したあとに出す一文。帰属を言葉でも分けて見せる。 */
const RESULT_NOTE = {
  positive: () => UNDERSTOOD_MEANS,
  delivery_suspect: () => '文字では通じたので、教材の問題としては扱いません。話し方の練習に回します',
  content_suspect: () => '文字でも通じなかったので、教材の見直し候補に入れました',
  correction: () => '相手の言い換えを記録しました。そのまま置き換えず、再確認に回します',
  inconclusive: () => '記録しました。次に使うときは、文字を見せた結果も残すと原因が分かります',
};

function fieldButtons(labels, order, cls, onPick) {
  return order.map(key => {
    const b = el('button', {
      text: labels[key], class: cls(key),
      attrs: { type: 'button', 'data-outcome': key, 'aria-pressed': 'false' },
      on: { click: () => onPick(key, b) },
    });
    return b;
  });
}

/** 「実際の会話で使った」を押したときだけ開く。通常の学習は邪魔しない。 */
function openFieldRow() {
  const card = currentCard();
  if (!card) return;
  renderFieldRow(card);
  $('field-open').hidden = true;
  $('field-row').scrollIntoView({ block: 'nearest' });
}

/** 記録欄の中身。開いたときだけ組み立てる。 */
function renderFieldRow(card) {
  const row = $('field-row');
  const grid = $('field-buttons');
  const step2 = $('field-step2');
  const textGrid = $('field-text-buttons');
  const corr = $('field-corr');
  const done = $('field-done');
  clear(grid); clear(textGrid);
  step2.hidden = true;
  corr.className = 'field-corr';
  done.hidden = true; done.textContent = '';
  $('field-corr-input').value = '';

  const finish = (spoken, textCheck, correction) => {
    const r = recordFieldUse(card, spoken, textCheck, correction);
    done.hidden = false;
    done.textContent = RESULT_NOTE[r.attribution]();
    step2.hidden = true;
    corr.className = 'field-corr';
  };

  const askTextCheck = (spoken) => {
    clear(textGrid);
    const wide = () => 'fr-wide';
    for (const b of fieldButtons(TEXT_LABELS, TEXT_ORDER, wide, (textCheck) => {
      if (textCheck === 'corrected') {
        corr.className = 'field-corr on';
        $('field-corr-input').focus();
        $('field-corr-save').onclick = () => {
          finish(spoken, 'corrected', $('field-corr-input').value.trim() || null);
        };
        return;
      }
      finish(spoken, textCheck, null);
    })) textGrid.appendChild(b);
    step2.hidden = false;
  };

  const spokenOrder = engine.fieldSpokenOutcomes;
  const cls = k => (k === 'wrong_reaction' || k === 'corrected') ? 'fr-wide' : '';
  for (const b of fieldButtons(SPOKEN_LABELS, spokenOrder, cls, (spoken, btn) => {
    for (const other of grid.children) other.setAttribute('aria-pressed', 'false');
    btn.setAttribute('aria-pressed', 'true');
    // 選び直したときに前の結果表示が残らないようにする
    done.hidden = true; done.textContent = '';
    corr.className = 'field-corr';
    $('field-corr-input').value = '';
    // 「通じた」は1タップで終わり。負の結果のときだけ原因を切り分ける。
    if (engine.fieldNegativeOutcomes.includes(spoken)) askTextCheck(spoken);
    else finish(spoken, 'not_shown', null);
  })) grid.appendChild(b);

  row.hidden = false;
}


/**
 * ミニレッスンの区切り。**まだ今日の分は残っている。**
 *
 * ここで「次の5問」か「今日はここまで」を選べるようにする。
 * 全部やらないと終われない、と感じさせないための区切り。
 */
function endLesson() {
  audio.stop();
  hideAck();
  busy = false;

  const n = lessonNumberOf(qIndex);
  showCheer({
    mark: '✓',
    title: `レッスン ${n} 完了`,
    // 見出しは「この回でやった数」。覚える手順も1つと数える。
    // 判定した数だけを出すと、新しい語ばかりの回で「1問」になって実感と合わない
    count: lessonStats.steps,
    learned: lessonStats.introduced,
    ok: lessonStats.correct,
    ng: lessonStats.wrong,
    note: goalNote(),
    streak: null,
    next: '次の5問',
  });
  if (sessionKind === 'daily') { saveSession(); storage.save(state); }
  bumpStreak();
  planCache = null;
}

/** この回で見せた「新しい語」の数。判定していないので、成績とは別に数える。 */
function introducedInSession() {
  return queue.slice(0, qIndex).filter(q => !q.graded).length;
}

/** 何番目のレッスンを終えたか。切り方の計算は engine が持つ。 */
function lessonNumberOf(index) {
  return Math.max(1, Math.ceil(index / engine.lessonSize));
}

/**
 * 目標に対する一言。**連続学習日(🔥)とは条件が違う**ので、
 * 足りないときは何問足りないかをそのまま書く。
 */
function goalNote() {
  const steps = dailyProgress();
  if (!engine.goalMet(steps)) return `今日の目標まで あと ${engine.dailyGoal - steps}問`;
  const need = engine.streakMinAnswers - answeredOnDay(today.today);
  if (need > 0) return `✓ 今日も前進。連続記録がつくまで あと ${need}問`;
  return '✓ 今日も前進';
}

/**
 * 今日の分を全部終えたとき。**ここだけ少し特別にする。**
 * 覚え具合やSRSの内部の値は出さない。
 */
function endSession() {
  audio.stop();
  hideAck();
  busy = false;

  const finished = qIndex >= queue.length;
  // 最後まで終わったら続きは無い。途中で終了した場合は残しておく
  if (sessionKind === 'daily') {
    if (finished) clearSession(); else saveSession();
  }
  bumpStreak();
  planCache = null;

  if (sessionKind === 'practice') {
    showCheer({
      mark: '✓', title: '練習 完了',
      count: sessionStats.answered, ok: sessionStats.correct, ng: sessionStats.wrong,
      note: goalNote(), streak: null, next: null,
    });
    return;
  }

  const st = engine.displayStreak(state.streak, today.today);
  showCheer({
    mark: finished ? '🎉' : '✓',
    title: finished ? `Day ${today.day} 完了` : '今日はここまで',
    count: sessionStats.answered + introducedInSession(),
    learned: introducedInSession(),
    ok: sessionStats.correct,
    ng: sessionStats.wrong,
    note: finished
      ? (today.day != null && today.day < TOTAL_DAYS ? `明日は Day ${today.day + 1}` : '')
      : `今日の残り ${Math.max(0, queue.length - qIndex)}問`,
    streak: finished && st.count > 0 ? `🔥 ${st.count}日連続` : null,
    next: finished ? null : '続きの5問',
  });
}

/** 完了画面。レッスンの区切りも1日の完了も、同じ場所を使い分ける。 */
function showCheer(p) {
  $('done-mark').textContent = p.mark;
  $('done-t').textContent = p.title;
  $('done-count').textContent = String(p.count);
  $('done-ok').textContent = String(p.ok);
  $('done-ng').textContent = String(p.ng);

  // 「覚えた」は新しく見せた語の数。判定していないので、言えた/言えなかった とは別に出す。
  // 3つ足すと見出しの数になるようにして、数字が合わない画面にしない
  const learned = $('done-learned');
  learned.parentElement.hidden = !(p.learned > 0);
  learned.textContent = String(p.learned || 0);

  const streak = $('done-streak');
  streak.textContent = p.streak || '';
  streak.hidden = !p.streak;

  const note = $('done-note');
  note.textContent = p.note || '';
  note.hidden = !p.note;

  $('next-lesson').hidden = !p.next;
  if (p.next) $('next-lesson').textContent = p.next;
  // 続きがあるときは「次の5問」を主役にし、切り上げるほうは控えめにする。
  // 同じ見た目のボタンを2つ並べると、どちらを押すのか毎回考えることになる
  const back = $('back-home');
  back.textContent = p.next ? '今日はここまで' : 'ホームへ';
  back.className = p.next ? 'ghost' : 'primary';

  showScreen('summary');
}

/** 続きの5問へ。区切り直して同じセッションを続ける。 */
function continueLesson() {
  if (qIndex >= queue.length) return goHome();
  beginLesson();
  showScreen('session');
  nextItem();
}

/**
 * 連続学習日の更新。**条件は engine/streak.js が持つ既存のもののまま。**
 * ミニレッスンを1つ終えただけでは足りない場合があるが、
 * その基準をここで緩めない (緩めると「記録を守るための1分学習」が起きる)。
 */
function bumpStreak() {
  const r = engine.updateStreak(state.streak, {
    learningDayIso: today.today, answeredToday: answeredOnDay(today.today),
  });
  state.streak = r.streak;
  storage.save(state);
}

/** その暦日に解いた問題数。streak の最低学習条件の判定に使う。 */
function answeredOnDay(dayIso) {
  return engine.answeredOn(state.events || [], dayIso, localDayOf);
}
function localDayOf(iso) {
  return clock.dayIso(new Date(iso), state.settings.timeZone || 'Asia/Tokyo');
}

// ---------- 保存したフレーズ / 商談の直前に見る ----------
/**
 * どちらも**見るだけの画面**。判定ボタンは置かない。
 *
 * 覚え具合(SRS)・連続日数を1つも動かさないのは意図的で、商談5分前に眺めたことを
 * 「復習した」と数えてしまうと、次にいつ出すかの計算が狂うため。
 * 出てくるモンゴル語は既にある教材そのままで、ここで新しくは作らない。
 */
const PHRASE_VIEWS = {
  briefing: {
    lead: '商談で話す順に並べてあります。読むだけなので、学習の記録には影響しません。'
      + '声に出して1回言ってから会うと出やすくなります。',
    groups: () => (mnPack.briefing ? mnPack.briefing.topics : [])
      .map(t => ({ label: t.label, ids: t.items.filter(id => state.cards[id]) }))
      .filter(g => g.ids.length),
    deletable: false,
  },
  favorites: {
    lead: '学習中に「☆ 保存」を押したものが、新しい順に並びます。'
      + '読むだけなので、学習の記録には影響しません。',
    groups: () => {
      const f = favorites();
      const ids = Object.keys(f)
        .filter(id => state.cards[id])
        .sort((a, b) => String(f[b].at).localeCompare(String(f[a].at)));
      return ids.length ? [{ label: null, ids }] : [];
    },
    deletable: true,
  },
};

function renderPhrases(viewId) {
  const view = PHRASE_VIEWS[viewId];
  const body = $('sheet-body');
  clear(body);
  body.appendChild(el('p', { class: 'ph-lead', text: view.lead }));

  const groups = view.groups();
  if (!groups.length) {
    body.appendChild(el('p', { class: 'fr-empty',
      text: viewId === 'favorites'
        ? 'まだ保存したフレーズがありません。学習中に「☆ 保存」を押すと、ここに並びます。'
        : '表示できる表現がありません。' }));
    return;
  }

  for (const g of groups) {
    if (g.label) body.appendChild(el('div', { class: 'ph-topic', text: g.label }));
    for (const id of g.ids) {
      const card = state.cards[id];
      const row = el('div', { class: 'ph-item' }, [
        el('div', { class: 'ph-txt' }, [
          el('div', { class: 'ph-ja', text: card.promptKey }),
          el('div', { class: 'ph-mn', text: card.answerKey }),
        ]),
        // 音声が入れば、ここにスピーカーが並ぶ。無いあいだは出さない
        caps.audioFor(id) ? el('button', {
          class: 'spk', attrs: { type: 'button', 'aria-label': `${card.promptKey} を聞く` },
          on: { click: () => audio.play(id) },
        }, [speakerIcon()]) : null,
        view.deletable
          ? el('button', {
            class: 'ph-del', attrs: { type: 'button', 'aria-label': `${card.promptKey} を保存から外す` },
            text: '削除',
            on: { click: () => { removeFav(id); renderPhrases(viewId); } },
          })
          : el('button', {
            class: 'fav', attrs: { type: 'button', 'aria-pressed': String(isFav(id)),
              'aria-label': `${card.promptKey} を保存` },
            text: isFav(id) ? '★' : '☆',
            on: { click: (e) => {
              const on = toggleFav(id);
              e.currentTarget.setAttribute('aria-pressed', String(on));
              e.currentTarget.textContent = on ? '★' : '☆';
            } },
          }),
      ]);
      body.appendChild(row);
    }
  }
}

/** スピーカーの絵。画像ファイルを読まないよう、その場で組み立てる。 */

/** ホームから開く一覧。直近に学習した表現へ、あとからでも記録できる。 */
function renderFieldLog() {
  const body = $('fieldlog-body');
  clear(body);
  const seen = new Set();
  const recent = [...(state.events || [])].reverse()
    .map(e => e.cardId).filter(id => id && state.cards[id] && !seen.has(id) && seen.add(id))
    .slice(0, 20);

  if (!recent.length) {
    body.appendChild(el('p', { class: 'fr-empty', text: 'まだ学習した表現がありません。' }));
    return;
  }
  for (const id of recent) {
    const card = state.cards[id];
    const grid = el('div', { class: 'field-grid' });
    const status = el('div', { class: 'field-done', text: '' });
    status.hidden = true;

    const cls = k => (k === 'wrong_reaction' || k === 'corrected') ? 'fr-wide' : '';
    for (const b of fieldButtons(SPOKEN_LABELS, engine.fieldSpokenOutcomes, cls, (spoken, btn) => {
      let textCheck = 'not_shown', correction = null;
      if (engine.fieldNegativeOutcomes.includes(spoken)) {
        const pick = window.prompt(
          '同じモンゴル語を画面で相手に見せましたか？\n'
          + 'A: 文字を見せたら通じた\nB: 文字を見せても通じなかった\n'
          + 'C: 相手が別の表現に直した\nD: 文字は見せていない', 'D');
        const map = { a: 'understood', b: 'not_understood', c: 'corrected', d: 'not_shown' };
        textCheck = map[String(pick || 'd').trim().toLowerCase()] || 'not_shown';
        if (textCheck === 'corrected') {
          correction = (window.prompt('相手が実際に言い直した表現') || '').trim() || null;
        }
      }
      const r = recordFieldUse(card, spoken, textCheck, correction);
      btn.setAttribute('aria-pressed', 'true');
      status.hidden = false;
      status.textContent = RESULT_NOTE[r.attribution]();
    })) grid.appendChild(b);

    const n = fieldReportsFor(id).length;
    body.appendChild(el('div', { class: 'fr-item' }, [
      el('div', { class: 'fr-ja', text: card.promptKey }),
      el('div', { class: 'fr-mn', text: card.answerKey }),
      grid, status,
      n ? el('div', { class: 'field-h', text: `これまでの記録 ${n} 件（版 ${card.contentRevision || 1}）` }) : null,
    ]));
  }
}

// ---------- C2: 節目チェックポイント ----------
/** 節目の日なら画面を出す。出したら true を返す。 */
function maybeShowCheckpoint() {
  if (today.day == null) return false;
  const cp = engine.checkpointFor(today.day);
  if (!cp) return false;
  const done = (state.checkpoints || {})[today.day];
  if (done && done.acknowledged) return false;
  renderCheckpoint(cp, done);
  return true;
}

function renderCheckpoint(cp, saved) {
  const root = $('cp-body');
  clear(root);
  root.appendChild(el('div', { class: 'ob-step', text: `Day ${cp.day} ・ ${cp.cefr}` }));
  root.appendChild(el('h2', { text: `${cp.label}の確認` }));

  root.appendChild(el('div', { class: 'section-label', text: 'できるようになっているか' }));
  const list = el('div', { class: 'cp-list' });
  for (const c of cp.canDo) {
    list.appendChild(el('div', { class: 'cp-row' }, [
      el('span', { class: 'cp-txt', text: c.text }),
      el('span', { class: 'cp-judge cp-' + c.judge, text: c.judge === 'tutor' ? '講師が判定' : '自動' }),
    ]));
  }
  root.appendChild(list);

  const scores = (saved && saved.scores) || {};
  const result = engine.evaluateCheckpoint(cp.day, scores);
  const verdict = el('div', { class: 'cp-verdict' });
  if (!result || result.status === 'not_taken') {
    verdict.classList.add('cp-pending');
    verdict.appendChild(el('div', { class: 'cp-v-t', text: 'まだ受けていません' }));
    verdict.appendChild(el('div', { class: 'cp-v-d', text: `自動採点 ${cp.autoSections.length}節 と、講師による判定 ${cp.humanSections.length}節 があります。` }));
  } else if (result.status === 'pending_human') {
    verdict.classList.add('cp-pending');
    verdict.appendChild(el('div', { class: 'cp-v-t', text: '講師の判定待ち' }));
    verdict.appendChild(el('div', { class: 'cp-v-d',
      text: `自動採点は終わっていますが、${result.humanJudgementPending.join(' と ')} を講師が判定するまで合否は出ません。発音と自然さは自動では判定できません。` }));
  } else if (result.status === 'passed') {
    verdict.classList.add('cp-passed');
    verdict.appendChild(el('div', { class: 'cp-v-t', text: '合格' }));
    verdict.appendChild(el('div', { class: 'cp-v-d', text: `総合 ${Math.round(result.overall * 100)}%` }));
  } else {
    verdict.classList.add('cp-failed');
    verdict.appendChild(el('div', { class: 'cp-v-t', text: '未達' }));
    verdict.appendChild(el('div', { class: 'cp-v-d',
      text: `${result.failedSections.join(' / ')} が基準に届いていません。${result.action ? result.action.rationale : ''}` }));
  }
  root.appendChild(verdict);

  if (cp.outOfScope) {
    root.appendChild(el('div', { class: 'cp-note', text: 'この時点で到達していないこと: ' + cp.outOfScope.join(' / ') }));
  }
  showScreen('checkpoint');
}

function wire() {
  // 押す場所を1つにする。学習の長さを選ばせない
  $('start-btn').addEventListener('click', () => startSession(null));
  // 練習は「その他」からも、ホームの下からも1タップで開ける
  $('practice-btn').addEventListener('click', () => openSheet('practice'));
  $('next-lesson').addEventListener('click', continueLesson);
  $('match-again').addEventListener('click', startMatch);
  $('match-back').addEventListener('click', () => openSheet('practice'));
  $('reveal-btn').addEventListener('click', reveal);
  $('next-btn').addEventListener('click', advanceIntroduce);
  $('judge-wrong').addEventListener('click', () => judge(false));
  $('judge-ok').addEventListener('click', () => judge(true));
  $('quit-btn').addEventListener('click', endSession);
  $('field-open').addEventListener('click', openFieldRow);
  // 参考音声。押せば必ず鳴る。速度は変えない (遅くすると別の音になるため)
  $('speak-btn').addEventListener('click', playCurrent);
  $('replay-btn').addEventListener('click', playCurrent);
  $('listen-big').addEventListener('click', playCurrent);
  $('fav-btn').addEventListener('click', () => {
    const card = currentCard();
    if (card) { toggleFav(card.id); renderFav(card); }
  });
  $('back-home').addEventListener('click', goHome);
  $('more-btn').addEventListener('click', () => { showScreen('more'); renderMore(); });
  $('more-back').addEventListener('click', goHome);
  $('sheet-back').addEventListener('click', () => { showScreen('more'); renderMore(); });
  $('fieldlog-back').addEventListener('click', () => { showScreen('more'); renderMore(); });
  $('update-btn').addEventListener('click', applyUpdate);
  $('cp-continue').addEventListener('click', () => {
    // 確認済みの印を残す。合否そのものは講師の判定が入るまで確定しない
    state.checkpoints = state.checkpoints || {};
    const d = today.day;
    state.checkpoints[d] = { ...(state.checkpoints[d] || {}), acknowledged: true, acknowledgedAt: new Date().toISOString() };
    storage.save(state);
    goHome();
  });

  // キーボード。Space = 答え/次へ / ← = 失敗 / → = 正解
  document.addEventListener('keydown', (e) => {
    if ($('session').hidden) return;
    const item = queue[qIndex];
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (item && !item.graded) advanceIntroduce(); else reveal();
    } else if (e.key === 'ArrowLeft') { e.preventDefault(); judge(false); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); judge(true); }
  });

  // 別のアプリへ切り替えたとき、音を鳴らしっぱなしにしない。
  // 戻ってきたら、スピーカーを押せばそのまま続けられる。
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') audio.stop();
  });
}

// ---------- 新しい版の受け取り ----------
/**
 * 一度読み込めば、通信が弱くてもアプリ本体と教材が開けるようにする。
 *
 * **勝手に読み込み直さない。** 学習の途中で画面が入れ替わると、
 * どこまで進んだか分からなくなる。新しい版が来たら「その他」に静かに出し、
 * 押されたときだけ切り替える。
 *
 * 保存領域(localStorage)には一切触らない。版が変わっても学習記録は残る。
 */
let waitingWorker = null;

function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  // file:// で開いた1ファイル版では登録できない (安全な文脈でないため)。
  // isSecureContext は https と localhost/127.0.0.1 で true、file:// で false。
  // ホスト名を並べて判定すると必ず取りこぼす。登録できなくてもアプリは動く。
  if (!window.isSecureContext) return;
  navigator.serviceWorker.register('sw.js').then((reg) => {
    if (reg.waiting) markUpdateReady(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const sw = reg.installing;
      if (!sw) return;
      sw.addEventListener('statechange', () => {
        // 既に動いている版があるときだけ「更新」。初回のインストールは黙って終わる
        if (sw.state === 'installed' && navigator.serviceWorker.controller) markUpdateReady(sw);
      });
    });
  }).catch(() => { /* 登録できなくてもアプリは動く */ });
}

function markUpdateReady(sw) {
  waitingWorker = sw;
  updateReady = true;
  if (currentScreen === 'more') renderMore();
}

/** 「更新があります」を押したとき。学習中には押せない位置にしか出していない。 */
function applyUpdate() {
  if (!waitingWorker) { location.reload(); return; }
  // 切り替わったら1回だけ読み込み直す
  navigator.serviceWorker.addEventListener('controllerchange', () => location.reload(), { once: true });
  waitingWorker.postMessage({ type: 'SKIP_WAITING' });
}

// Safari の 100vh 問題。実測した viewport 高さを CSS 変数に入れる
function setViewportUnit() {
  document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
}
window.addEventListener('resize', setViewportUnit);
window.addEventListener('orientationchange', setViewportUnit);

setViewportUnit();
wire();
boot();
registerServiceWorker();
